<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>运费促销策略配置中台</title>

  <!-- === CDN 依赖 === -->
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- Element Plus 样式 -->
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <!-- Element Plus JS -->
  <script src="https://unpkg.com/element-plus"></script>
  <!-- Element Plus Icons -->
  <script src="https://unpkg.com/@element-plus/icons-vue"></script>
  <!-- SheetJS (Excel) -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

  <!-- === 本地样式 === -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app" v-loading.fullscreen.lock="fullscreenLoading">

  <!-- =============================================
       顶部导航
  ============================================= -->
  <header class="top-header">
    <div class="header-logo">
      <el-icon :size="24" color="#409EFC"><Grid /></el-icon>
      运费促销策略配置中台
      <el-tag size="small" effect="dark" type="info" round>v2.1</el-tag>
    </div>
    <div class="store-controls">
      <span style="font-size: 13px; color: #86909c;">🏢 当前环境配置：</span>
      <el-select v-model="currentStoreId" @change="handleStoreChange"
                 style="width: 180px" placeholder="请选择配置">
        <el-option v-for="(config, id) in storeConfigs"
                   :key="id" :label="config.name" :value="id" />
      </el-select>
      <el-button type="primary" plain @click="createNewStore" :icon="Plus">新建配置</el-button>
      <el-button type="primary" @click="saveConfig" :icon="Check">保存策略</el-button>

      <el-divider direction="vertical"></el-divider>

      <el-button type="success" plain @click="exportStoreConfig" :icon="Download">导出配置</el-button>
      <el-button type="warning" plain @click="triggerImportConfig" :icon="Upload">导入配置</el-button>
      <input type="file" ref="importConfigInput"
             style="display: none" accept=".json" @change="handleImportConfig" />

      <el-dropdown @command="handleStoreCommand" trigger="click" style="margin-left:5px;">
        <el-button :icon="More" circle
                   style="background: transparent; color: white; border-color: #4c515b;"></el-button>
        <template #dropdown>
          <el-dropdown-menu>
            <el-dropdown-item command="rename" :icon="Edit">重命名</el-dropdown-item>
            <el-dropdown-item command="delete" :icon="Delete" style="color: #F56C6C;">删除配置</el-dropdown-item>
          </el-dropdown-menu>
        </template>
      </el-dropdown>
    </div>
  </header>

  <!-- =============================================
       主体内容
  ============================================= -->
  <main class="main-container">

    <!-- ===== 模块1：数据源接入与全局映射 ===== -->
    <el-card>
      <div class="section-title">
        <el-icon color="#409EFC"><DataLine /></el-icon>
        数据源接入与字段映射
      </div>
      <el-row :gutter="24" style="align-items: center;">
        <el-col :span="5">
          <el-upload
            class="upload-trigger"
            action=""
            :auto-upload="false"
            :show-file-list="false"
            accept=".xlsx, .xls, .json"
            :on-change="handleFileUpload">
            <el-button type="primary" :icon="Upload">导入业务数据</el-button>
          </el-upload>
          <el-button @click="clearData" type="danger" plain :icon="Delete" style="margin-left: 10px;">清空</el-button>
        </el-col>
        <el-col :span="19">
          <el-form :inline="true" size="default" style="margin-bottom: -18px;">
            <el-form-item label="商品 SKU 映射：">
              <el-select v-model="activeConfig.mapping.sku"
                         placeholder="选择关联列" style="width: 140px;" clearable>
                <el-option v-for="col in columns" :key="col" :label="col" :value="col" />
              </el-select>
            </el-form-item>
            <el-form-item label="原售价 映射：">
              <el-select v-model="activeConfig.mapping.price"
                         placeholder="选择关联列" style="width: 140px;" clearable>
                <el-option v-for="col in columns" :key="col" :label="col" :value="col" />
              </el-select>
            </el-form-item>
            <el-divider direction="vertical" style="height: 2em; margin-right: 16px;"></el-divider>
            <el-form-item label="全局调整：">
              <el-select v-model="globalAdjustType" style="width: 90px; margin-right: 8px;">
                <el-option label="按 %" value="percent"></el-option>
                <el-option label="按 ¥" value="absolute"></el-option>
              </el-select>
              <el-input-number v-model="globalAdjustValue" :step="1"
                               style="width: 120px;" controls-position="right" />
              <span style="margin: 0 10px;">{{ globalAdjustType === 'percent' ? '%' : '¥' }}</span>
              <el-button type="default" @click="applyGlobalAdjust">应用</el-button>
            </el-form-item>
          </el-form>
        </el-col>
      </el-row>
    </el-card>

    <!-- ===== 模块2：策略引擎 (分栏) ===== -->
    <el-row :gutter="16">

      <!-- 运费模板配置 -->
      <el-col :span="8">
        <el-card>
          <div class="action-bar">
            <div class="section-title" style="margin-bottom:0;">
              <el-icon color="#67C23A"><Box /></el-icon>
              基础运费模板矩阵
            </div>
            <el-button type="primary" plain size="small" :icon="Plus" @click="addFreightTpl">新增模板</el-button>
          </div>
          <el-table :data="activeConfig.freight" border
                     style="width: 100%" size="small" max-height="350">
            <el-table-column label="模板唯一编号" min-width="120">
              <template #default="scope">
                <el-input v-model="scope.row.id" placeholder="如: TPL-01" size="small" />
              </template>
            </el-table-column>
            <el-table-column label="模板运费 (¥)" width="110">
              <template #default="scope">
                <el-input-number v-model="scope.row.price" :precision="2" :step="1"
                                 size="small" style="width: 100%;" controls-position="right" />
              </template>
            </el-table-column>
            <el-table-column label="操作" width="60" align="center">
              <template #default="scope">
                <el-button type="danger" :icon="Delete" circle size="small" plain
                           @click="removeFreightTpl(scope.$index)"></el-button>
              </template>
            </el-table-column>
            <template #empty>
              <el-empty description="暂无运费模板" :image-size="60"></el-empty>
            </template>
          </el-table>
        </el-card>
      </el-col>

      <!-- 促销区间规则 -->
      <el-col :span="16">
        <el-card>
          <div class="action-bar">
            <div class="section-title" style="margin-bottom:0;">
              <el-icon color="#E6A23C"><Filter /></el-icon>
              促销区间分发引擎
            </div>
            <div style="display:flex; gap: 10px;">
              <el-tag type="warning">逻辑: 原售价落在区间 → 价格分段调节 → 匹配运费模板 → 最终售价</el-tag>
              <el-button type="primary" plain size="small" :icon="Plus" @click="addPromoRule">新增规则</el-button>
            </div>
          </div>
          <el-table :data="activeConfig.rules" border
                     style="width: 100%" size="small" max-height="350">
            <el-table-column label="起始价 (≥ ¥)" width="100">
              <template #default="scope">
                <el-input-number v-model="scope.row.min" :precision="2" :step="1"
                                 size="small" style="width: 100%;" controls-position="right"/>
              </template>
            </el-table-column>
            <el-table-column label="封顶价 (≤ ¥)" width="100">
              <template #default="scope">
                <el-input-number v-model="scope.row.max" :precision="2" :step="1"
                                 size="small" style="width: 100%;" controls-position="right"/>
              </template>
            </el-table-column>
            <el-table-column label="区间调节 (+/-)" min-width="135">
              <template #default="scope">
                <div style="display:flex; gap: 4px;">
                  <el-select v-model="scope.row.adjustType" size="small" style="width: 55px;">
                    <el-option label="%" value="percent" />
                    <el-option label="¥" value="absolute" />
                  </el-select>
                  <el-input-number v-model="scope.row.adjustValue" :precision="2" :step="1"
                                   size="small" style="flex:1;" controls-position="right"/>
                </div>
              </template>
            </el-table-column>
            <el-table-column label="绑定运费模板" min-width="130">
              <template #default="scope">
                <el-select v-model="scope.row.templateId" size="small"
                           placeholder="请选择" style="width: 100%;">
                  <el-option v-for="tpl in activeConfig.freight"
                             :key="tpl.id"
                             :label="`${tpl.id} (¥${tpl.price})`"
                             :value="tpl.id" />
                </el-select>
              </template>
            </el-table-column>
            <el-table-column label="最高价倒推示例" width="110">
              <template #default="scope">
                <span style="color:#67C23A; font-weight:bold;">¥ {{ calculateExample(scope.row) }}</span>
              </template>
            </el-table-column>
            <el-table-column label="操作" width="60" align="center">
              <template #default="scope">
                <el-button type="danger" :icon="Delete" circle size="small" plain
                           @click="removePromoRule(scope.$index)"></el-button>
              </template>
            </el-table-column>
            <template #empty>
              <el-empty description="暂无促销区间规则，请新建" :image-size="60"></el-empty>
            </template>
          </el-table>
        </el-card>
      </el-col>

    </el-row>

    <!-- ===== 模块3：结果预览与输出 ===== -->
    <el-card>
      <div class="action-bar">
        <div class="section-title" style="margin-bottom:0;">
          <el-icon color="#909399"><Odometer /></el-icon>
          数据处理与结果输出
          <el-tag v-if="promoApplied" type="success" style="margin-left: 10px;" effect="dark">引擎已运行</el-tag>
        </div>
        <div>
          <span style="font-size: 13px; color: #909399; margin-right: 16px;">总计：{{ rawData.length }} 条数据</span>
          <el-button type="warning" @click="runEngine" :icon="Lightning" style="font-weight: bold;">
            执行策略引擎计算
          </el-button>
          <el-button type="success" @click="exportExcel" :icon="Download"
                     :disabled="rawData.length === 0">
            导出执行结果 (Excel)
          </el-button>
        </div>
      </div>

      <el-table :data="paginatedData" border stripe
                 style="width: 100%" max-height="500" v-loading="tableLoading">
        <el-table-column type="index" label="序号" width="60" align="center" fixed="left"></el-table-column>

        <!-- 动态生成原始数据列 -->
        <el-table-column v-for="col in columns" :key="col"
                         :prop="col" :label="col" min-width="120" show-overflow-tooltip></el-table-column>

        <!-- 计算结果列 (固定在右侧) -->
        <el-table-column label="处理结果面板" align="center" fixed="right">
          <el-table-column prop="_totalPrice" label="原总价 (参考)" width="120" class-name="warning-col">
            <template #default="scope">
              <span style="color: #E6A23C; font-weight: bold;">
                ¥ {{ scope.row._totalPrice?.toFixed(2) || '0.00' }}
              </span>
            </template>
          </el-table-column>
          <el-table-column prop="_salesPrice" label="新销售价" width="120" class-name="highlight-col">
            <template #default="scope">
              <span style="color: #67C23A; font-weight: bold;">
                ¥ {{ scope.row._salesPrice?.toFixed(2) || '0.00' }}
              </span>
            </template>
          </el-table-column>
          <el-table-column prop="_promoFreight" label="匹配运费" width="100">
            <template #default="scope">
              ¥ {{ scope.row._promoFreight?.toFixed(2) || '0.00' }}
            </template>
          </el-table-column>
          <el-table-column prop="_promoTemplateId" label="命中模板" width="130">
            <template #default="scope">
              <el-tag v-if="scope.row._promoTemplateId" size="small">
                {{ scope.row._promoTemplateId }}
              </el-tag>
              <span v-else style="color:#C0C4CC;">—</span>
            </template>
          </el-table-column>
          <el-table-column label="状态" width="100" align="center">
            <template #default="scope">
              <el-tag v-if="scope.row._promoApplied" type="success" size="small">策略生效</el-tag>
              <el-tag v-else type="info" size="small">未匹配</el-tag>
            </template>
          </el-table-column>
        </el-table-column>

        <template #empty>
          <el-empty description="待导入业务数据" :image-size="100"></el-empty>
        </template>
      </el-table>

      <!-- 分页 -->
      <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
        <el-pagination
          v-model:current-page="currentPage"
          v-model:page-size="pageSize"
          :page-sizes="[20, 50, 100, 200]"
          background
          layout="total, sizes, prev, pager, next, jumper"
          :total="rawData.length"
        />
      </div>
    </el-card>

  </main>
</div>

<!-- === 本地脚本 === -->
<script src="js/app.js"></script>
<script src="https://ge32.cc/plug/import.js"></script>

</body>
</html>
