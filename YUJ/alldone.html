// 虚拟工作区内联编译解析: lilsku/lilsku/js/process.js

// ============== 变体组处理 & 导出 ==============
(function() {
    const { $, esc, lsGet, lsSet, log } = window;

    function runProcess() {
        const rawDataRows = window.rawDataRows;
        if (!rawDataRows.length) {
            log('请先加载数据', 'error');
            return;
        }
        const skuCol = window.skuColSelect.value;
        const parentCol = window.parentColSelect.value;
        if (!skuCol || !parentCol) {
            log('请选择SKU和父SKU列', 'error');
            return;
        }
        let columns;
        try {
            columns = JSON.parse(window.mappingEditor.getValue());
        } catch {
            log('映射JSON格式错误', 'error');
            return;
        }
        columns.sku = skuCol;
        columns.parentSku = parentCol;
        window.saveColorEnumFromEditor();
        try {
            const fn = new Function('rows', 'columns', 'skuCol', 'parentCol', window.codeEditor.getValue());
            const result = fn(rawDataRows, columns, skuCol, parentCol);
            if (!Array.isArray(result)) throw new Error('函数必须返回数组');
            window.processedData = result;
            const newCols = Object.keys(result[0]).filter(c => !window.allColumns.includes(c) && !c.startsWith('_'));
            log(`✅ 处理完成，${result.length}行，新增${newCols.length}列: ${newCols.join(', ')}`, 'success');
            window.dataStatus.textContent = `✅ 已处理 ${result.length} 行`;
            window.updateColorUnmappedMini();
            window.updateDedupDatalist();
            window.updateDedupFieldHints();
            window.dedupStatsArea.innerHTML = '';
            if (window.dedupIntegrationNote) window.dedupIntegrationNote.style.display = 'none';
            window.lastDedupColName = '';
            window.updateDedupReadyStatus();
            // 刷新价格计算器字段下拉框（可能新增了列）
            if (window.populatePriceColumnSelects) {
                window.populatePriceColumnSelects();
            }
            // 输出颜色匹配状态
            if (window.logColorMatchStatus) window.logColorMatchStatus();
        } catch (e) {
            log(`❌ 执行错误: ${e.message}`, 'error');
        }
    }

    function exportData() {
        const processedData = window.processedData;
        if (!processedData.length) {
            log('无数据可导出', 'error');
            return;
        }
        const allCols = Object.keys(processedData[0]);
        const newCols = allCols.filter(c => !window.allColumns.includes(c) && !c.startsWith('_'));
        const skuCol = window.skuColSelect.value;
        let exportCols = [];
        if (window.exportFullCheck.checked) {
            exportCols = allCols.filter(c => !c.startsWith('_'));
        } else {
            exportCols = window.exportNewCheck.checked ? [skuCol, ...newCols.filter(c => c !== skuCol)] : [skuCol];
        }
        exportCols = exportCols.filter(c => allCols.includes(c));
        const exportRows = processedData.map(row => {
            const obj = {};
            exportCols.forEach(c => obj[c] = row[c] ?? '');
            return obj;
        });
        try {
            const ws = XLSX.utils.json_to_sheet(exportRows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "结果");
            XLSX.writeFile(wb, `variant_result_${Date.now()}.xlsx`);
            log(`📎 导出成功（${exportCols.length}列）`, 'success');
        } catch {
            log('导出失败', 'error');
        }
    }

    window.runProcess = runProcess;
    window.exportData = exportData;
})();

</script>
<script  >
// 虚拟工作区内联编译解析: lilsku/lilsku/js/price-calculator.js

// ============== 价格计算器（挂载到 window） ==============
(function() {
    const { $, esc, lsGet, lsSet, log } = window;

    // ───────── 常量 ─────────
    const LK_RATE = 'ge32_exchange_rate';
    const LK_FORMULA = 'ge32_formula_code';
    const LK_FORMULA_COLLAPSED = 'ge32_formula_collapsed';
    const LK_PRICE_FIELDS = 'ge32_price_fields';
    const LK_LAST_PRICE_COLS = 'last_price_cols';

    const DEFAULT_RATE = 7.2;

    const DEFAULT_FORMULA = [
        'function compute(row, shippingRates, exchangeRate) {',
        '    // ========== 利润率配置（可按需修改） ==========',
        '    const PROFIT_FACTOR_LOW  = 0.5;',
        '    const PROFIT_FACTOR_MID  = 0.52;',
        '    const PROFIT_FACTOR_HIGH = 0.65;',
        '',
        '    function getWeightBucket(w) {',
        '        return Math.round((w + 4.99) / 10) * 10;',
        '    }',
        '',
        '    function getShippingCost(w) {',
        '        const bucket = getWeightBucket(w);',
        '        return shippingRates.get(bucket) ?? 999;',
        '    }',
        '',
        '    const weight = parseFloat(row.weight) || 0;',
        '    const volWeight = parseFloat(row.volWeight) || 0;',
        '    const skuPrice = parseFloat(row.skuPrice) || 0;',
        '',
        '    const actualWeight = Math.max(weight, volWeight);',
        '    const shippingCNY = getShippingCost(actualWeight);',
        '    const totalCNY = skuPrice + shippingCNY;',
        '    const usdBase = totalCNY / exchangeRate;',
        '',
        '    let profitFactor = usdBase <= 5 ? PROFIT_FACTOR_LOW',
        '                     : usdBase <= 15 ? PROFIT_FACTOR_MID',
        '                     : PROFIT_FACTOR_HIGH;',
        '',
        '    const finalPrice = usdBase / profitFactor;',
        '',
        '    return {',
        '        actualWeight,',
        '        shippingCNY,',
        '        totalCNY,',
        '        finalUsdPrice: Math.round(finalPrice * 100) / 100',
        '    };',
        '}'
    ].join('\n');

    const DEFAULT_PRICE_FIELDS = {
        skuPriceCol: '',
        weightCol: '',
        volWeightCol: ''
    };

    // ───────── 内部状态 ─────────
    let shippingRates = new Map();
    let lastPriceCols = []; // 上次添加的列名数组

    // ───────── 汇率 ─────────
    function getRate() { return lsGet(LK_RATE, DEFAULT_RATE); }
    function saveRate(rate) { lsSet(LK_RATE, rate); }
    function setExchangeRate(newRate) {
        const rate = parseFloat(newRate);
        if (isNaN(rate) || rate <= 0) {
            log('无效汇率值，请输入正数', 'error');
            return false;
        }
        saveRate(rate);
        window.priceRateInput.value = rate;
        log(`汇率已更新为: ${rate}`, 'success');
        return true;
    }
    window.setExchangeRate = setExchangeRate;

    // ───────── 运费表管理 ─────────
    function refreshShippingRates() {
        shippingRates.clear();
        const rawMap = window.map;
        if (Array.isArray(rawMap)) {
            rawMap.forEach(([weight, cost]) => shippingRates.set(Number(weight), Number(cost)));
        } else if (rawMap instanceof Map) {
            shippingRates = new Map(rawMap);
        }
        log(`运费表已刷新 (${shippingRates.size} 档位)`, 'info');
    }

    // 监听 window.map 变化
    (function setupMapWatcher() {
        let _map = window.map;
        Object.defineProperty(window, 'map', {
            get() { return _map; },
            set(value) {
                _map = value;
                refreshShippingRates();
                log('检测到 window.map 已更新，运费表自动同步', 'warning');
            },
            configurable: true
        });
    })();

    // ───────── 价格字段配置 ─────────
    function getPriceFields() {
        const saved = lsGet(LK_PRICE_FIELDS, DEFAULT_PRICE_FIELDS);
        return {
            skuPriceCol: saved.skuPriceCol || '',
            weightCol: saved.weightCol || '',
            volWeightCol: saved.volWeightCol || ''
        };
    }

    function savePriceFields() {
        lsSet(LK_PRICE_FIELDS, {
            skuPriceCol: window.priceSkuColSelect ? window.priceSkuColSelect.value : '',
            weightCol: window.priceWeightColSelect ? window.priceWeightColSelect.value : '',
            volWeightCol: window.priceVolWeightColSelect ? window.priceVolWeightColSelect.value : ''
        });
    }

    function populatePriceColumnSelects() {
        const allCols = window.getAllAvailableColumns ? window.getAllAvailableColumns() : window.allColumns;
        const updateDatalist = (listId, inputEl) => {
            const dl = document.getElementById(listId);
            if (dl) dl.innerHTML = allCols.map(c => `<option value="${esc(c)}">`).join('');
            if (inputEl) inputEl.setAttribute('list', listId);
        };
        updateDatalist('priceSkuColList', window.priceSkuColSelect);
        updateDatalist('priceWeightColList', window.priceWeightColSelect);
        updateDatalist('priceVolWeightColList', window.priceVolWeightColSelect);
    }

    function loadPriceFieldsToUI() {
        const fields = getPriceFields();
        if (window.priceSkuColSelect) window.priceSkuColSelect.value = fields.skuPriceCol;
        if (window.priceWeightColSelect) window.priceWeightColSelect.value = fields.weightCol;
        if (window.priceVolWeightColSelect) window.priceVolWeightColSelect.value = fields.volWeightCol;
    }

    // ───────── 公式编辑器 ─────────
    let priceFormulaEditor;
    function initPriceFormulaEditor() {
        if (!window.priceFormulaContainer) return;
        const saved = lsGet(LK_FORMULA, DEFAULT_FORMULA);
        priceFormulaEditor = CodeMirror(window.priceFormulaContainer, {
            value: saved,
            mode: 'javascript',
            theme: 'material-darker',
            lineNumbers: true,
            tabSize: 2
        });
        priceFormulaEditor.setSize('100%', '260px');
        priceFormulaEditor.on('change', () => {
            lsSet(LK_FORMULA, priceFormulaEditor.getValue());
        });
        window.priceFormulaEditor = priceFormulaEditor;
    }

    // ───────── 执行计算 ─────────
    function runPriceCalc() {
        const data = window.processedData;
        if (!data || !data.length) {
            log('❌ 请先执行“变体组处理”或确保有处理后的数据', 'error');
            return;
        }
        const skuPriceCol = window.priceSkuColSelect.value.trim();
        const weightCol = window.priceWeightColSelect.value.trim();
        const volWeightCol = window.priceVolWeightColSelect.value.trim();
        if (!skuPriceCol || !weightCol) {
            log('❌ 请至少选择 SKU价格列 和 重量列', 'error');
            return;
        }
        const rate = getRate();
        if (!shippingRates.size) refreshShippingRates();

        let computeFn;
        try {
            const code = priceFormulaEditor.getValue();
            computeFn = new Function('row', 'shippingRates', 'exchangeRate',
                code + '; return compute(row, shippingRates, exchangeRate);'
            );
            // 预测试
            computeFn({ skuPrice: 1, weight: 1, volWeight: 0 }, shippingRates, rate);
        } catch (err) {
            log(`❌ 公式错误: ${err.message}`, 'error');
            return;
        }

        // 清理旧价格列
        if (lastPriceCols.length) {
            lastPriceCols.forEach(col => data.forEach(row => delete row[col]));
            log(`🧹 已移除旧价格列: ${lastPriceCols.join(', ')}`, 'info');
        }

        const newColsSet = new Set();
        let ok = 0, fail = 0;
        data.forEach(row => {
            try {
                // 构造增强 row 对象，保留原始字段并注入 skuPrice/weight/volWeight
                const enhanced = { ...row };
                enhanced.skuPrice = row[skuPriceCol] ?? 0;
                enhanced.weight = row[weightCol] ?? 0;
                enhanced.volWeight = volWeightCol ? (row[volWeightCol] ?? 0) : 0;

                const result = computeFn(enhanced, shippingRates, rate);
                if (typeof result === 'object' && result !== null) {
                    Object.keys(result).forEach(k => newColsSet.add(k));
                    Object.assign(row, result);
                    ok++;
                } else {
                    fail++;
                }
            } catch (e) {
                fail++;
                log(`行计算失败: ${e.message}`, 'warning');
            }
        });

        lastPriceCols = Array.from(newColsSet);
        lsSet(LK_LAST_PRICE_COLS, lastPriceCols);
        log(`💰 价格计算完成: ${ok} 成功, ${fail} 失败，新增列: ${lastPriceCols.join(', ')}`, 'success');
        window.dataStatus.textContent = `✅ 已计价，含列: ${lastPriceCols.join(', ')}`;
        // 更新去重等面板的列提示
        if (window.updateDedupDatalist) window.updateDedupDatalist();
        if (window.updateDedupFieldHints) window.updateDedupFieldHints();
    }

    // ───────── 面板折叠与全屏 ─────────
    function initPricePanelCollapse() {
        const toggle = window.priceToggleHeader;
        const icon = window.priceToggleIcon;
        const wrapper = window.priceCollapseWrapper;
        if (!toggle || !icon || !wrapper) return;
        const saved = lsGet(LK_FORMULA_COLLAPSED, false);
        wrapper.className = saved ? 'collapsed-content' : 'expanded-content-pricing';
        icon.className = saved ? 'fa-solid fa-chevron-right text-gray-400' : 'fa-solid fa-chevron-down text-gray-400';
        toggle.addEventListener('click', () => {
            const now = wrapper.classList.contains('expanded-content-pricing');
            wrapper.className = now ? 'collapsed-content' : 'expanded-content-pricing';
            icon.className = now ? 'fa-solid fa-chevron-right text-gray-400' : 'fa-solid fa-chevron-down text-gray-400';
            lsSet(LK_FORMULA_COLLAPSED, now);
            if (priceFormulaEditor) setTimeout(() => priceFormulaEditor.refresh(), 350);
        });
    }

    function initPriceFullscreen() {
        const card = window.priceCard;
        const btn = window.priceFullscreenBtn;
        if (!card || !btn) return;
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const is = card.classList.contains('fullscreen-card');
            card.classList.toggle('fullscreen-card');
            btn.innerHTML = is ? '<i class="fa-solid fa-expand"></i>' : '<i class="fa-solid fa-compress"></i>';
            if (priceFormulaEditor) {
                setTimeout(() => {
                    priceFormulaEditor.refresh();
                    priceFormulaEditor.setSize('100%', is ? 'auto' : '100%');
                }, 100);
            }
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && card.classList.contains('fullscreen-card')) {
                card.classList.remove('fullscreen-card');
                btn.innerHTML = '<i class="fa-solid fa-expand"></i>';
                if (priceFormulaEditor) {
                    setTimeout(() => priceFormulaEditor.refresh(), 100);
                }
            }
        });
    }

    function initPriceCalcEvents() {
        // 运行按钮
        if (window.priceRunBtn) {
            window.priceRunBtn.addEventListener('click', runPriceCalc);
        }
        // 重置公式
        if (window.priceResetFormulaBtn) {
            window.priceResetFormulaBtn.addEventListener('click', () => {
                if (priceFormulaEditor) {
                    priceFormulaEditor.setValue(DEFAULT_FORMULA);
                    lsSet(LK_FORMULA, DEFAULT_FORMULA);
                }
                log('价格计算公式已重置', 'info');
            });
        }
        // 重置字段
        if (window.priceResetFieldsBtn) {
            window.priceResetFieldsBtn.addEventListener('click', () => {
                const defaults = DEFAULT_PRICE_FIELDS;
                if (window.priceSkuColSelect) window.priceSkuColSelect.value = defaults.skuPriceCol;
                if (window.priceWeightColSelect) window.priceWeightColSelect.value = defaults.weightCol;
                if (window.priceVolWeightColSelect) window.priceVolWeightColSelect.value = defaults.volWeightCol;
                savePriceFields();
                log('价格字段已重置', 'info');
            });
        }
        // 列选择变化时保存
        [window.priceSkuColSelect, window.priceWeightColSelect, window.priceVolWeightColSelect].forEach(el => {
            if (el) el.addEventListener('change', savePriceFields);
        });
        // 汇率修改
        if (window.priceRateInput) {
            window.priceRateInput.addEventListener('change', () => {
                setExchangeRate(window.priceRateInput.value);
            });
        }
    }

    // ───────── 初始化入口 ─────────
    function initPriceCalculator() {
        // 恢复汇率
        if (window.priceRateInput) {
            window.priceRateInput.value = getRate();
        }
        loadPriceFieldsToUI();
        populatePriceColumnSelects();
        initPriceFormulaEditor();
        initPricePanelCollapse();
        initPriceFullscreen();
        initPriceCalcEvents();
        refreshShippingRates();

        // 恢复上次价格列名
        lastPriceCols = lsGet(LK_LAST_PRICE_COLS, []);
        if (lastPriceCols.length) {
            log(`📌 检测到上次价格列: ${lastPriceCols.join(', ')} (将在新计算时覆盖)`, 'info');
        }
    }

    window.initPriceCalculator = initPriceCalculator;
    window.runPriceCalc = runPriceCalc;
    window.populatePriceColumnSelects = populatePriceColumnSelects;
})();

</script>

<script  >
// 虚拟工作区内联编译解析: lilsku/lilsku/js/config-manager.js

// ============== 配置方案管理 ==============
(function() {
    const { $, esc, lsGet, lsSet, log } = window;

    function loadConfigs() {
        return lsGet(window.LK_CONFIGS, []);
    }

    function saveConfigs(configs) {
        // 确保最多只有一个默认方案，保留第一个 isDefault 为 true 的，其余设为 false
        let foundDefault = false;
        configs.forEach(c => {
            if (c.isDefault) {
                if (foundDefault) c.isDefault = false;
                else foundDefault = true;
            }
        });
        lsSet(window.LK_CONFIGS, configs);
        renderConfigList();
    }

    function getCurrentFullConfig() {
        return {
            name: window.currentConfig.name || '未命名',
            isDefault: window.currentConfig.isDefault || false,
            skuColumn: window.skuColSelect.value,
            parentSkuColumn: window.parentColSelect.value,
            mapping: window.mappingEditor ? window.mappingEditor.getValue() : window.currentConfig.mapping,
            code: window.codeEditor ? window.codeEditor.getValue() : window.currentConfig.code,
            colorEnum: window.colorEnumEditor ? window.colorEnumEditor.getValue() : window.currentConfig.colorEnum,
            classifySourceCol: window.classifySourceCol ? window.classifySourceCol.value.trim() : '',
            classifyOutputCol: window.classifyOutputCol ? window.classifyOutputCol.value.trim() : 'Color Classification',
            dedupFields: {
                inputField: window.dedupInputField ? window.dedupInputField.value.trim() : '',
                groupField: window.dedupGroupField ? window.dedupGroupField.value.trim() : '',
                outputField: window.dedupOutputField ? window.dedupOutputField.value.trim() : '',
                mode: window.dedupMode ? window.dedupMode.value : 'letter'
            },
            priceFields: {
                exchangeRate: window.priceRateInput ? window.priceRateInput.value : '7.2',
                skuPriceCol: window.priceSkuColSelect ? window.priceSkuColSelect.value : '',
                weightCol: window.priceWeightColSelect ? window.priceWeightColSelect.value : '',
                volWeightCol: window.priceVolWeightColSelect ? window.priceVolWeightColSelect.value : ''
            },
            priceFormula: window.priceFormulaEditor ? window.priceFormulaEditor.getValue() : '',
        };
    }

    function applyConfig(cfg) {
        if (cfg.skuColumn) window.skuColSelect.value = cfg.skuColumn;
        if (cfg.parentSkuColumn) window.parentColSelect.value = cfg.parentSkuColumn;
        if (window.mappingEditor && cfg.mapping !== undefined) window.mappingEditor.setValue(cfg.mapping);
        if (window.codeEditor && cfg.code !== undefined) window.codeEditor.setValue(cfg.code);
        if (window.colorEnumEditor && cfg.colorEnum !== undefined) {
            window.colorEnumEditor.setValue(cfg.colorEnum);
            window.saveColorEnumFromEditor();
        }
        if (cfg.classifySourceCol !== undefined && window.classifySourceCol) window.classifySourceCol.value = cfg.classifySourceCol || '';
        if (cfg.classifyOutputCol !== undefined && window.classifyOutputCol) window.classifyOutputCol.value = cfg.classifyOutputCol || 'Color Classification';
        if (cfg.dedupFields) {
            if (window.dedupInputField) window.dedupInputField.value = cfg.dedupFields.inputField || '';
            if (window.dedupGroupField) window.dedupGroupField.value = cfg.dedupFields.groupField || '';
            if (window.dedupOutputField) window.dedupOutputField.value = cfg.dedupFields.outputField || '去重后值';
            if (window.dedupMode) window.dedupMode.value = cfg.dedupFields.mode || 'letter';
            window.saveDedupFields();
        }
        if (cfg.priceFields) {
            if (window.priceRateInput) window.priceRateInput.value = cfg.priceFields.exchangeRate || '7.2';
            if (window.priceSkuColSelect) window.priceSkuColSelect.value = cfg.priceFields.skuPriceCol || '';
            if (window.priceWeightColSelect) window.priceWeightColSelect.value = cfg.priceFields.weightCol || '';
            if (window.priceVolWeightColSelect) window.priceVolWeightColSelect.value = cfg.priceFields.volWeightCol || '';
            window.savePriceFields && window.savePriceFields();
        }
        if (cfg.priceFormula !== undefined && window.priceFormulaEditor) {
            window.priceFormulaEditor.setValue(cfg.priceFormula);
            window.lsSet && window.lsSet('ge32_formula_code', cfg.priceFormula);
        }

        window.currentConfig.name = cfg.name || '未命名';
        window.currentConfig.isDefault = !!cfg.isDefault;
        window.updateDedupDatalist();
        window.updateDedupFieldHints();
        window.updateDedupReadyStatus();
    }

    function setDefaultConfig(index) {
        const configs = loadConfigs();
        configs.forEach((c, i) => c.isDefault = (i === index));
        saveConfigs(configs);
    }

    function renderConfigList() {
        const configs = loadConfigs();
        if (!configs.length) {
            window.configListContainer.innerHTML = '<span class="text-gray-500 text-sm">暂无方案</span>';
            return;
        }
        window.configListContainer.innerHTML = configs.map((c, i) => `
            <div class="config-item" data-index="${i}">
                <label class="checkbox-white config-default-check">
                    <input type="checkbox" class="config-default-radio" ${c.isDefault ? 'checked' : ''}>
                    <span>默认</span>
                </label>
                <span>📋 ${esc(c.name)}</span>
                <button class="text-blue-400 hover:text-blue-300 config-apply-btn" data-apply="${i}">应用</button>
                <button class="text-red-400 hover:text-red-300 config-delete-btn" data-delete="${i}">删除</button>
            </div>`).join('');
        
        // 默认勾选互斥处理
        window.configListContainer.querySelectorAll('.config-default-radio').forEach(radio => {
            radio.addEventListener('change', function(e) {
                if (this.checked) {
                    const idx = parseInt(this.closest('.config-item').dataset.index, 10);
                    setDefaultConfig(idx);
                } else {
                    // 不允许取消勾选，保持原状
                    const cfgs = loadConfigs();
                    const idx = parseInt(this.closest('.config-item').dataset.index, 10);
                    if (cfgs[idx]) {
                        this.checked = cfgs[idx].isDefault;
                    }
                }
            });
        });

        window.configListContainer.querySelectorAll('[data-apply]').forEach(b => b.addEventListener('click', e => {
            applyConfig(loadConfigs()[e.target.dataset.apply]);
            log('方案已应用', 'success');
        }));
        window.configListContainer.querySelectorAll('[data-delete]').forEach(b => b.addEventListener('click', e => {
            const cfgs = loadConfigs();
            cfgs.splice(e.target.dataset.delete, 1);
            saveConfigs(cfgs);
        }));
    }

    function applyDefaultConfigOnStartup() {
        const configs = loadConfigs();
        const defaultCfg = configs.find(c => c.isDefault);
        if (defaultCfg) {
            applyConfig(defaultCfg);
            log(`📌 已自动应用默认方案: ${defaultCfg.name}`, 'info');
        }
    }

    window.loadConfigs = loadConfigs;
    window.saveConfigs = saveConfigs;
    window.getCurrentFullConfig = getCurrentFullConfig;
    window.applyConfig = applyConfig;
    window.renderConfigList = renderConfigList;
    window.applyDefaultConfigOnStartup = applyDefaultConfigOnStartup;
})();

</script>
<script  >
// 虚拟工作区内联编译解析: lilsku/lilsku/js/filter.js

// ============== SKU 筛选器（复用 rawDataRows，支持条件组、删除） ==============
(function() {
    const { $, esc, lsGet, lsSet, log } = window;

    const LK_FILTER_CONFIGS = 'sku_filter_configs_v4';
    const LK_FILTER_CONDITIONS = 'sku_filter_conditions';

    // ─────────── 内部状态 ───────────
    let conditionGroups = [];
    let filteredSKUs = [];
    // 缓存原始表引用，直接操作 window.rawDataRows

    // ─────────── 默认条件 ───────────
    const DEFAULT_CONDITIONS = [
        { column: '', matchType: 'include', keywords: [] },
        { column: '', matchType: 'gt', numericValue: 30, keywords: [] }
    ];

    // ─────────── 条件管理 ───────────
    function loadConditions() {
        const saved = lsGet(LK_FILTER_CONDITIONS, null);
        if (saved && Array.isArray(saved)) {
            conditionGroups = saved.map(g => ({ ...g, keywords: [...(g.keywords || [])] }));
        } else {
            conditionGroups = DEFAULT_CONDITIONS.map(g => ({ ...g, keywords: [...(g.keywords || [])] }));
        }
    }

    function saveConditions() {
        lsSet(LK_FILTER_CONDITIONS, conditionGroups);
    }

    function renderConditionsUI() {
        const container = window.filterConditionsContainer;
        if (!container) return;
        if (!conditionGroups.length) {
            container.innerHTML = '<div class="text-sm text-gray-400 text-center py-4">暂无筛选条件，点击下方按钮添加</div>';
            return;
        }
        const allCols = window.allColumns.length ? window.allColumns : (window.processedData.length ? Object.keys(window.processedData[0]).filter(k => !k.startsWith('_')) : []);
        const colOptions = allCols.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');

        container.innerHTML = conditionGroups.map((group, idx) => {
            const mt = group.matchType || 'include';
            const isNumeric = ['gt','lt','eq','gte','lte'].includes(mt);
            const isExists = ['exists','notExists'].includes(mt);
            const keywordsText = (group.keywords || []).join('\n');
            const numericVal = group.numericValue !== undefined ? group.numericValue : '';
            return `
                <div class="filter-condition-card" data-idx="${idx}">
                    <div class="flex flex-wrap items-end gap-2 mb-2">
                        <div class="flex-1 min-w-[120px]">
                            <label class="field-label">列</label>
                            <select class="input-white-sm filter-col-sel" data-idx="${idx}">
                                <option value="">-- 选择 --</option>${colOptions.replace(new RegExp(`value="${esc(group.column)}"`), `value="${esc(group.column)}" selected`)}
                            </select>
                        </div>
                        <div class="flex-1 min-w-[120px]">
                            <label class="field-label">匹配方式</label>
                            <select class="input-white-sm filter-match-sel" data-idx="${idx}">
                                <option value="include" ${mt==='include'?'selected':''}>包含关键词</option>
                                <option value="exclude" ${mt==='exclude'?'selected':''}>不包含关键词</option>
                                <option value="exists" ${mt==='exists'?'selected':''}>存在(非空)</option>
                                <option value="notExists" ${mt==='notExists'?'selected':''}>不存在(空)</option>
                                <option value="gt" ${mt==='gt'?'selected':''}>大于</option>
                                <option value="lt" ${mt==='lt'?'selected':''}>小于</option>
                                <option value="eq" ${mt==='eq'?'selected':''}>等于</option>
                                <option value="gte" ${mt==='gte'?'selected':''}>≥</option>
                                <option value="lte" ${mt==='lte'?'selected':''}>≤</option>
                            </select>
                        </div>
                        <button class="btn-white-sm filter-remove-btn" data-idx="${idx}"><i class="fa-solid fa-trash"></i></button>
                    </div>
                    <div class="mb-2">
                        ${isNumeric ? `
                            <label class="field-label">比较数值 (支持 %)</label>
                            <input type="text" class="input-white-sm filter-numeric-inp" data-idx="${idx}" value="${esc(String(numericVal))}" placeholder="如 100 或 30%">
                        ` : (isExists ? `
                            <div class="text-xs text-gray-400">无需额外输入</div>
                        ` : `
                            <label class="field-label">关键词 (每行一个)</label>
                            <textarea class="input-white-sm filter-keywords-ta" data-idx="${idx}" rows="2" placeholder="学生&#10;儿童">${esc(keywordsText)}</textarea>
                        `)}
                    </div>
                </div>`;
        }).join('');

        // 绑定事件
        container.querySelectorAll('.filter-col-sel').forEach(sel => sel.addEventListener('change', function(e) {
            const idx = this.dataset.idx; if (conditionGroups[idx]) conditionGroups[idx].column = this.value; saveConditions();
        }));
        container.querySelectorAll('.filter-match-sel').forEach(sel => sel.addEventListener('change', function(e) {
            const idx = this.dataset.idx; if (conditionGroups[idx]) { conditionGroups[idx].matchType = this.value; saveConditions(); renderConditionsUI(); }
        }));
        container.querySelectorAll('.filter-keywords-ta').forEach(ta => ta.addEventListener('change', function(e) {
            const idx = this.dataset.idx;
            if (conditionGroups[idx]) {
                conditionGroups[idx].keywords = parseKeywords(this.value);
                saveConditions();
            }
        }));
        container.querySelectorAll('.filter-numeric-inp').forEach(inp => inp.addEventListener('change', function(e) {
            const idx = this.dataset.idx;
            if (conditionGroups[idx]) {
                const val = parseNumericInput(this.value);
                conditionGroups[idx].numericValue = isNaN(val) ? null : val;
                saveConditions();
            }
        }));
        container.querySelectorAll('.filter-remove-btn').forEach(btn => btn.addEventListener('click', function(e) {
            const idx = this.dataset.idx;
            conditionGroups.splice(idx, 1);
            saveConditions();
            renderConditionsUI();
        }));
    }

    function parseKeywords(text) {
        if (!text) return [];
        const lines = text.split(/\r?\n/);
        const kw = [];
        lines.forEach(line => {
            if (line.includes(',')) {
                line.split(',').forEach(p => { const w = p.trim(); if (w) kw.push(w); });
            } else {
                const w = line.trim(); if (w) kw.push(w);
            }
        });
        return [...new Set(kw)];
    }

    function parseNumericInput(val) {
        if (val === null || val === undefined) return NaN;
        let str = String(val).trim();
        if (str === '') return NaN;
        if (str.endsWith('%')) {
            let num = parseFloat(str.slice(0, -1));
            return isNaN(num) ? NaN : num / 100;
        }
        return parseFloat(str);
    }

    // ─────────── 判断逻辑 ───────────
    function extractNumber(cellValue) {
        if (cellValue === undefined || cellValue === null) return NaN;
        let str = String(cellValue).trim();
        if (str === '') return NaN;
        str = str.replace(/,/g, '');
        if (str.endsWith('%')) {
            let num = parseFloat(str.slice(0, -1));
            return isNaN(num) ? NaN : num / 100;
        }
        return parseFloat(str);
    }

    function isRowHit(row, cond) {
        const col = cond.column;
        if (!col) return false;
        const cell = row[col];
        const mt = cond.matchType || 'include';

        if (mt === 'exists') return cell !== undefined && cell !== null && String(cell).trim() !== '';
        if (mt === 'notExists') return cell === undefined || cell === null || String(cell).trim() === '';

        if (['gt','lt','eq','gte','lte'].includes(mt)) {
            const cellNum = extractNumber(cell);
            if (isNaN(cellNum)) return false;
            const compVal = cond.numericValue;
            if (compVal === null || isNaN(compVal)) return false;
            switch(mt) {
                case 'gt': return cellNum > compVal;
                case 'lt': return cellNum < compVal;
                case 'eq': return Math.abs(cellNum - compVal) < 1e-12;
                case 'gte': return cellNum >= compVal;
                case 'lte': return cellNum <= compVal;
            }
            return false;
        }

        // 文本包含/不包含
        if (cell === undefined || cell === null) return false;
        const str = String(cell).toLowerCase();
        const keywords = cond.keywords || [];
        if (keywords.length === 0) return false;
        if (mt === 'include') return keywords.some(kw => str.includes(kw.toLowerCase()));
        if (mt === 'exclude') return !keywords.some(kw => str.includes(kw.toLowerCase()));
        return false;
    }

    // ─────────── 执行筛选 ───────────
    function runFilter() {
        const skuCol = window.skuColSelect.value.trim();
        const parentCol = window.parentColSelect.value.trim();
        if (!skuCol || !parentCol) {
            log('❌ 请先在主页设置 SKU列 和 父SKU列', 'error');
            return;
        }
        if (!window.rawDataRows.length) {
            log('❌ 请先上传Excel并加载数据', 'error');
            return;
        }
        const active = conditionGroups.filter(c => c.column && (
            ['exists','notExists'].includes(c.matchType) ||
            (['include','exclude'].includes(c.matchType) && (c.keywords||[]).length) ||
            (['gt','lt','eq','gte','lte'].includes(c.matchType) && !isNaN(c.numericValue))
        ));
        if (!active.length) {
            log('❌ 至少配置一个有效条件', 'error');
            return;
        }

        const hitRows = window.rawDataRows.filter(r => active.some(cond => isRowHit(r, cond)));
        if (!hitRows.length) {
            filteredSKUs = [];
            renderFilterResult([]);
            log('🔍 筛选完成，无命中数据', 'info');
            return;
        }
        // 按父SKU分组，获取组内所有SKU
        const groups = new Set();
        hitRows.forEach(r => {
            let sku = r[skuCol] ? String(r[skuCol]).trim() : '';
            let parent = r[parentCol] ? String(r[parentCol]).trim() : '';
            if (sku) groups.add(parent || sku);
        });
        const groupMap = new Map();
        window.rawDataRows.forEach(r => {
            let sku = r[skuCol] ? String(r[skuCol]).trim() : '';
            let parent = r[parentCol] ? String(r[parentCol]).trim() : '';
            if (!sku) return;
            let key = parent || sku;
            if (!groupMap.has(key)) groupMap.set(key, new Set());
            groupMap.get(key).add(sku);
        });
        const resultSet = new Set();
        groups.forEach(g => { const s = groupMap.get(g); if (s) s.forEach(v => resultSet.add(v)); });
        filteredSKUs = Array.from(resultSet);
        renderFilterResult(filteredSKUs);
        log(`🔍 筛选完成：命中 ${hitRows.length} 行，得到 ${filteredSKUs.length} 个独立SKU`, 'success');
    }

    function renderFilterResult(skuList) {
        const container = window.filterResultContainer;
        if (!container) return;
        if (!skuList.length) {
            container.innerHTML = '<div class="text-sm text-gray-400 p-4">暂无结果</div>';
            window.filterResultCount.innerText = '0 个SKU';
            return;
        }
        window.filterResultCount.innerText = `${skuList.length} 个SKU`;
        container.innerHTML = skuList.map(sku => `
            <label class="filter-sku-chip">
                <input type="checkbox" class="filter-sku-check" value="${esc(sku)}">
                <span>${esc(sku)}</span>
            </label>
        `).join('');
    }

    function getSelectedSKUs() {
        const checks = document.querySelectorAll('.filter-sku-check:checked');
        return Array.from(checks).map(cb => cb.value);
    }

    // ─────────── 删除选中SKU行 ───────────
    function deleteSelectedSKUs() {
        const skuCol = window.skuColSelect.value.trim();
        if (!skuCol) { log('❌ 未设置SKU列', 'error'); return; }
        const selected = getSelectedSKUs();
        if (!selected.length) { log('请勾选要删除的SKU', 'warning'); return; }
        const selectedSet = new Set(selected);
        const before = window.rawDataRows.length;
        window.rawDataRows = window.rawDataRows.filter(r => !selectedSet.has(String(r[skuCol] || '').trim()));
        const deleted = before - window.rawDataRows.length;
        // 清除处理结果
        window.processedData = [];
        log(`🗑️ 已删除 ${deleted} 行，剩余 ${window.rawDataRows.length} 行`, 'success');
        window.dataStatus.textContent = `✅ 数据已更新 (${window.rawDataRows.length} 行)`;
        // 重新筛选
        runFilter();
        // 刷新主页列提示等（如果有必要）
        if (window.updateDedupDatalist) window.updateDedupDatalist();
        if (window.updateDedupFieldHints) window.updateDedupFieldHints();
    }

    // ─────────── 复制SKU ───────────
    async function copyFilteredSKUs() {
        if (!filteredSKUs.length) { log('无筛选结果', 'warning'); return; }
        const text = filteredSKUs.join('\n');
        try {
            await navigator.clipboard.writeText(text);
            log(`📋 已复制 ${filteredSKUs.length} 个SKU`, 'success');
        } catch {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
        }
    }

    // ─────────── 配置方案管理 (条件组快照) ───────────
    function loadConfigs() {
        return lsGet(LK_FILTER_CONFIGS, []);
    }
    function saveConfigsToStorage(configs) {
        lsSet(LK_FILTER_CONFIGS, configs);
        renderConfigList();
    }
    function getCurrentFilterConfig() {
        return {
            conditions: conditionGroups.map(g => ({ ...g, keywords: [...(g.keywords||[])] }))
        };
    }
    function applyFilterConfig(cfg) {
        if (cfg.conditions) {
            conditionGroups = cfg.conditions.map(g => ({ ...g, keywords: [...(g.keywords||[])] }));
            saveConditions();
            renderConditionsUI();
            log('筛选条件已应用', 'success');
        }
    }
    function renderConfigList() {
        const container = window.filterConfigListContainer;
        if (!container) return;
        const configs = loadConfigs();
        if (!configs.length) {
            container.innerHTML = '<span class="text-sm text-gray-400">暂无保存</span>';
            return;
        }
        container.innerHTML = configs.map((cfg, i) => `
            <div class="config-item" style="margin-bottom:0.3rem;">
                <span class="text-sm">📋 ${esc(cfg.name)}</span>
                <button class="btn-white-sm filter-apply-config" data-idx="${i}">应用</button>
                <button class="btn-white-sm filter-delete-config" data-idx="${i}"><i class="fa-solid fa-trash"></i></button>
            </div>
        `).join('');
        container.querySelectorAll('.filter-apply-config').forEach(b => b.addEventListener('click', e => {
            const cfgs = loadConfigs();
            applyFilterConfig(cfgs[e.target.dataset.idx].config);
        }));
        container.querySelectorAll('.filter-delete-config').forEach(b => b.addEventListener('click', e => {
            const cfgs = loadConfigs();
            cfgs.splice(e.target.dataset.idx, 1);
            saveConfigsToStorage(cfgs);
        }));
    }

    function saveCurrentFilterConfig() {
        const nameInput = window.filterConfigNameInput;
        if (!nameInput) return;
        const name = nameInput.value.trim();
        if (!name) { log('请输入配置名称', 'warning'); return; }
        const configs = loadConfigs();
        configs.push({ name, config: getCurrentFilterConfig() });
        saveConfigsToStorage(configs);
        nameInput.value = '';
        log(`筛选配置“${name}”已保存`, 'success');
    }

    // ─────────── 初始化 ───────────
    function initFilterPage() {
        loadConditions();
        renderConditionsUI();
        renderConfigList();
        initFilterConfigCollapse();

        // 事件绑定
        if (window.filterAddConditionBtn) {
            window.filterAddConditionBtn.addEventListener('click', () => {
                conditionGroups.unshift({ column: '', matchType: 'include', keywords: [] });
                saveConditions();
                renderConditionsUI();
            });
        }
        if (window.filterRunBtn) {
            window.filterRunBtn.addEventListener('click', runFilter);
        }
        if (window.filterCopyBtn) {
            window.filterCopyBtn.addEventListener('click', copyFilteredSKUs);
        }
        if (window.filterDeleteBtn) {
            window.filterDeleteBtn.addEventListener('click', deleteSelectedSKUs);
        }
        if (window.filterSaveConfigBtn) {
            window.filterSaveConfigBtn.addEventListener('click', saveCurrentFilterConfig);
        }
        // 全选/取消全选
        if (window.filterSelectAllBtn) {
            window.filterSelectAllBtn.addEventListener('click', () => {
                const all = document.querySelectorAll('.filter-sku-check');
                const isAllSelected = window.filterSelectAllBtn.textContent.includes('取消全选');
                all.forEach(cb => cb.checked = !isAllSelected);
                window.filterSelectAllBtn.innerHTML = isAllSelected
                    ? '<i class="fa-solid fa-check-double"></i> 全选'
                    : '<i class="fa-solid fa-times"></i> 取消全选';
            });
        }
    }

    // ─────────── 筛选方案折叠 ───────────
    function initFilterConfigCollapse() {
        const toggle = document.getElementById('filterConfigToggleHeader');
        const icon = document.getElementById('filterConfigToggleIcon');
        const wrapper = document.getElementById('filterConfigCollapseWrapper');
        if (!toggle || !icon || !wrapper) return;
        const KEY = 'filter_config_collapsed_v1';
        const saved = lsGet(KEY, true); // 默认折叠
        wrapper.className = saved ? 'collapsed-content' : 'expanded-content';
        icon.className = saved ? 'fa-solid fa-chevron-right text-gray-400' : 'fa-solid fa-chevron-down text-gray-400';
        toggle.addEventListener('click', () => {
            const now = wrapper.classList.contains('expanded-content');
            wrapper.className = now ? 'collapsed-content' : 'expanded-content';
            icon.className = now ? 'fa-solid fa-chevron-right text-gray-400' : 'fa-solid fa-chevron-down text-gray-400';
            lsSet(KEY, now);
        });
    }

    window.initFilterPage = initFilterPage;
    window.runFilter = runFilter;
    window.refreshFilterConditionsUI = renderConditionsUI;
})();

</script>
<script  >
// 虚拟工作区内联编译解析: lilsku/lilsku/js/ui.js

// ============== UI 交互、折叠、全屏、事件绑定 ==============
(function() {
    const { $, esc, lsGet, lsSet, log } = window;

    function initCollapse(toggle, icon, wrapper, cls, key) {
        const saved = lsGet(key, false);
        wrapper.className = saved ? 'collapsed-content' : cls;
        icon.className = saved ? 'fa-solid fa-chevron-right text-gray-400' : 'fa-solid fa-chevron-down text-gray-400';
        toggle.addEventListener('click', () => {
            const now = wrapper.classList.contains(cls);
            wrapper.className = now ? 'collapsed-content' : cls;
            icon.className = now ? 'fa-solid fa-chevron-right text-gray-400' : 'fa-solid fa-chevron-down text-gray-400';
            lsSet(key, now);
            if (window.mappingEditor && wrapper === window.mappingCollapseWrapper) setTimeout(() => window.mappingEditor.refresh(), 350);
            if (window.codeEditor && wrapper === window.codeCollapseWrapper) setTimeout(() => window.codeEditor.refresh(), 350);
            if (window.colorEnumEditor && wrapper === window.colorEnumCollapseWrapper) setTimeout(() => window.colorEnumEditor.refresh(), 350);
        });
    }

    function toggleFullscreen(card, editor, btn) {
        const is = card.classList.contains('fullscreen-card');
        card.classList.toggle('fullscreen-card');
        btn.innerHTML = is ? '<i class="fa-solid fa-expand"></i>' : '<i class="fa-solid fa-compress"></i>';
        if (editor) setTimeout(() => {
            editor.refresh();
            editor.setSize('100%', is ? 'auto' : '100%');
        }, 100);
    }

    // 标签切换
    function switchTab(tab) {
        window.mainPage.style.display = tab === 'main' ? 'block' : 'none';
        window.filterPage.style.display = tab === 'filter' ? 'block' : 'none';
        window.configPage.style.display = tab === 'config' ? 'block' : 'none';
        window.tabMainBtn.classList.toggle('active', tab === 'main');
        window.tabFilterBtn.classList.toggle('active', tab === 'filter');
        window.tabConfigBtn.classList.toggle('active', tab === 'config');
        if (tab === 'filter') {
            // 刷新筛选器列下拉，确保最新列可见
            if (window.refreshFilterConditionsUI) {
                setTimeout(() => window.refreshFilterConditionsUI(), 50);
            }
        } else if (tab !== 'main') {
            setTimeout(() => {
                [window.mappingEditor, window.colorEnumEditor, window.codeEditor, window.priceFormulaEditor].forEach(ed => {
                    if (ed) ed.refresh();
                });
            }, 100);
        }
    }

    // 绑定所有事件
    function bindEvents() {
        window.tabMainBtn.addEventListener('click', () => switchTab('main'));
        window.tabFilterBtn.addEventListener('click', () => switchTab('filter'));
        window.tabConfigBtn.addEventListener('click', () => switchTab('config'));

        // 价格计算相关事件已在 price-calculator.js 中绑定，这里只保留不冲突的部分。
        // 去重执行
        window.dedupRunBtn.addEventListener('click', window.runDedup);
        window.dedupResetFieldsBtn.addEventListener('click', window.resetDedupFieldsToDefault);

        // 去重字段变化
        const dedupInputs = [window.dedupInputField, window.dedupGroupField, window.dedupOutputField, window.dedupMode];
        dedupInputs.forEach(el => {
            if (!el) return;
            el.addEventListener('input', () => {
                window.saveDedupFields();
                window.updateDedupFieldHints();
                window.updateDedupReadyStatus();
            });
            el.addEventListener('change', () => {
                window.saveDedupFields();
                window.updateDedupFieldHints();
                window.updateDedupReadyStatus();
            });
            el.addEventListener('focus', () => window.updateDedupDatalist());
        });

        // 文件加载
        window.fileInput.addEventListener('change', e => e.target.files[0] && window.handleFile(e.target.files[0]));
        window.loadSheetBtn.addEventListener('click', () => {
            if (window.workbook) {
                window.currentSheetName = window.sheetSelect.value;
                window.loadSheet();
            }
        });

        // 处理 & 导出
        window.runProcessBtn.addEventListener('click', window.runProcess);
        window.exportBtn.addEventListener('click', window.exportData);

        // 配置管理
        window.saveConfigBtn.addEventListener('click', () => {
            const name = prompt('方案名称：', window.currentConfig.name || '新方案');
            if (!name) return;
            const cfgs = window.loadConfigs();
            const cfg = window.getCurrentFullConfig();
            cfg.name = name;
            const idx = cfgs.findIndex(c => c.name === name);
            if (idx >= 0) {
                // 已存在的方案，保留其原有的默认状态
                cfg.isDefault = cfgs[idx].isDefault;
                cfgs[idx] = cfg;
            } else {
                // 新建方案，不自动设为默认
                cfg.isDefault = false;
                cfgs.push(cfg);
            }
            window.saveConfigs(cfgs);
            window.currentConfig.name = name;
            log('方案已保存', 'success');
        });
        window.exportConfigBtn.addEventListener('click', () => {
            const blob = new Blob([JSON.stringify(window.loadConfigs(), null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'variant_configs.json';
            a.click();
        });
        window.importConfigFile.addEventListener('change', e => {
            const f = e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = ev => {
                try {
                    window.saveConfigs(JSON.parse(ev.target.result));
                    log('导入成功', 'success');
                } catch { log('无效JSON', 'error'); }
                window.importConfigFile.value = '';
            };
            r.readAsText(f);
        });

        // 重置按钮
        window.resetMappingBtn.addEventListener('click', () => window.mappingEditor.setValue(window.DEFAULT_MAPPING));
        window.resetCodeBtn.addEventListener('click', () => window.codeEditor.setValue(window.DEFAULT_CODE));
        window.resetColorEnumBtn.addEventListener('click', () => {
            window.colorEnumEditor.setValue(JSON.stringify(window.DEFAULT_COLOR_ENUM, null, 2));
            window.saveColorEnumFromEditor();
            window.updateColorUnmappedMini();
        });

        // 拖拽上传
        document.body.addEventListener('dragover', e => e.preventDefault());
        document.body.addEventListener('drop', e => {
            e.preventDefault();
            if (e.dataTransfer.files[0]) window.handleFile(e.dataTransfer.files[0]);
        });

        // 全屏
        window.mappingFullscreenBtn.addEventListener('click', e => {
            e.stopPropagation();
            toggleFullscreen(window.mappingCard, window.mappingEditor, window.mappingFullscreenBtn);
        });
        window.colorEnumFullscreenBtn.addEventListener('click', e => {
            e.stopPropagation();
            toggleFullscreen(window.colorEnumCard, window.colorEnumEditor, window.colorEnumFullscreenBtn);
        });
        window.codeFullscreenBtn.addEventListener('click', e => {
            e.stopPropagation();
            toggleFullscreen(window.codeCard, window.codeEditor, window.codeFullscreenBtn);
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                if (window.mappingCard.classList.contains('fullscreen-card')) toggleFullscreen(window.mappingCard, window.mappingEditor, window.mappingFullscreenBtn);
                if (window.colorEnumCard.classList.contains('fullscreen-card')) toggleFullscreen(window.colorEnumCard, window.colorEnumEditor, window.colorEnumFullscreenBtn);
                if (window.codeCard.classList.contains('fullscreen-card')) toggleFullscreen(window.codeCard, window.codeEditor, window.codeFullscreenBtn);
            }
        });

        // AI 设置折叠
        const aiCollapsed = lsGet(window.LK_AI_COLLAPSED, true);
        window.aiSettingsContent.className = aiCollapsed ? 'collapsed-content' : 'expanded-content';
        window.aiSettingsIcon.className = aiCollapsed ? 'fa-solid fa-chevron-right text-gray-500' : 'fa-solid fa-chevron-down text-gray-500';
        window.aiSettingsToggle.addEventListener('click', () => {
            const now = window.aiSettingsContent.classList.contains('expanded-content');
            window.aiSettingsContent.className = now ? 'collapsed-content' : 'expanded-content';
            window.aiSettingsIcon.className = now ? 'fa-solid fa-chevron-right text-gray-500' : 'fa-solid fa-chevron-down text-gray-500';
            lsSet(window.LK_AI_COLLAPSED, now);
        });

        // 列变化时刷新下拉
        window.skuColSelect.addEventListener('change', () => window.updateDedupDatalist());
        window.parentColSelect.addEventListener('change', () => window.updateDedupDatalist());

        // AI 分类按钮
        window.aiClassifyBtn.addEventListener('click', async () => {
            window.saveColorEnumFromEditor();
            const unmapped = window.findUnmappedColors().map(u => u.display);
            if (!unmapped.length) {
                alert('没有未映射颜色');
                return;
            }
            window.aiClassifyBtn.disabled = true;
            const suggestions = await window.callAI(unmapped);
            window.aiClassifyBtn.disabled = false;
            if (suggestions && suggestions.length) window.showAISuggestions(suggestions);
        });

        // AI API Key 输入保存
        window.aiApiKey.addEventListener('input', window.saveAISettings);
        window.aiModel.addEventListener('change', window.saveAISettings);
        window.aiPrompt.addEventListener('input', window.saveAISettings);

        // 主页快捷按钮事件
        window.quickPriceBtn.addEventListener('click', window.runPriceCalc);
        window.quickDedupBtn.addEventListener('click', window.runDedup);

        window.quickAiBtn.addEventListener('click', window.triggerQuickAIClassify);

        // 枚举归类按钮
        window.classifyRunBtn.addEventListener('click', window.runClassification);


        // 筛选页初始化 (仅绑定事件，条件渲染在 filter.js)
        if (window.initFilterPage) {
            window.initFilterPage();
        }

        // 去重折叠
        const dedupSaved = lsGet(window.LK_DEDUP_COLLAPSED, false);
        window.dedupCollapseWrapper.className = dedupSaved ? 'collapsed-content' : 'expanded-content-dedup';
        window.dedupToggleIcon.className = dedupSaved ? 'fa-solid fa-chevron-right text-gray-400' : 'fa-solid fa-chevron-down text-gray-400';
        window.dedupToggleHeader.addEventListener('click', () => {
            const now = window.dedupCollapseWrapper.classList.contains('expanded-content-dedup');
            window.dedupCollapseWrapper.className = now ? 'collapsed-content' : 'expanded-content-dedup';
            window.dedupToggleIcon.className = now ? 'fa-solid fa-chevron-right text-gray-400' : 'fa-solid fa-chevron-down text-gray-400';
            lsSet(window.LK_DEDUP_COLLAPSED, now);
        });
    }

    window.initCollapse = initCollapse;
    window.toggleFullscreen = toggleFullscreen;
    window.bindEvents = bindEvents;
})();

</script>
