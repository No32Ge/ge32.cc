
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOP · 秩序星图</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Noto+Serif+SC:wght@300;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --void-bg: #05070a;      /* 稍微提亮的虚无底色 */
            --order-glow: #ffffff;
            --text-dim: #cbd5e1;     /* 静默状态下的高可视度银灰 */
            --line-color: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--void-bg);
            color: var(--order-glow);
            font-family: 'Space Mono', 'Noto Serif SC', monospace;
            overflow: hidden; 
            width: 100vw;
            height: 100vh;
        }

        /* ================= 1. 虚无迷雾 (The Void Mist) ================= */
        .mist-container {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            background: #030408;
        }

        .mist {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5; /* 增加迷雾亮度，柔和背景 */
            animation: drift 35s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 迷雾染上微弱的深海与暗紫，避免死黑 */
        .mist-1 { width: 60vw; height: 60vh; background: #111827; top: -10%; left: -10%; animation-delay: 0s; }
        .mist-2 { width: 50vw; height: 50vh; background: #1e1b4b; bottom: -20%; right: -10%; animation-delay: -15s; }
        .mist-3 { width: 70vw; height: 40vh; background: #082f49; top: 40%; left: 30%; animation-delay: -5s; }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(8vw, -8vh) scale(1.1); }
            100% { transform: translate(-8vw, 10vh) scale(0.9); }
        }

        .noise {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="n"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23n)" opacity="0.06"/%3E%3C/svg%3E');
            z-index: 2; pointer-events: none;
        }

        /* ================= 2. 秩序连接线 (Order Lines) ================= */
        #connections-svg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 5;
            pointer-events: none;
        }

        .order-path {
            fill: none;
            stroke-width: 2;
            stroke-dasharray: 8 8;
            animation: flowEntropy 40s linear infinite;
            opacity: 0.6;
            transition: stroke 0.5s ease;
        }

        @keyframes flowEntropy {
            from { stroke-dashoffset: 1000; }
            to { stroke-dashoffset: 0; }
        }

        /* ================= 3. 散落的节点 (Nodes) ================= */
        #nodes-container {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 10;
        }

        .node {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: transform 0.3s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .node:hover {
            z-index: 20;
        }

        .node.dragging {
            transition: none;
            opacity: 0.7;
            cursor: grabbing !important;
        }

        /* 核心圆环：用于直接切换状态 */
        .node-core {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid var(--node-color, #94a3b8);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            transition: all 0.4s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer; /* 圆环是交互的核心 */
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* 悬停时的操作暗示 */
        .node-core:hover {
            transform: scale(1.2);
            background: var(--node-color, #94a3b8);
            box-shadow: 0 0 20px var(--node-color, #94a3b8);
        }

        /* 虚无状态的外围呼吸光晕 */
        .node-core::before {
            content: '';
            position: absolute;
            width: 50px; height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--node-color, #94a3b8) 0%, transparent 70%);
            opacity: 0.15;
            z-index: -1;
            animation: pulse 3s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.1; }
            100% { transform: scale(1.4); opacity: 0.3; }
        }

        /* 秩序状态（已完成）：被节点颜色完全填满并爆发光晕 */
        .node.established .node-core {
            background: var(--node-color, #94a3b8);
            box-shadow: 0 0 25px var(--node-color, #94a3b8), 0 0 45px var(--node-color, #94a3b8);
            border-color: #fff;
        }

        .node.established .node-core::after {
            content: '\f00c'; /* FontAwesome Check */
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            font-size: 12px;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* 节点文字：用于查阅详情 */
        .node-label {
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            color: var(--text-dim);
            text-transform: uppercase;
            text-align: center;
            max-width: 160px;
            word-wrap: break-word;
            transition: color 0.3s, transform 0.3s;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9), 0 0 4px rgba(0,0,0,0.8); /* 极强的阴影保证可读性 */
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .node-label:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }

        .node.established .node-label {
            color: #ffffff;
            font-weight: 700;
            text-shadow: 0 2px 10px var(--node-color, #94a3b8);
        }

        /* ================= 4. UI 悬浮面板 ================= */
        .glass-panel {
            background: rgba(5, 7, 10, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: #e2e8f0;
            padding: 24px;
        }

        /* 顶部全局控制 */
        .global-hub {
            position: fixed;
            top: 40px; left: 40px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: auto;
        }

        .hub-title {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .hub-subtitle {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 0.2em;
        }

        .control-btn {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-dim);
            padding: 8px 14px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.1em;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(5px);
        }

        .control-btn:hover, .control-btn.active {
            border-color: #fff;
            color: #fff;
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }

        /* 右侧详情查阅舱 */
        #detail-chamber {
            position: fixed;
            right: -450px; top: 0;
            width: 420px; height: 100vh;
            border-left: 1px solid rgba(255,255,255,0.05);
            background: linear-gradient(to left, rgba(5,7,10,0.95) 0%, rgba(5,7,10,0.7) 100%);
            backdrop-filter: blur(20px);
            z-index: 100;
            padding: 60px 40px;
            transition: right 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            display: flex;
            flex-direction: column;
        }

        #detail-chamber.open {
            right: 0;
            box-shadow: -20px 0 50px rgba(0,0,0,0.5);
        }

        .chamber-close {
            position: absolute; top: 30px; right: 30px;
            cursor: pointer; color: var(--text-dim); font-size: 1.2rem;
            transition: color 0.3s;
            padding: 10px;
        }
        .chamber-close:hover { color: #fff; transform: rotate(90deg); }

        .detail-meta { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.15em; margin-bottom: 12px; }
        .detail-title { font-size: 1.6rem; font-family: 'Noto Serif SC', serif; font-weight: 900; margin-bottom: 20px; line-height: 1.4;}
        .detail-desc { font-size: 0.85rem; color: #94a3b8; line-height: 1.8; letter-spacing: 0.5px; text-align: justify; margin-bottom: 30px;}

        /* 颜色选择器 */
        .color-picker-title {
            font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.1em; margin-bottom: 10px; text-transform: uppercase;
        }
        .color-palette {
            display: flex; gap: 12px; margin-bottom: 30px;
        }
        .color-swatch {
            width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .color-swatch:hover, .color-swatch.selected {
            transform: scale(1.2); border-color: #fff;
        }

        .tool-link {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px; border-radius: 4px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            font-size: 0.8rem; color: #fff; text-decoration: none; letter-spacing: 0.1em;
            transition: all 0.3s; width: 100%;
        }
        .tool-link:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); }

        /* 全局配置 JSON 编辑器 */
        #config-modal {
            position: fixed; inset: 0; z-index: 200;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.4s;
        }

        #config-modal.open { opacity: 1; pointer-events: auto; }

        .modal-content {
            width: 700px; height: 80vh;
            display: flex; flex-direction: column; gap: 20px;
        }

        textarea.json-area {
            width: 100%; flex-grow: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            color: #cbd5e1;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            padding: 20px;
            outline: none; resize: none;
            line-height: 1.6;
            border-radius: 4px;
        }
        textarea.json-area:focus { border-color: rgba(255,255,255,0.3); }

        .modal-actions { display: flex; justify-content: flex-end; gap: 15px; }

        .toast {
            position: fixed; bottom: 40px; left: 50%; transform: translate(-50%, 20px);
            background: #ffffff; color: #000; padding: 10px 24px; font-size: 0.75rem;
            letter-spacing: 0.1em; opacity: 0; transition: all 0.4s; z-index: 1000;
            border-radius: 30px; font-weight: bold; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

    </style>
</head>
<body>

    <!-- 迷雾与噪点 -->
    <div class="mist-container">
        <div class="mist mist-1"></div>
        <div class="mist mist-2"></div>
        <div class="mist mist-3"></div>
    </div>
    <div class="noise"></div>

    <!-- SVG 能量连接线 -->
    <svg id="connections-svg">
        <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(255,255,255,0.4)"/>
            </marker>
        </defs>
        <g id="lines-group"></g>
    </svg>

    <!-- 散落的节点区 -->
    <div id="nodes-container"></div>

    <!-- 全局控制中枢 -->
    <div class="global-hub">
        <div>
            <div class="hub-title" id="hub-title">SOP // MATRIX</div>
            <div class="hub-subtitle" id="hub-subtitle">ORDER FROM NIHILITY</div>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button class="control-btn" id="btn-edit-mode" title="开启后可自由拖拽节点排布星图">
                <i class="fa-solid fa-arrows-up-down-left-right"></i> 重构坐标
            </button>
            <button class="control-btn" id="btn-json" title="编辑底层逻辑">
                <i class="fa-solid fa-code"></i> 溯源法则
            </button>
            <button class="control-btn" id="btn-reset" title="格式化宇宙">
                <i class="fa-solid fa-skull"></i> 归于虚无
            </button>
        </div>
        
        <div class="hub-subtitle" style="margin-top: 5px;">
            熵减进度: <span id="progress-text" style="color: #fff; font-weight: bold; font-size: 1rem;">0/0</span>
        </div>
    </div>

    <!-- 右侧详情/配置舱 -->
    <div id="detail-chamber">
        <i class="fa-solid fa-xmark chamber-close" id="chamber-close"></i>
        <div class="detail-meta" id="detail-meta">NODE_00</div>
        <div class="detail-title" id="detail-title">载入中...</div>
        
        <!-- 节点颜色选择器 -->
        <div class="color-picker-title">NODE_ENERGY_COLOR</div>
        <div class="color-palette" id="color-palette">
            <!-- 由 JS 动态生成色块 -->
        </div>

        <div class="detail-desc" id="detail-desc"></div>
        
        <div style="margin-top: auto;">
            <a href="#" target="_blank" class="tool-link" id="detail-tool-link">
                <i class="fa-solid fa-link"></i> 接入外部位面 (TOOL)
            </a>
        </div>
    </div>

    <!-- 底层代码编辑器 -->
    <div id="config-modal">
        <div class="modal-content glass-panel">
            <div class="hub-title">GENESIS_CODE</div>
            <div class="hub-subtitle">编辑节点的属性、颜色 (color) 及二维坐标 (x, y)</div>
            <textarea class="json-area" id="json-input" spellcheck="false"></textarea>
            <div class="modal-actions">
                <button class="control-btn" id="btn-json-cancel">抛弃 (DISCARD)</button>
                <button class="control-btn active" id="btn-json-apply">重塑 (REBUILD)</button>
            </div>
        </div>
    </div>

    <!-- 提示框 -->
    <div class="toast" id="toast"></div>

    <script>
        // ==================== 1. 核心数据与调色板 ====================
        const STORAGE_KEY = 'sop_nihility_v2';
        const PROGRESS_KEY = 'sop_nihility_progress_v2';

        // 预设宇宙能量色
        const PALETTE = ['#94a3b8', '#3b82f6', '#8b5cf6', '#10b981', '#ef4444', '#f59e0b', '#06b6d4'];

        const DEFAULT_DATA = {
            title: "SKU LISTING SOP",
            subtitle: "Devour entropy to build order",
            steps: [
                { id: 1, name: "第一遍数据清洗", desc: "对原始SKU数据进行初步筛查，识别并标记违规SKU。基于规则引擎自动检测不符合上架规范的条目。", url: "https://www.ge32.cc/sop/tools/smart-sku-filter-pro.html", x: 15, y: 30, color: '#ef4444' },
                { id: 2, name: "单位转化与补齐", desc: "将公制单位转化为英制单位，同时基于父子关系补全合并SKU信息，生成变体组结构。", url: "https://www.ge32.cc/sop/tools/variant-group-id-pro.html", x: 30, y: 65, color: '#3b82f6' },
                { id: 3, name: "包含计数提取", desc: "从产品描述中智能提取包装数量、件数，将非结构化文字转化为结构化数字字段。", url: "https://www.ge32.cc/tools/counter.html", x: 45, y: 25, color: '#06b6d4' },
                { id: 4, name: "颜色类型标准化", desc: "通过拼写纠错与模糊匹配，将随意填写的颜色名称统一归化为标准颜色类型。", url: "https://www.ge32.cc/tools/colorConverter.html", x: 60, y: 70, color: '#8b5cf6' },
                { id: 5, name: "数据完善与文案", desc: "撰写产品Listing标题、五点描述及关键词，利用AI批量生成高质量电商文案。", url: "https://www.ge32.cc/tools/promptStar.html", x: 75, y: 35, color: '#10b981' },
                { id: 6, name: "第二次数据清洗", desc: "对完善后的SKU数据进行二次审查，确保未引入新合规问题，拦截遗漏违规项。", url: "https://www.ge32.cc/sop/tools/smart-sku-filter-pro.html", x: 85, y: 60, color: '#ef4444' },
                { id: 7, name: "上架表格转化", desc: "将最终SKU数据转化为适配电商平台上架要求的表格格式，支持导出标准模板。", url: "https://www.ge32.cc/tools/JsonToExcel.html", x: 90, y: 85, color: '#f59e0b' }
            ]
        };

        let sysData = null;
        let progressData = {};
        let isEditMode = false;
        let activeNodeId = null;

        // ==================== 2. 系统引擎 ====================
        
        function init() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try { sysData = JSON.parse(stored); } catch (e) { sysData = JSON.parse(JSON.stringify(DEFAULT_DATA)); }
            } else {
                sysData = JSON.parse(JSON.stringify(DEFAULT_DATA));
            }

            const prog = localStorage.getItem(PROGRESS_KEY);
            if (prog) {
                try { progressData = JSON.parse(prog); } catch(e) { progressData = {}; }
            }

            // 数据补全
            sysData.steps.forEach(step => {
                if(step.x === undefined) step.x = 10 + Math.random() * 80;
                if(step.y === undefined) step.y = 10 + Math.random() * 80;
                if(!step.color) step.color = PALETTE[0];
            });

            bindEvents();
            renderUniverse();
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(sysData));
            localStorage.setItem(PROGRESS_KEY, JSON.stringify(progressData));
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        // ==================== 3. 宇宙渲染 (DOM & SVG) ====================

        function renderUniverse() {
            document.getElementById('hub-title').textContent = sysData.title || 'SOP // MATRIX';
            document.getElementById('hub-subtitle').textContent = sysData.subtitle || 'ORDER FROM NIHILITY';
            
            updateProgressText();
            renderNodes();
            renderLines();
        }

        function updateProgressText() {
            const total = sysData.steps.length;
            const completed = Object.values(progressData).filter(v => v).length;
            document.getElementById('progress-text').textContent = `${completed} / ${total}`;
        }

        function renderNodes() {
            const container = document.getElementById('nodes-container');
            container.innerHTML = '';

            sysData.steps.forEach((step) => {
                const isCompleted = progressData[step.id] === true;
                const nodeColor = step.color || PALETTE[0];
                
                const nodeEl = document.createElement('div');
                nodeEl.className = `node ${isCompleted ? 'established' : ''}`;
                nodeEl.id = `node-${step.id}`;
                nodeEl.dataset.id = step.id;
                nodeEl.style.left = `${step.x}%`;
                nodeEl.style.top = `${step.y}%`;
                // 注入能量色 CSS 变量
                nodeEl.style.setProperty('--node-color', nodeColor);

                // 拆分交互区：core用于完成状态，label用于打开详情
                nodeEl.innerHTML = `
                    <div class="node-core" title="点击确立/剥离秩序"></div>
                    <div class="node-label" title="查阅节点详情">${step.name}</div>
                `;

                // 绑定分离的事件
                const core = nodeEl.querySelector('.node-core');
                const label = nodeEl.querySelector('.node-label');

                // 拖拽逻辑优先绑定在外层
                nodeEl.addEventListener('mousedown', handleDragStart);
                
                core.addEventListener('click', (e) => {
                    if (isEditMode) return;
                    e.stopPropagation();
                    toggleOrderStatus(step.id);
                });

                label.addEventListener('click', (e) => {
                    if (isEditMode) return;
                    e.stopPropagation();
                    openChamber(step.id);
                });
                
                container.appendChild(nodeEl);
            });
        }

        function renderLines() {
            const g = document.getElementById('lines-group');
            g.innerHTML = '';
            const steps = sysData.steps;

            for(let i = 0; i < steps.length - 1; i++) {
                const current = steps[i];
                const next = steps[i+1];
                
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                
                const x1 = current.x, y1 = current.y;
                const x2 = next.x, y2 = next.y;
                const cx1 = x1 + (x2 - x1) * 0.5;
                const cy1 = y1;
                const cx2 = x1 + (x2 - x1) * 0.5;
                const cy2 = y2;

                path.setAttribute("d", `M ${x1}% ${y1}% C ${cx1}% ${cy1}%, ${cx2}% ${cy2}%, ${x2}% ${y2}%`);
                path.setAttribute("class", "order-path");
                path.setAttribute("marker-end", "url(#arrow)");
                
                // 线条继承源节点的颜色，提升视觉秩序感
                const lineColor = current.color || 'rgba(255,255,255,0.2)';
                path.setAttribute("stroke", lineColor);
                
                g.appendChild(path);
            }
        }

        // ==================== 4. 交互逻辑 ====================

        // 就近原则：直接在节点上切换状态
        function toggleOrderStatus(stepId) {
            const isCompleted = progressData[stepId] === true;
            progressData[stepId] = !isCompleted;
            saveData();
            
            // 局部更新视觉，无需重绘整个宇宙
            const nodeEl = document.getElementById(`node-${stepId}`);
            if (progressData[stepId]) {
                nodeEl.classList.add('established');
                showToast('秩序已确立');
            } else {
                nodeEl.classList.remove('established');
                showToast('已退回虚无状态');
            }
            updateProgressText();
        }

        // 拖拽逻辑
        let draggingNode = null;
        let dragStartX, dragStartY, initialNodeX, initialNodeY;

        function handleDragStart(e) {
            if (!isEditMode) return;
            draggingNode = this;
            this.classList.add('dragging');
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            
            const stepId = parseInt(this.dataset.id);
            const step = sysData.steps.find(s => s.id === stepId);
            initialNodeX = step.x;
            initialNodeY = step.y;
        }

        document.addEventListener('mousemove', (e) => {
            if (!isEditMode || !draggingNode) return;
            
            const dx = e.clientX - dragStartX;
            const dy = e.clientY - dragStartY;
            const percentDx = (dx / window.innerWidth) * 100;
            const percentDy = (dy / window.innerHeight) * 100;
            
            let newX = initialNodeX + percentDx;
            let newY = initialNodeY + percentDy;
            newX = Math.max(2, Math.min(98, newX));
            newY = Math.max(2, Math.min(98, newY));

            draggingNode.style.left = `${newX}%`;
            draggingNode.style.top = `${newY}%`;

            const stepId = parseInt(draggingNode.dataset.id);
            const step = sysData.steps.find(s => s.id === stepId);
            step.x = newX;
            step.y = newY;
            
            renderLines();
        });

        document.addEventListener('mouseup', () => {
            if (draggingNode) {
                draggingNode.classList.remove('dragging');
                draggingNode = null;
                saveData(); 
            }
        });

        // 查阅舱逻辑与色彩选择器
        const chamber = document.getElementById('detail-chamber');
        
        function openChamber(stepId) {
            activeNodeId = stepId;
            const step = sysData.steps.find(s => s.id === stepId);

            document.getElementById('detail-meta').textContent = `NODE // ${String(stepId).padStart(3, '0')}`;
            document.getElementById('detail-title').textContent = step.name;
            document.getElementById('detail-desc').textContent = step.desc || '没有提供任何关于此节点的解析。';
            
            const toolLink = document.getElementById('detail-tool-link');
            if(step.url) {
                toolLink.href = step.url;
                toolLink.style.display = 'inline-flex';
            } else {
                toolLink.style.display = 'none';
            }

            renderColorPalette(step.color);
            chamber.classList.add('open');
        }

        function renderColorPalette(activeColor) {
            const paletteContainer = document.getElementById('color-palette');
            paletteContainer.innerHTML = '';
            
            PALETTE.forEach(color => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                if (color === activeColor) swatch.classList.add('selected');
                swatch.style.backgroundColor = color;
                
                swatch.addEventListener('click', () => {
                    if(!activeNodeId) return;
                    const step = sysData.steps.find(s => s.id === activeNodeId);
                    step.color = color;
                    saveData();
                    renderUniverse(); // 刷新节点和连线颜色
                    
                    // 更新面板UI
                    document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('selected'));
                    swatch.classList.add('selected');
                });
                
                paletteContainer.appendChild(swatch);
            });
        }

        document.getElementById('chamber-close').addEventListener('click', () => {
            chamber.classList.remove('open');
            activeNodeId = null;
        });


        // ==================== 5. 全局控制 & JSON ====================
        
        function bindEvents() {
            document.getElementById('btn-edit-mode').addEventListener('click', function() {
                isEditMode = !isEditMode;
                this.classList.toggle('active', isEditMode);
                chamber.classList.remove('open'); 
                
                const nodes = document.querySelectorAll('.node');
                if(isEditMode) {
                    document.body.style.cursor = 'crosshair';
                    nodes.forEach(n => n.style.cursor = 'grab');
                    showToast('坐标重构模式已开启，请拖拽节点');
                } else {
                    document.body.style.cursor = 'default';
                    nodes.forEach(n => n.style.cursor = 'default');
                    showToast('坐标已锁定');
                }
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                if(confirm('警告：此操作将清空所有进度，并将代码回滚至宇宙原初状态。确定吗？')) {
                    sysData = JSON.parse(JSON.stringify(DEFAULT_DATA));
                    progressData = {};
                    saveData();
                    renderUniverse();
                    chamber.classList.remove('open');
                    showToast('宇宙已格式化');
                }
            });

            const modal = document.getElementById('config-modal');
            const jsonInput = document.getElementById('json-input');

            document.getElementById('btn-json').addEventListener('click', () => {
                jsonInput.value = JSON.stringify(sysData, null, 4);
                modal.classList.add('open');
            });

            document.getElementById('btn-json-cancel').addEventListener('click', () => {
                modal.classList.remove('open');
            });

            document.getElementById('btn-json-apply').addEventListener('click', () => {
                try {
                    const parsed = JSON.parse(jsonInput.value);
                    if(!parsed.steps || !Array.isArray(parsed.steps)) throw new Error('Invalid Genesis Format');
                    sysData = parsed;
                    saveData();
                    renderUniverse();
                    modal.classList.remove('open');
                    showToast('底层法则已重塑');
                } catch (err) {
                    alert('重塑失败：底层语法破损 (JSON 格式错误)\n' + err.message);
                }
            });
        }

        // ==================== 启动 ====================
        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
