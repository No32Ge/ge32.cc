<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI Batch Pro - Pristine Flow</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

    <style>
        /* ================= 极致纯净的全局样式 ================= */
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: #fafafa; /* 极其干净的浅灰色底 */
            color: #111827; 
            margin: 0; 
            overflow: hidden; 
            transition: background-color 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* 优雅的滚动条 */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* 输入框高级质感 */
        .workspace-input { 
            width: 100%; background: #ffffff; border: 1px solid #e5e7eb; 
            color: #111827; border-radius: 8px; padding: 8px 12px; 
            font-size: 0.85rem; transition: all 0.2s ease; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .workspace-input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
        textarea.ghost-input { resize: none; background: transparent; border: none; outline: none; padding: 0; box-shadow: none; color: #374151; }
        textarea.ghost-input:focus { outline: none; box-shadow: none; }

        /* 气泡对话美化 */
        .chat-msg { display: flex; gap: 16px; margin-bottom: 24px; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .avatar { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .avatar.user { background: #3b82f6; }
        .avatar.ai { background: #10b981; }
        .avatar.system { background: #64748b; }
        .avatar.report { background: #8b5cf6; }

        .bubble { background: #ffffff; border: 1px solid #f1f5f9; border-radius: 12px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02), 0 2px 4px -1px rgba(0,0,0,0.02); flex: 1; max-width: 85%; }
        
        /* 进度条 */
        .progress-container { width: 100%; background: #f1f5f9; border-radius: 999px; height: 6px; overflow: hidden; margin-top: 12px; }
        .progress-bar { height: 100%; background: #6366f1; transition: width 0.3s ease; }
        
        /* 按钮与拖拽区 */
        .btn-action { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; font-size: 0.85rem; padding: 8px 18px; border-radius: 8px; transition: all 0.2s; cursor: pointer; }
        .file-upload-wrapper { border: 1.5px dashed #cbd5e1; border-radius: 10px; padding: 20px; text-align: center; background: #f8fafc; transition: all 0.2s; cursor: pointer; }
        .file-upload-wrapper:hover { border-color: #6366f1; background: #eef2ff; }

        /* ================= ✨ 纯净聚焦流引擎 (Focus Mode) ================= */
        #layoutWrapper {
            display: flex;
            align-items: center;
            height: 100%;
            width: 100%;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
        }

        .panel-section {
            height: 100%;
            background: #ffffff;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, opacity, filter, width;
            flex-shrink: 0;
        }

        /* 开启 Focus Mode 时的全局环境 */
        .focus-mode-active {
            background-color: #e2e8f0 !important; /* 高级灰底色 */
        }

        .focus-mode-active #layoutWrapper {
            gap: 2rem;
        }

        /* Focus Mode 下的面板变为圆润悬浮卡片 */
        .focus-mode-active .panel-section {
            height: 90%;
            border-radius: 20px;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.02);
            overflow: hidden;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
        }

        /* 聚焦态：大尺寸、绝对清晰 */
        .focus-mode-active .panel-focused {
            transform: scale(1);
            opacity: 1;
            filter: blur(0px);
            z-index: 30;
            pointer-events: auto;
        }

        /* 失焦态：缩小、泛白半透明、模糊，本身化为一个巨大按钮 */
        .focus-mode-active .unfocused {
            transform: scale(0.85);
            opacity: 0.6;
            filter: blur(3px);
            z-index: 10;
            cursor: pointer;
            pointer-events: auto;
        }
        
        .focus-mode-active .unfocused:hover {
            opacity: 0.8;
            transform: scale(0.88);
            filter: blur(1px);
        }

        /* 阻止在失焦状态下误触内部元素 */
        .focus-mode-active .unfocused * {
            pointer-events: none !important;
        }

        /* 动态宽屏隐藏按钮 */
        .focus-mode-active .focus-hide { display: none !important; }
        
        /* 磁性变量 */
        .var-tag { transition: all 0.2s; }
        .var-tag:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2); }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden relative">

    <!-- 顶部状态栏与开关 -->
    <div class="fixed top-4 w-full px-6 z-[100] flex justify-between items-center pointer-events-none">
        <div class="flex items-center gap-2 bg-white/80 backdrop-blur px-3 py-1.5 rounded-full shadow-sm border border-slate-200 pointer-events-auto">
            <span id="saveIndicator" class="text-[0.65rem] font-medium text-slate-400 transition-opacity"><i class="fa-solid fa-cloud-arrow-up"></i> 已同步</span>
        </div>
        
        <!-- Focus Mode 拨动开关 -->
        <button onclick="toggleFocusMode()" class="pointer-events-auto bg-white/90 backdrop-blur-md border border-slate-200 text-slate-700 px-4 py-1.5 rounded-full shadow-sm flex items-center gap-2 hover:bg-slate-50 transition-all">
            <i id="focusIcon" class="fa-solid fa-expand text-indigo-500"></i>
            <span class="text-[0.7rem] font-bold tracking-wide" id="focusText">FOCUS MODE</span>
        </button>

        <button onclick="openConfigModal()" class="pointer-events-auto bg-white/80 backdrop-blur px-3 py-1.5 rounded-full shadow-sm border border-slate-200 text-slate-600 hover:text-indigo-600 transition-colors">
            <i class="fa-solid fa-gear"></i>
        </button>
    </div>

    <!-- 核心排布容器 -->
    <div id="layoutWrapper">

        <!-- [面板 1] 数据与引擎配置 -->
        <aside id="panelLeft" class="w-[340px] border-r border-slate-200 flex flex-col z-10 panel-section" onclick="handleCardClick('left')">
            <div class="p-5 border-b border-slate-100 flex items-center gap-3 shrink-0 focus-hide bg-white">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold shadow-md shadow-indigo-200"><i class="fa-solid fa-layer-group"></i></div>
                <div><h1 class="font-bold text-slate-800 text-sm leading-tight">Batch Pro</h1><p class="text-[0.65rem] text-slate-500 font-mono">Pristine Flow</p></div>
            </div>

            <div class="flex-1 overflow-y-auto p-5 space-y-6">
                <!-- API Gateway -->
                <div>
                    <div class="text-[0.75rem] font-bold text-slate-400 uppercase tracking-wider mb-3"><i class="fa-solid fa-network-wired text-indigo-400 mr-1"></i> API Gateway</div>
                    <div class="space-y-3">
                        <div><label class="text-[0.7rem] text-slate-500 block mb-1">Base URL</label><input type="text" id="cfgBaseUrl" class="workspace-input" value="https://api.deepseek.com"></div>
                        <div><label class="text-[0.7rem] text-slate-500 block mb-1">API Key</label><input type="password" id="cfgApiKey" class="workspace-input" value=""></div>
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="text-[0.7rem] text-slate-500 block mb-1">Model</label><input type="text" id="cfgModel" class="workspace-input" value="deepseek-chat"></div>
                            <div><label class="text-[0.7rem] text-slate-500 block mb-1">Workers</label><input type="number" id="cfgMaxWorkers" class="workspace-input" value="50"></div>
                            <!-- 确保代码里用到的元素都在这里，避免 null 报错 -->
                            <div><label class="text-[0.7rem] text-slate-500 block mb-1">Max Retries</label><input type="number" id="cfgMaxRetries" class="workspace-input" value="3"></div>
                            <div><label class="text-[0.7rem] text-slate-500 block mb-1">Delay (s)</label><input type="number" id="cfgDelay" class="workspace-input" value="1"></div>
                        </div>
                    </div>
                </div>

                <!-- Data Source -->
                <div>
                    <div class="text-[0.75rem] font-bold text-slate-400 uppercase tracking-wider mb-3"><i class="fa-solid fa-database text-emerald-400 mr-1"></i> Data Source</div>
                    <div class="file-upload-wrapper mb-3 border-slate-200">
                        <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv">
                        <i class="fa-solid fa-cloud-arrow-up text-2xl text-indigo-400 mb-2"></i>
                        <p class="text-xs text-slate-600 font-medium">点击或拖拽上传 Excel / CSV</p>
                        <p class="text-[0.65rem] text-slate-400 mt-1" id="fileNameDisplay">未选择文件</p>
                    </div>
                    <div class="flex items-center gap-2 mb-3 bg-slate-50 p-2 rounded-lg border border-slate-100">
                        <span class="text-xs text-slate-500">表头所在行:</span><input type="number" id="headerRowNum" min="1" value="1" class="workspace-input w-16 !py-1 text-center">
                        <button id="loadFieldsBtn" class="btn-secondary px-2 py-1 text-xs rounded-md ml-auto text-indigo-600">解析提取</button>
                    </div>
                    
                    <div class="bg-indigo-50/50 rounded-lg p-4 text-xs font-mono border border-indigo-100/50 relative">
                        <div class="text-slate-500 text-[0.65rem] mb-2"><i class="fa-solid fa-magnet mr-1"></i>可拖拽变量:</div>
                        <div id="fieldPreview" class="flex flex-wrap gap-1.5 relative z-10 text-indigo-700">等待解析...</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- [面板 2] 中央对话执行区 -->
        <main id="panelCenter" class="flex-1 flex flex-col relative bg-[#f8fafc] z-20 panel-section border-x border-slate-200" onclick="handleCardClick('center')">
            <div id="chatArea" class="flex-1 overflow-y-auto p-6 md:p-10 pb-32"></div>
            
            <div class="absolute bottom-8 right-8 z-50 flex flex-col items-end gap-3 pointer-events-none">
                <div class="bg-white/90 backdrop-blur px-3 py-1.5 rounded-full shadow-sm text-[0.65rem] font-bold text-slate-600 flex items-center gap-2 border border-slate-200 pointer-events-auto">
                    <span id="dataStatusIndicator"><i class="fa-solid fa-circle text-red-500 text-[0.5rem] align-middle mr-1"></i> 离线</span>
                    <span class="w-[1px] h-3 bg-slate-200"></span>
                    <span id="systemStatusIndicator"><i class="fa-solid fa-circle text-emerald-500 text-[0.5rem] align-middle mr-1"></i> 空闲</span>
                </div>
                <button id="fabBtn" class="group relative w-14 h-14 bg-indigo-600 text-white rounded-full shadow-[0_8px_20px_rgba(79,70,229,0.3)] flex items-center justify-center text-xl hover:bg-indigo-700 hover:scale-105 transition-all duration-300 pointer-events-auto">
                    <i id="fabIcon" class="fa-solid fa-play ml-1"></i>
                    <span id="fabTooltip" class="absolute right-full mr-4 bg-slate-800 text-white text-xs px-3 py-1.5 rounded opacity-0 group-hover:opacity-100 whitespace-nowrap pointer-events-none transition-opacity">开始执行当前策略</span>
                </button>
            </div>
        </main>

        <!-- [面板 3] 右侧策略配置区 -->
        <aside id="panelRight" class="w-[400px] flex flex-col z-10 panel-section border-l border-slate-200" onclick="handleCardClick('right')">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center shrink-0 bg-white focus-hide">
                <h2 class="font-bold text-slate-800 text-sm flex items-center"><i class="fa-solid fa-brain mr-2 text-indigo-500"></i>Prompt Strategy</h2>
                <button id="toggleRightPanelBtn" class="text-slate-400 hover:text-indigo-600 text-xs px-2 py-1 bg-slate-100 hover:bg-indigo-50 rounded transition-colors"><i class="fa-solid fa-angles-left"></i> 宽屏模式</button>
            </div>

            <!-- 多策略选择器 -->
            <div class="px-4 py-3 bg-slate-50/50 border-b border-slate-100 flex items-center gap-1.5 shrink-0 shadow-sm relative z-20">
                <i class="fa-solid fa-layer-group text-indigo-400 text-xs ml-1 mr-1"></i>
                <select id="strategySelector" class="workspace-input !py-1.5 flex-1 text-xs font-bold text-indigo-700 bg-white border-slate-200 cursor-pointer shadow-sm"></select>
                <button id="btnNewStrategy" class="btn-secondary !p-1.5 rounded text-indigo-600 w-8 flex justify-center bg-white shadow-sm"><i class="fa-solid fa-plus text-xs"></i></button>
                <button id="btnRenameStrategy" class="btn-secondary !p-1.5 rounded text-slate-500 hover:text-indigo-600 w-8 flex justify-center bg-white shadow-sm"><i class="fa-solid fa-pen text-xs"></i></button>
                <button id="btnDeleteStrategy" class="btn-secondary !p-1.5 rounded text-slate-500 hover:text-red-500 w-8 flex justify-center bg-white shadow-sm"><i class="fa-solid fa-trash text-xs"></i></button>
            </div>

            <div class="flex-1 overflow-y-auto p-5 space-y-6 bg-white relative">
                <!-- System -->
                <div class="relative group">
                    <label class="text-[0.75rem] font-semibold text-slate-700 block mb-2"><i class="fa-solid fa-terminal mr-1 text-slate-400"></i> System Instructions</label>
                    <div class="bg-transparent relative pb-1">
                        <textarea id="cfgSystem" class="ghost-input font-mono text-[0.75rem] leading-relaxed w-full transition-all" rows="6"></textarea>
                        <div class="absolute bottom-0 w-full h-[1px] border-b border-dashed border-slate-200 group-hover:border-indigo-400 transition-colors"></div>
                    </div>
                </div>

                <!-- Template -->
                <div>
                    <label class="text-[0.75rem] font-semibold text-slate-700 block mb-2 flex justify-between">
                        <span><i class="fa-solid fa-code mr-1 text-slate-400"></i> Prompt Template</span>
                        <span class="text-[0.65rem] text-indigo-500 font-normal">支持变量拖拽注入</span>
                    </label>
                    <textarea id="cfgTemplate" class="workspace-input font-mono text-[0.75rem] leading-relaxed resize-y border-dashed focus:border-solid border-slate-300" rows="5" placeholder="将左侧胶囊拖拽至此处..."></textarea>
                    <div class="mt-2 flex justify-between items-center">
                        <span class="text-[0.65rem] text-slate-400">最大字符截断数</span>
                        <input type="number" id="cfgMaxChars" class="workspace-input w-20 !py-0.5 text-center text-xs" value="20000">
                    </div>
                </div>

                <!-- Few Shot -->
                <div class="border-t border-slate-100 pt-5">
                    <div class="flex justify-between items-center mb-3">
                        <label class="text-[0.75rem] font-semibold text-slate-700"><i class="fa-solid fa-list-check mr-1 text-slate-400"></i> Few-Shot 样本</label>
                        <button id="addSampleBtn" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-2 py-1 text-[0.65rem] rounded font-medium transition-colors"><i class="fa-solid fa-plus"></i> 添加样本</button>
                    </div>
                    <div class="mb-4 bg-slate-50 p-2.5 rounded-lg border border-slate-100 text-[0.7rem] flex items-center justify-between">
                        <label class="flex items-center gap-2 cursor-pointer text-slate-600 font-medium"><input type="checkbox" id="enableRandomSample" class="rounded border-slate-300 text-indigo-500 focus:ring-indigo-500"> <span>开启随机挑选(防缓存)</span></label>
                        <div class="flex items-center gap-1"><span class="text-slate-400">取</span><input type="number" id="randomSampleCount" class="workspace-input w-10 !py-0.5 text-center font-bold text-indigo-600" value="1" min="1"><span class="text-slate-400">个</span></div>
                    </div>
                    <div id="samplesContainer" class="space-y-3"></div>
                </div>
            </div>
        </aside>

    </div>

    <!-- ================= 齿轮配置 Modal ================= -->
    <div id="configModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[150] hidden flex items-center justify-center opacity-0 transition-opacity duration-200">
        <div class="bg-white w-11/12 max-w-md rounded-2xl shadow-2xl flex flex-col transform scale-95 transition-transform duration-200" id="configModalContent">
            <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                <h3 class="font-bold text-slate-800 text-sm"><i class="fa-solid fa-sliders text-indigo-500 mr-2"></i> Global Configuration</h3>
                <button onclick="closeConfigModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 space-y-5">
                <div>
                    <h4 class="text-xs font-bold text-slate-500 mb-2 uppercase">Export Space</h4>
                    <div class="flex gap-2">
                        <button onclick="exportAppConfig()" class="btn-secondary flex-1 !py-1.5 text-xs"><i class="fa-solid fa-download mr-1"></i> 下载 JSON</button>
                        <button onclick="copyAppConfig()" class="btn-secondary px-3 !py-1.5 text-xs"><i class="fa-solid fa-copy"></i></button>
                    </div>
                </div>
                <div>
                    <h4 class="text-xs font-bold text-slate-500 mb-2 uppercase">Import Space</h4>
                    <textarea id="importArea" class="workspace-input text-[0.7rem] h-16 mb-2" placeholder="粘贴完整的 JSON 配置文件..."></textarea>
                    <div class="flex gap-2">
                        <button onclick="importAppConfigFromText()" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg flex-1 !py-1.5 text-xs font-medium transition-colors"><i class="fa-solid fa-check mr-1"></i> 应用配置</button>
                        <div class="relative"><input type="file" id="configFileImport" accept=".json" class="absolute inset-0 opacity-0 cursor-pointer"><button class="btn-secondary px-3 !py-1.5 text-xs"><i class="fa-solid fa-folder-open"></i></button></div>
                    </div>
                </div>
                <div class="border-t border-slate-100 pt-4">
                    <button onclick="resetAppConfig()" class="w-full bg-red-50 hover:bg-red-100 text-red-600 rounded-lg py-2 text-xs font-bold transition-colors"><i class="fa-solid fa-trash-arrow-up mr-1"></i> 恢复出厂设置并清空缓存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= 日志 Modal ================= -->
    <div id="logModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[150] hidden flex items-center justify-center opacity-0 transition-opacity duration-200">
        <div class="bg-white w-11/12 max-w-2xl rounded-2xl shadow-2xl flex flex-col max-h-[80vh] transform scale-95 transition-transform duration-200" id="logModalContent">
            <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                <h3 class="font-bold text-slate-800 text-sm"><i class="fa-solid fa-terminal text-slate-500 mr-2"></i> Execution Logs</h3>
                <button onclick="closeLogsModal()" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-5 overflow-y-auto flex-1 bg-[#1e293b] text-emerald-400 font-mono text-[0.8rem] leading-relaxed" id="logModalBody"></div>
            <div class="px-4 py-3 border-t border-slate-100 flex justify-end bg-slate-50 rounded-b-2xl">
                <button onclick="closeLogsModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-1.5 rounded-lg text-sm transition-colors">关闭</button>
            </div>
        </div>
    </div>

    <script>
        // ================= 全局系统状态 =================
        let rawExcelData = [], headers = [], completedResults = {}, failedTasks = [], currentRunLogs = [];
        let isRunning = false, forceStopFlag = false;
        const chatArea = document.getElementById('chatArea');

        // ================= ✨ 纯净聚焦流引擎 (Focus Mode Logic) =================
        let isFocusMode = false;
        let currentFocus = 'center'; // 'left', 'center', 'right'

        function toggleFocusMode() {
            isFocusMode = !isFocusMode;
            const icon = document.getElementById('focusIcon'), text = document.getElementById('focusText');
            
            if (isFocusMode) {
                document.body.classList.add('focus-mode-active');
                icon.className = "fa-solid fa-compress text-indigo-500";
                text.innerText = "EXIT FOCUS";
                applyFocusLayout(currentFocus);
            } else {
                document.body.classList.remove('focus-mode-active');
                icon.className = "fa-solid fa-expand text-indigo-500";
                text.innerText = "FOCUS MODE";
                resetLayout();
            }
            saveConfig();
        }

        // 统一控制卡片点击时的流转
        function handleCardClick(target) {
            if (!isFocusMode) return;
            if (currentFocus !== target) {
                currentFocus = target;
                applyFocusLayout(target);
            }
        }

        function resetLayout() {
            const wrapper = document.getElementById('layoutWrapper');
            const panels = [document.getElementById('panelLeft'), document.getElementById('panelCenter'), document.getElementById('panelRight')];
            wrapper.style.transform = `translateX(0px)`;
            panels.forEach(p => {
                p.classList.remove('unfocused', 'panel-focused');
                p.style.width = '';
            });
            document.getElementById('panelLeft').style.width = '340px';
            document.getElementById('panelRight').style.width = '400px';
        }

        function applyFocusLayout(target) {
            const wrapper = document.getElementById('layoutWrapper');
            const pL = document.getElementById('panelLeft'), pC = document.getElementById('panelCenter'), pR = document.getElementById('panelRight');
            
            // 设定宽幅标准
            const w = window.innerWidth;
            const focusedWidth = Math.max(800, Math.min(1100, w * 0.6));
            const unfocusedWidth = 280;
            const gap = 32; // 2rem

            // 设置各自宽度及状态
            [pL, pC, pR].forEach(p => p.classList.add('unfocused'));
            [pL, pC, pR].forEach(p => p.classList.remove('panel-focused'));

            if (target === 'left') {

        function createAITaskBubble(totalTasks) {
            const bId = 'ai-task-' + Date.now();
            chatArea.insertAdjacentHTML('beforeend', `<div class="chat-msg"><div class="avatar ai"><i class="fa-solid fa-microchip"></i></div><div class="bubble shadow-md border-emerald-100"><div class="bubble-header text-emerald-700">Engine Worker <span class="font-normal text-[0.65rem] text-slate-400">${new Date().toLocaleTimeString()}</span></div><div class="text-sm mb-3 font-semibold text-slate-700" id="${bId}-text">任务分发中... [并发: ${totalTasks}]</div><div class="bg-slate-50 border border-slate-100 rounded-lg p-3 text-xs font-mono shadow-inner"><div class="flex justify-between mb-1 text-slate-600"><span>已完成: <span id="${bId}-count" class="font-bold text-indigo-600">0</span> / ${totalTasks}</span><span id="${bId}-percent" class="text-slate-500">0%</span></div><div class="progress-container"><div id="${bId}-bar" class="progress-bar" style="width: 0%"></div></div><div class="flex gap-4 mt-2 font-semibold"><span class="text-emerald-600">SUCCESS <span id="${bId}-success">0</span></span><span class="text-red-500">FAIL <span id="${bId}-error">0</span></span></div><div id="${bId}-log" class="mt-2 text-[0.65rem] text-slate-400 max-h-24 overflow-y-auto"></div></div></div></div>`);

                finish: (txt) => { document.getElementById(`${bId}-text`).innerHTML = txt; document.getElementById(`${bId}-bar`).classList.add('success'); scrollToBottom(); }
            };

        async function fetchAIResponse(messages, config, attempt = 1) {
            if (config.delay > 0 && attempt === 1) await new Promise(r => setTimeout(r, config.delay * 1000));
            try {
                let ep = config.baseUrl; if (!ep.endsWith('/chat/completions')) ep = ep.replace(/\/$/, '') + '/chat/completions';
                const r = await fetch(ep, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.apiKey}` }, body: JSON.stringify({ model: config.model, messages: messages }) });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const d = await r.json(); let text = d.choices[0].message.content.replace(/```json/gi, '').replace(/```/g, '').trim();
                let f1 = text.search(/[\{\[]/), f2 = Math.max(text.lastIndexOf('}'), text.lastIndexOf(']'));
                if (f1 !== -1 && f2 !== -1) return JSON.parse(text.substring(f1, f2 + 1));
                throw new Error("AI Returned Malformed JSON");
            } catch (err) {
                if (attempt < config.maxRetries && !forceStopFlag) { await new Promise(r => setTimeout(r, 2000)); return fetchAIResponse(messages, config, attempt + 1); }
                throw err;
            }
        }

        async function executeBatchLogic(dataToProcess) {
            // 安全读取 DOM，防止意外报错
            const config = { 
                baseUrl: document.getElementById('cfgBaseUrl')?.value.trim() || '', 
                apiKey: document.getElementById('cfgApiKey')?.value.trim() || '', 
                model: document.getElementById('cfgModel')?.value.trim() || '', 
                maxWorkers: parseInt(document.getElementById('cfgMaxWorkers')?.value, 10) || 10, 
                maxRetries: parseInt(document.getElementById('cfgMaxRetries')?.value, 10) || 3, 
                delay: parseFloat(document.getElementById('cfgDelay')?.value) || 0, 
                maxChars: parseInt(document.getElementById('cfgMaxChars')?.value, 10) || 20000, 
                system: document.getElementById('cfgSystem')?.value.trim() || '', 
                template: document.getElementById('cfgTemplate')?.value.trim() || '', 
                samples: [] 
            };
            let actS = []; document.querySelectorAll('.sample-item').forEach(el => { if (el.querySelector('.sample-active-toggle').checked) actS.push({ user: el.querySelector('.sample-user').value.trim(), assistant: el.querySelector('.sample-assistant').value.trim() }); });
            config.samples = (document.getElementById('enableRandomSample')?.checked && actS.length > 0) ? actS.sort(() => 0.5 - Math.random()).slice(0, parseInt(document.getElementById('randomSampleCount')?.value, 10) || 1) : actS;

            const uiT = createAITaskBubble(dataToProcess.length);
            let fail = [], sCount = 0, eCount = 0, i = 0;
            
            const worker = async () => {
                while (i < dataToProcess.length && !forceStopFlag) {
                    const item = dataToProcess[i++]; 
                    try {
                        let pt = config.template; headers.forEach((h, idx) => { if (!h) return; let v = item.row[idx] !== undefined ? String(item.row[idx]) : '[空]'; if (v.length > config.maxChars) v = v.substring(0, config.maxChars) + "\n...[截断]"; pt = pt.split(`{{${h}}}`).join(v); });
                        const msgs = []; if (config.system) msgs.push({ role: "system", content: config.system }); config.samples.forEach(s => { msgs.push({ role: "user", content: s.user }); msgs.push({ role: "assistant", content: s.assistant }); }); msgs.push({ role: "user", content: pt });
                        
                        const res = await fetchAIResponse(msgs, config); completedResults[item.index] = res; sCount++;
                        currentRunLogs.push(`ID[${item.index}] SUCCESS`); uiT.updateProgress(sCount, eCount, `Record[${item.index}] Created`);
                    } catch (e) {
                        fail.push({ index: item.index, row: item.row, error: e.message }); eCount++;
                        currentRunLogs.push(`ID[${item.index}] FAIL: ${e.message}`); uiT.updateProgress(sCount, eCount, `Record[${item.index}] ${e.message}`, true);
                    }
                }
            };
            await Promise.all(Array.from({ length: Math.min(config.maxWorkers, dataToProcess.length) }, () => worker()));
            failedTasks = fail;
            uiT.finish(forceStopFlag ? `<span class="text-red-500">✋ 执行被强行中止</span>` : `✅ 引擎处理完毕`);
            setTimeout(() => {
                let hTxt = forceStopFlag ? '任务已中止' : '运行结果汇总';
                let btns = sCount>0 ? `<button onclick="exportExcel()" class="btn-action bg-emerald-500 hover:bg-emerald-600 text-white mr-2 shadow-sm"><i class="fa-solid fa-file-excel"></i> 导出 Excel</button><button onclick="exportJSON()" class="btn-action bg-slate-200 hover:bg-slate-300 text-slate-700 mr-2"><i class="fa-solid fa-file-code"></i> JSON</button>`:'';
                if(eCount>0) btns+=`<button onclick="triggerRetry()" class="btn-action bg-red-50 text-red-600 border border-red-200 hover:bg-red-100"><i class="fa-solid fa-rotate-right"></i> 一键重试失败项 (${eCount})</button>`;
                chatArea.insertAdjacentHTML('beforeend', `<div class="chat-msg"><div class="avatar report"><i class="fa-solid fa-clipboard-check"></i></div><div class="bubble border-indigo-100 bg-white shadow-lg"><div class="bubble-header text-indigo-700">Execution Report <span class="font-normal text-[0.65rem] text-slate-400">${new Date().toLocaleTimeString()}</span></div><div class="text-[0.9rem] text-slate-700"><h3 class="font-bold mb-1">${hTxt}</h3><div class="mt-2 p-3 bg-slate-50 rounded-lg border border-slate-200"><p class="text-sm mb-2"><strong class="text-emerald-600">${sCount}</strong> 成功 / <strong class="text-red-500">${eCount}</strong> 失败</p><button onclick="showLogsModal()" class="text-xs bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 px-3 py-1.5 rounded shadow-sm"><i class="fa-solid fa-rectangle-list"></i> 查看详细执行日志</button></div><div class="mt-3 pt-3 border-t border-slate-100">${btns}</div></div></div></div>`);
                scrollToBottom();
            }, 600);
        }

        const fabBtn = document.getElementById('fabBtn'), fabIcon = document.getElementById('fabIcon'), fabTooltip = document.getElementById('fabTooltip');
        fabBtn.addEventListener('click', async () => {
            if (isRunning) {
                forceStopFlag = true; fabBtn.disabled = true; fabIcon.className = "fa-solid fa-spinner fa-spin";
            } else {
                if (rawExcelData.length === 0) return alert("请先上传并解析数据源文件！");
                
                completedResults = {}; failedTasks = []; currentRunLogs = []; isRunning = true; forceStopFlag = false;
                fabIcon.className = "fa-solid fa-stop"; fabBtn.classList.replace('bg-indigo-600', 'bg-red-500'); fabBtn.classList.replace('hover:bg-indigo-700', 'hover:bg-red-600'); fabTooltip.innerText = "中止任务";
                document.getElementById('systemStatusIndicator').innerHTML = `<i class="fa-solid fa-circle text-indigo-500 text-[0.5rem] align-middle mr-1 animate-pulse"></i> 运行中`;
                
                appendUserMessage(`采用策略 <b>[${document.getElementById('strategySelector').options[document.getElementById('strategySelector').selectedIndex].text}]</b> 执行，队列总计: <b>${rawExcelData.length}</b> 行。`);
                await executeBatchLogic(rawExcelData); cleanupRunState();
            }
        });
        window.triggerRetry = async function() {
            if (failedTasks.length === 0 || isRunning) return;
            isRunning = true; forceStopFlag = false; fabIcon.className = "fa-solid fa-stop"; fabBtn.classList.replace('bg-indigo-600', 'bg-red-500'); fabBtn.classList.replace('hover:bg-indigo-700', 'hover:bg-red-600');
            document.getElementById('systemStatusIndicator').innerHTML = `<i class="fa-solid fa-circle text-orange-500 text-[0.5rem] align-middle mr-1 animate-pulse"></i> 重载修复中`;
            appendUserMessage(`开始重试 <b>${failedTasks.length}</b> 条失败任务...`);
            await executeBatchLogic(failedTasks.map(f => ({ index: f.index, row: f.row }))); cleanupRunState();
        };
        function cleanupRunState() {
            isRunning = false; fabBtn.disabled = false; fabIcon.className = "fa-solid fa-play ml-1"; 
            fabBtn.classList.remove('bg-red-500', 'hover:bg-red-600'); fabBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
            fabTooltip.innerText = "开始执行当前策略"; document.getElementById('systemStatusIndicator').innerHTML = `<i class="fa-solid fa-circle text-emerald-500 text-[0.5rem] align-middle mr-1"></i> 空闲`;
        }

        // Export/Logs Modals
        function getFlattenedData() { return Object.keys(completedResults).sort((a,b)=>a-b).reduce((acc, k) => { const res = completedResults[k]; Array.isArray(res) ? acc.push(...res) : acc.push(res); return acc; }, []); }
        window.exportJSON = function() { const data = getFlattenedData(); if(!data.length) return alert("无数据导出"); const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })); link.download = `BatchPro_${Date.now()}.json`; link.click(); };
        window.exportExcel = function() { const data = getFlattenedData(); if(!data.length) return alert("无数据导出"); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), "Sheet1"); XLSX.writeFile(wb, `BatchPro_${Date.now()}.xlsx`); };
        
        function showLogsModal() { const modal = document.getElementById('logModal'), body = document.getElementById('logModalBody'); body.innerHTML = currentRunLogs.map(log => log.includes('FAIL') ? `<div class="text-red-400 mb-1">${log}</div>` : `<div class="mb-1 text-emerald-400/80">${log}</div>`).join('') || '<div class="text-slate-500">无日志记录。</div>'; modal.classList.remove('hidden'); void modal.offsetWidth; modal.classList.remove('opacity-0'); document.getElementById('logModalContent').classList.remove('scale-95'); setTimeout(() => { body.scrollTop = body.scrollHeight; }, 50); }
        function closeLogsModal() { const m = document.getElementById('logModal'), c = document.getElementById('logModalContent'); m.classList.add('opacity-0'); c.classList.add('scale-95'); setTimeout(() => m.classList.add('hidden'), 200); }

        window.addEventListener('DOMContentLoaded', () => {
            loadConfig();
            appendSystemMessage("工作台 v7.0 (Pristine Flow 纯净版) 初始化完毕。<br><br>💡 新特性：<br>1. 点击顶部 <strong>FOCUS MODE</strong>，背景变淡，面板悬浮。此时<strong>直接点击两侧失焦变小的卡片即可瞬间放大切换</strong>，盲切极度丝滑。<br>2. 修复了 LocalStorage 深层引擎，所有配置毫秒级自动持久化，不再丢失。<br>3. 全局设置（重置、导出配置）已移至顶部右上角的 <i class='fa-solid fa-gear'></i> 齿轮按钮中。");
        });
    </script>
</body>
</html>
