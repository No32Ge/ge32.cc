<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Lag Time Test</title>
</head>
<body>
    <header>
        <h1>Lag Time</h1>
    </header>
    <div class="container">
        <p>文件上传</p>
        <input type="file" id="fileInput" accept=".xlsx, .xls"><br>
        <div id="showProcess"></div>
    </div>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script>
        const fileInput = document.getElementById('fileInput');
        const showProcess = document.getElementById('showProcess');

        function downloadJSON(data, filename) {
            const jsonStr = JSON.stringify(data, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        fileInput.addEventListener('change', function (event) {
            const file = event.target.files[0];
            if (!file) {
                alert("请先选择一个Excel文件！");
                return;
            }

            showProcess.textContent = '正在转换，请稍候...';
            console.log("文件选择事件触发，文件:", file);

            const reader = new FileReader();
            reader.onload = function (e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const firstSheet = workbook.Sheets[firstSheetName];
                // const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 })
                const jsonData = XLSX.utils.sheet_to_json(firstSheet, {  defval: ""});
                downloadJSON(jsonData, 'converted.json');
                showProcess.textContent = '转换完成，JSON文件已下载。';
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
