<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>代码学习测试区</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
</head>

<body>
    <header>
        <h1>代码学习测试区</h1>
    </header>
    <div class="container">
        <div id="list"></div>
    </div>

    <script>
        const items = [
            {
                "title": "JSON生成excel表格",
                "desc": "将JSON数据转换为Excel表格格式，支持自定义列名和数据类型，方便数据导出和分享。",
                "html": '<textarea id="jsonInput" placeholder="请输入JSON数据"></textarea>',
                "function": function (jsonData) {
                    if (!jsonData) {
                        alert("请先输入JSON数据！");
                        return;
                    }

                    console.log("JSON生成Excel功能被调用", jsonData);
                    alert("功能被调用，输入内容：" + jsonData);
                }
            },
            {
                "title": "excel表格生成JSON",
                "desc": "将Excel表格数据转换为JSON格式，支持多种数据类型和复杂结构，方便数据处理和分析。",
                "html": '<input type="file" id="fileInput" accept=".xlsx, .xls"><br><pre id="jsonResult" style="margin-top:10px; background:#f4f4f4; padding:10px; border-radius:5px; max-height:300px; overflow:auto; display:none;"></pre>',
                "function": function (excelFile) {
                    if (!excelFile) {
                        alert("请先选择一个Excel文件！");
                        return;
                    }

                    // 显示加载状态
                    const resultPre = document.getElementById('jsonResult');
                    resultPre.style.display = 'block';
                    resultPre.textContent = '正在转换，请稍候...';

                    // 读取并转换Excel
                    const reader = new FileReader();
                    console.log("FileReader对象:", reader);
                    console.log("Excel文件:", excelFile);

                    reader.onload = function (e) {
                        try {
                            // 解析Excel
                            const data = new Uint8Array(e.target.result);
                            const workbook = XLSX.read(data, { type: 'array' });
                            const sheetName = workbook.SheetNames[0];
                            console.log("workbook对象:", workbook);
                            const worksheet = workbook.Sheets[sheetName];

                            // 转换为JSON（自动识别表头）
                            const jsonData = XLSX.utils.sheet_to_json(worksheet, {
                                defval: "",      // 空单元格默认值
                                raw: false       // 将数字、日期等转为文本格式
                            });

                            // 美化输出
                            const formattedJson = JSON.stringify(jsonData, null, 2);
                            resultPre.textContent = formattedJson;

                            // 可选：复制到剪贴板的按钮
                            console.log("转换成功，共", jsonData.length, "条数据");
                            alert(`转换成功！共 ${jsonData.length} 条数据，已显示在下方`);

                        } catch (error) {
                            console.error("转换失败:", error);
                            resultPre.textContent = `转换失败：${error.message}`;
                            alert("转换失败，请检查文件格式是否正确");
                        }
                    };

                    reader.onerror = function () {
                        resultPre.textContent = "文件读取失败，请重试";
                        alert("文件读取失败，请重试");
                    };

                    reader.readAsArrayBuffer(excelFile);
                }
            }
        ];


        function renderList(itemsArray) {
            const list = itemsArray.map((item, index) => `
                    <div class="item">
                        <h2>${item.title}</h2>
                        <p>${item.desc}</p>
                        ${item.html}
                        <button onclick="callFunction(${index})">调用功能</button>
                    </div>
                `);
            document.getElementById('list').innerHTML = list.join('');
        }

        // 全局函数供按钮调用
        window.callFunction = function (index) {
            const item = items[index];
            if (item && item.function) {
                let inputValue = '无输入数据';

                if (item.html && typeof item.html === 'string') {
                    const idMatch = item.html.match(/id=["']([^"']+)["']/);
                    if (idMatch && idMatch[1]) {
                        const element = document.getElementById(idMatch[1]);
                        if (element) {
                            // 根据元素类型获取值
                            if (element.type === 'file') {
                                inputValue = element.files[0];
                            } else if (element.type === 'checkbox') {
                                inputValue = element.checked;
                            } else {
                                inputValue = element.value || element.textContent || '无输入数据';
                            }
                        }
                    }
                }

                // 调用函数，传入获取到的值
                item.function(inputValue);
            }
        };

        renderList(items);
    </script>
</body>

</html>
