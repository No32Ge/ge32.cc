<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline Studio Iframe</title>
    <!-- 引入样式库 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff; margin: 0; padding: 12px; }
        .workspace-input {
            width: 100%; border-radius: 0.375rem; border: 1px solid #cbd5e1;
            padding: 0.375rem 0.5rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .workspace-input:focus { border-color: #6366f1; box-shadow: 0 0 0 2px #e0e7ff; }
        html { overflow-y: hidden; }

        /* 微型平滑滚动条 */
        .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* 步骤折叠与展开动画控制 */
        .step-box.collapsed .step-body { display: none; }
        .step-box.collapsed .step-code-preview { display: inline-block; }
        .step-box.collapsed .step-chevron { transform: rotate(-90deg); }
        .step-chevron { transition: transform 0.2s ease; }
    </style>
</head>
<body>
    <div id="pipeline-root" class="max-w-3xl mx-auto">
        <div class="bubble-header text-indigo-700 flex justify-between items-center mb-2">
            <span class="font-bold flex items-center gap-1.5 text-xs">
                <i class="fa-solid fa-cubes text-xs text-indigo-500"></i> 数据管线工作室 (V6.5 - 索引目录按需拉取版)
            </span>
            <span id="loadTime" class="font-normal text-[0.65rem] text-slate-400"></span>
        </div>

        <!-- 专区 1：远程方案索引目录 (Catalog) 状态条 -->
        <div id="catalogStatusBar" class="hidden mb-2 p-2 bg-purple-50/70 border border-purple-200 rounded-lg flex items-center justify-between text-xs">
            <div class="flex items-center gap-1.5">
                <i class="fa-solid fa-sitemap text-purple-600 text-xs"></i>
                <span class="text-[0.68rem] font-bold text-purple-900">URL 方案索引库已挂载：</span>
                <span id="catalogCountTag" class="text-[0.62rem] font-mono bg-purple-200/80 text-purple-800 px-1.5 py-0.2 rounded font-semibold">0 个预方案待命</span>
            </div>
            <span class="text-[0.6rem] text-purple-600 font-mono italic">按需触发时拉取实装</span>
        </div>

        <!-- 专区 2：方案中心（无弹窗内嵌收集表单与本地导入） -->
        <div class="mb-2 p-2 bg-slate-50 border border-slate-200 rounded-lg space-y-2">
            <div class="flex items-center justify-between">
                <span class="text-[0.68rem] font-bold text-slate-700 flex items-center gap-1">
                    <i class="fa-solid fa-bookmark text-indigo-500"></i> 当前激活方案：
                </span>
                <div class="flex items-center gap-1 flex-wrap">
                    <button type="button" id="btnSaveCurrent" class="px-2 py-0.5 bg-white border border-indigo-200 text-indigo-600 hover:bg-indigo-50 rounded text-[0.65rem] font-semibold flex items-center gap-1 transition-colors">
                        <i class="fa-regular fa-floppy-disk"></i> 另存方案
                    </button>
                    <!-- 触发内联导出面板 -->
                    <button type="button" id="btnOpenExportPanel" class="px-2 py-0.5 bg-amber-500 text-white hover:bg-amber-600 rounded text-[0.65rem] font-semibold flex items-center gap-1 transition-colors">
                        <i class="fa-brands fa-js"></i> 导出原子 JS
                    </button>
                    <!-- 导入本地 JS 文件 -->
                    <button type="button" id="btnTriggerImportFile" class="px-2 py-0.5 bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 rounded text-[0.65rem] font-semibold flex items-center gap-1 transition-colors">
                        <i class="fa-solid fa-file-import text-indigo-600"></i> 导入本地 JS
                    </button>
                    <input type="file" id="fileImportJS" accept=".js" class="hidden">
                </div>
            </div>

            <!-- 内联嵌入式「另存方案」就地输入行 -->
            <div id="inlineSavePanel" class="hidden p-2 bg-white border border-indigo-100 rounded-md shadow-2xs space-y-1.5">
                <div class="text-[0.63rem] font-bold text-indigo-800 flex items-center gap-1">
                    <i class="fa-solid fa-floppy-disk text-indigo-500"></i> 保存当前配置到浏览器本地：
                </div>
                <div class="flex items-center gap-1.5">
                    <input type="text" id="inputLocalPresetName" class="workspace-input !py-1 text-xs text-slate-700 flex-1" placeholder="请输入方案显示名称，如: 沃尔玛日常清洗规整">
                    <button type="button" id="btnConfirmSaveLocal" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-xs font-semibold shrink-0">确定保存</button>
                    <button type="button" id="btnCancelSaveLocal" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-xs shrink-0">取消</button>
                </div>
            </div>

            <!-- 内联嵌入式「导出原子 JS 插件」就地收集表单 (完全摆脱弹窗) -->
            <div id="inlineExportPanel" class="hidden p-2.5 bg-amber-50/70 border border-amber-200 rounded-md shadow-2xs space-y-2">
                <div class="flex items-center justify-between">
                    <span class="text-[0.65rem] font-bold text-amber-900 flex items-center gap-1">
                        <i class="fa-brands fa-js text-amber-600"></i> 导出独立原子 JS 插件包：
                    </span>
                    <span class="text-[0.58rem] text-amber-600">导出后可直接用于宿主环境或挂载到 Catalog 索引中</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[0.6rem] text-slate-600 mb-0.5 font-semibold">插件标识 Identifier (英文/数字/下划线):</label>
                        <input type="text" id="exportPresetId" class="workspace-input !py-1 text-xs font-mono text-slate-700" placeholder="例如: walmart_cleaner_v1">
                    </div>
                    <div>
                        <label class="block text-[0.6rem] text-slate-600 mb-0.5 font-semibold">方案中文展示名称:</label>
                        <input type="text" id="exportPresetName" class="workspace-input !py-1 text-xs text-slate-700" placeholder="例如: 沃尔玛商品多规格清洗与定价">
                    </div>
                </div>
                <div class="flex justify-end items-center gap-2 pt-1 border-t border-amber-100">
                    <button type="button" id="btnCancelExport" class="px-2.5 py-0.5 text-xs text-slate-600 hover:bg-amber-100 rounded transition">取消</button>
                    <button type="button" id="btnExecuteExportJS" class="px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-semibold flex items-center gap-1 shadow-xs transition">
                        <i class="fa-solid fa-download"></i> 立即生成并下载 JS 文件
                    </button>
                </div>
            </div>

            <div class="flex gap-1.5 items-center">
                <select id="presetSelect" class="workspace-input !py-1 text-xs font-semibold text-slate-700 flex-1"></select>
                <button type="button" id="btnLoadPreset" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-xs font-semibold shrink-0 transition-colors flex items-center gap-1">
                    <span id="txtLoadPreset">载入激活</span>
                </button>
                <button type="button" id="btnDeletePreset" class="px-2 py-1 bg-white border border-red-200 text-red-500 hover:bg-red-50 rounded text-xs shrink-0 transition-colors" title="删除"><i class="fa-solid fa-trash-can"></i></button>
            </div>
        </div>

        <!-- 专区 3：第三方库依赖池 -->
        <div class="mb-2.5 p-2 bg-slate-50 border border-slate-200 rounded-lg">
            <div class="flex justify-between items-center cursor-pointer select-none" id="toggleScriptsHeader">
                <span class="text-[0.68rem] font-bold text-slate-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-cubes-stacked text-indigo-500"></i> 调用的外部依赖库 (<span id="scriptCountBadge" class="font-mono">0</span>)
                    <span id="scriptStatusBadge" class="text-[0.6rem] px-1.5 py-0.2 rounded bg-slate-200 text-slate-600 font-normal">检测就绪</span>
                </span>
                <span class="text-[0.63rem] text-indigo-600 hover:underline flex items-center gap-1">
                    <span id="toggleText">展开详情与全局渗透检查</span>
                    <i id="toggleArrow" class="fa-solid fa-chevron-down text-[0.6rem] transition-transform"></i>
                </span>
            </div>
            
            <div id="scriptsBody" class="mt-2 space-y-2 hidden">
                <div class="p-2 bg-amber-50/70 border border-amber-200 rounded text-xs">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-[0.65rem] font-bold text-amber-900 flex items-center gap-1">
                            <i class="fa-solid fa-shield-halved text-amber-600"></i> window 全局变量注入嗅探器：
                        </span>
                    </div>
                    <div id="injectedGlobalsBox" class="flex flex-wrap gap-1 text-[0.63rem]">
                        <span class="text-slate-400 italic">暂无外部全局变量写入</span>
                    </div>
                </div>
                <div id="scriptItemsContainer" class="space-y-1"></div>
                <div class="flex items-center gap-2 pt-1">
                    <button type="button" id="btnAddScriptUrl" class="px-2 py-0.5 bg-white border border-indigo-200 text-indigo-600 rounded text-[0.65rem] font-medium flex items-center gap-1">
                        <i class="fa-solid fa-plus text-[0.6rem]"></i> 添加依赖链接
                    </button>
                    <button type="button" id="btnTriggerLoadScripts" class="px-2 py-0.5 bg-indigo-600 text-white rounded text-[0.65rem] font-medium flex items-center gap-1">
                        <i class="fa-solid fa-bolt text-[0.6rem]"></i> 重新拉取与审计
                    </button>
                </div>
            </div>
        </div>

        <!-- 专区 4：步骤处理链容器 (无省略号列名 + 整体抽屉折叠 + 去边框 + 高度自适应) -->
        <div class="mb-3 border border-slate-200 rounded-lg overflow-hidden bg-slate-50">
            <!-- 步骤区域总控制头：即使有100个步骤也可瞬间收拢 -->
            <div class="flex items-center justify-between px-3 py-2 bg-slate-100/80 cursor-pointer select-none border-b border-slate-200" id="stepsPanelHeader">
                <div class="flex items-center gap-2 min-w-0 flex-1">
                    <i class="fa-solid fa-chevron-down text-[0.65rem] text-indigo-600 transition-transform duration-200" id="stepsPanelChevron"></i>
                    <span class="text-[0.68rem] font-bold text-slate-800 flex items-center gap-1.5">
                        <i class="fa-solid fa-sliders text-indigo-500"></i> 数据处理流水线
                        <span id="stepsCountBadge" class="font-mono text-indigo-600 bg-indigo-100/70 px-1.5 py-0.2 rounded text-[0.62rem]">0</span>
                    </span>
                    <span id="stepsPanelSummary" class="text-[0.62rem] text-slate-400 truncate hidden font-mono"></span>
                </div>
                <div class="flex items-center gap-1.5 shrink-0" onclick="event.stopPropagation()">
                    <button type="button" id="btnToggleAllSteps" class="px-2 py-0.5 bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 rounded text-[0.62rem] font-medium flex items-center gap-1 transition-colors">
                        <i class="fa-solid fa-compress text-[0.55rem]" id="iconToggleAll"></i>
                        <span id="txtToggleAll">全部收起</span>
                    </button>
                </div>
            </div>

            <!-- 步骤列表主体容器：max-height 防暴涨并带微型滚动 -->
            <div id="stepsPanelContent" class="p-2 space-y-2">
                <div id="steps-list" class="space-y-1.5 max-h-[520px] overflow-y-auto pr-1 custom-scroll"></div>
                <button type="button" id="btnAddStep" class="w-full py-1.5 border border-dashed border-indigo-300 hover:border-indigo-500 bg-white hover:bg-indigo-50/50 text-indigo-600 font-semibold text-xs rounded-lg flex items-center justify-center gap-1.5 transition-colors">
                    <i class="fa-solid fa-plus text-xs"></i> 插入处理步骤
                </button>
            </div>
        </div>

        <!-- 试跑表格 -->
        <div class="p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs">
            <div class="flex justify-between items-center text-[0.65rem] text-slate-500 mb-1.5 flex-wrap gap-1">
                <span class="font-bold flex items-center gap-1">
                    <i class="fa-solid fa-table-cells text-indigo-500"></i> 前 3 行试跑效果：
                </span>
                <div class="flex items-center gap-2">
                    <button type="button" id="btnToggleSandbox" class="px-2 py-0.5 rounded text-[0.62rem] font-bold border flex items-center gap-1">
                        <i class="fa-solid fa-lock-open text-[0.6rem]"></i> <span>沙箱已解除</span>
                    </button>
                    <label class="inline-flex items-center cursor-pointer select-none text-[0.62rem] text-slate-600">
                        <input type="checkbox" id="chkErrorTolerance" class="rounded border-slate-300 text-indigo-600 mr-1" checked> 单行容错
                    </label>
                    <span id="status" class="text-slate-400 font-mono">等待就绪...</span>
                </div>
            </div>
            <div class="overflow-x-auto max-h-56 custom-scroll">
                <table class="w-full text-left font-mono text-[0.68rem] border-collapse bg-white rounded border border-slate-200">
                    <thead id="preview-thead"></thead>
                    <tbody id="preview-tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- 提交操作与撤销栏 -->
        <div class="mt-3 flex justify-between items-center flex-wrap gap-2">
            <div class="flex items-center gap-2">
                <span class="text-[0.62rem] text-slate-400 font-mono">iframe 独立计算沙箱</span>
                <button type="button" id="btnUndo" class="hidden px-2 py-0.5 bg-slate-100 hover:bg-slate-200 text-slate-600 border border-slate-300 rounded text-[0.65rem] font-medium flex items-center gap-1">
                    <i class="fa-solid fa-rotate-left text-[0.6rem]"></i> 撤销上次写入
                </button>
            </div>
            <button id="btnApply" class="bg-indigo-600 hover:bg-indigo-700 text-white py-1.5 px-5 text-xs rounded-lg font-semibold flex items-center gap-1 shadow-xs transition-colors">
                <i class="fa-solid fa-play text-[0.65rem]"></i> 链式全量计算并写入
            </button>
        </div>
    </div>

    <!-- 核心逻辑脚本 -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const CARD_ID = urlParams.get('cardId');
        document.getElementById('loadTime').innerText = new Date().toLocaleTimeString();

        let hostHeaders = [];
        let hostRows = [];

        function postToHost(action, payload = {}) {
            if (window.parent) {
                window.parent.postMessage({ cardId: CARD_ID, action, ...payload }, '*');
            }
        }
        function emitToast(message, level = 'info') {
            postToHost('SHOW_TOAST', { message, level });
        }

        // =========================================================================
        // 核心一：挂载全局引擎注册中心与 Catalog 索引库
        // =========================================================================
        const GLOBAL_ENGINE_KEY = '__EXCEL_PIPELINE_ENGINE__';
        const STORAGE_KEY = 'EXCEL_PIPELINE_CUSTOM_PRESETS_V6';
        
        const internalRegistry = new Map();
        const registryListeners = new Set();
        const lazyCatalogMap = new Map(); // 存储从索引目录读取到的预方案 { id: { id, name, url, status: 'pending'|'loaded'|'failed', error: '' } }

        const hubController = {
            version: '6.5.0',
            register(manifest) {
                if (!manifest || !manifest.id || !manifest.name || !Array.isArray(manifest.steps)) {
                    console.error(`[Pipeline Engine] 拒绝注册不合规配置:`, manifest);
                    return false;
                }
                const cleanManifest = {
                    id: String(manifest.id).trim(),
                    name: String(manifest.name).trim(),
                    version: manifest.version || '1.0.0',
                    externalScripts: Array.isArray(manifest.externalScripts) ? manifest.externalScripts : [],
                    steps: manifest.steps.map(s => ({ colName: String(s.colName || '').trim(), code: String(s.code || '') })),
                    registeredAt: new Date().toISOString()
                };

                internalRegistry.set(cleanManifest.id, Object.freeze(cleanManifest));
                registryListeners.forEach(fn => {
                    try { fn(cleanManifest); } catch(e) { console.error(e); }
                });
                return true;
            },
            // 支持注册预方案目录索引
            registerCatalog(list) {
                if (!Array.isArray(list)) return;
                list.forEach(item => {
                    if (item && item.id && item.url) {
                        lazyCatalogMap.set(String(item.id).trim(), {
                            id: String(item.id).trim(),
                            name: String(item.name || item.id).trim(),
                            url: String(item.url).trim(),
                            status: 'pending', // pending, loaded, failed
                            error: ''
                        });
                    }
                });
                updateCatalogUI();
                refreshPresetDropdown();
            },
            get(id) { return internalRegistry.get(id); },
            getAll() { return Array.from(internalRegistry.values()); },
            subscribe(fn) {
                registryListeners.add(fn);
                return () => registryListeners.delete(fn);
            }
        };

        window[GLOBAL_ENGINE_KEY] = Object.freeze({
            version: '6.5.0',
            hub: hubController
        });

        if (window.__PIPELINE_EARLY_PLUGINS__ && Array.isArray(window.__PIPELINE_EARLY_PLUGINS__)) {
            window.__PIPELINE_EARLY_PLUGINS__.forEach(p => hubController.register(p));
            window.__PIPELINE_EARLY_PLUGINS__ = [];
        }

        // =========================================================================
        // 核心二：浏览器 URL 参数索引目录解析器 (按需懒加载机制)
        // =========================================================================
        function updateCatalogUI() {
            const bar = document.getElementById('catalogStatusBar');
            const countTag = document.getElementById('catalogCountTag');
            const count = lazyCatalogMap.size;
            if (count > 0) {
                bar.classList.remove('hidden');
                countTag.innerText = `${count} 个远程预方案待命`;
            } else {
                bar.classList.add('hidden');
            }
        }

        async function initCatalogFromUrl() {
            // 支持参数：?catalog=... 或 ?manifests=... 或 ?index=... 或 ?presets=...
            const catalogUrl = urlParams.get('catalog') || urlParams.get('manifests') || urlParams.get('index') || urlParams.get('presets');
            if (!catalogUrl) return;

            console.log(`[Pipeline Engine] 正在从 URL 探测方案索引目录: ${catalogUrl}`);
            try {
                // 1. 先快照 window 属性
                const beforeProps = new Set(Object.getOwnPropertyNames(window));
                
                // 加载索引 JS
                const res = await loadScriptWithPollutionAudit(catalogUrl, 8000);
                if (res.status === 'loaded') {
                    // 检查标准挂载点 window.__PIPELINE_CATALOG__
                    if (Array.isArray(window.__PIPELINE_CATALOG__)) {
                        hubController.registerCatalog(window.__PIPELINE_CATALOG__);
                        emitToast(`✅ 已通过 URL 成功连接索引库 (${window.__PIPELINE_CATALOG__.length} 个待选方案)`, 'success');
                    } else {
                        // 检查是否有直接注册到 hubController，或者查找新增的全局变量
                        const afterProps = Object.getOwnPropertyNames(window);
                        const newProp = afterProps.find(p => !beforeProps.has(p) && Array.isArray(window[p]));
                        if (newProp) {
                            hubController.registerCatalog(window[newProp]);
                            emitToast(`✅ 索引库已挂载 (${window[newProp].length} 个预方案)`, 'success');
                        }
                    }
                } else {
                    emitToast(`⚠️ URL 索引库加载失败: ${res.message}`, 'warning');
                }
            } catch (err) {
                console.error("解析 URL 索引失败:", err);
            }
        }

        // 监听高度变化同步宿主
        const rootContainer = document.getElementById('pipeline-root');
        const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
                const h = Math.ceil(entry.contentRect.height + 25);
                postToHost('RESIZE_HEIGHT', { height: h });
            }
        });
        resizeObserver.observe(rootContainer);

        // 高度自适应撑开 textarea (代码多长展开多高)
        function autoExpandTextarea(textarea) {
            if (!textarea) return;
            textarea.style.height = 'auto';
            const targetHeight = Math.max(34, textarea.scrollHeight);
            textarea.style.height = targetHeight + 'px';
        }

        // =========================================================================
        // 沙箱与脚本嗅探器
        // =========================================================================
        let isSandboxActive = false;

        function compileCodeEngine(codeStr, isSandbox) {
            let code = (codeStr || '').trim();
            if (!code) return null;
            if (!code.includes('return')) code = 'return (' + code + ');';

            if (!isSandbox) {
                return new Function('row', 'index', 'rows', 'total', code);
            }

            const sandboxWrapperCode = `
                with (sandboxScope) {
                    return (function(row, index, rows, total) {
                        ${code}
                    })(row, index, rows, total);
                }
            `;
            const compiledFn = new Function('sandboxScope', sandboxWrapperCode);
            const SENSITIVE_GLOBALS = new Set([
                'window', 'document', 'top', 'parent', 'self', 'globalThis',
                'localStorage', 'sessionStorage', 'indexedDB', 'fetch', 'XMLHttpRequest', 'location'
            ]);

            return function(row, index, rows, total) {
                const safeContext = {
                    row, index, rows, total,
                    Math, Date, Number, String, Boolean, Array, Object, RegExp, JSON,
                    parseInt, parseFloat, isNaN, isFinite
                };
                const proxyScope = new Proxy(safeContext, {
                    has() { return true; },
                    get(t, p) {
                        if (SENSITIVE_GLOBALS.has(p)) throw new Error(`[沙箱拦截] 严禁调用全局属性 "${p}"`);
                        return p in t ? t[p] : undefined;
                    }
                });
                return compiledFn(proxyScope);
            };
        }

        const scriptAuditCache = new Map();
        async function loadScriptWithPollutionAudit(url, timeoutMs = 8000) {
            url = (url || '').trim();
            if (!url || !/^https?:\/\//i.test(url)) return { url, status: 'invalid', message: 'URL 非法', injectedProps: [] };
            if (scriptAuditCache.has(url)) return scriptAuditCache.get(url);

            const beforeProps = new Set(Object.getOwnPropertyNames(window));
            const p = new Promise((resolve) => {
                const s = document.createElement('script');
                s.src = url;
                s.async = true;
                s.crossOrigin = "anonymous";

                let timer = setTimeout(() => {
                    resolve({ url, status: 'timeout', message: '加载超时', injectedProps: [] });
                }, timeoutMs);

                s.onload = () => {
                    clearTimeout(timer);
                    const afterProps = Object.getOwnPropertyNames(window);
                    const newlyInjected = afterProps.filter(prop => !beforeProps.has(prop));
                    resolve({ url, status: 'loaded', injectedProps: newlyInjected });
                };
                s.onerror = () => {
                    clearTimeout(timer);
                    resolve({ url, status: 'error', message: '跨域 CORS 或 404 不存在', injectedProps: [] });
                };
                document.head.appendChild(s);
            });

            scriptAuditCache.set(url, p);
            return p;

            getCustomList() {

                    return raw ? JSON.parse(raw) : [];
                } catch(e) { return []; }
            },
            saveCustom(name, steps, externalScripts = [], customId = '') {
                const list = this.getCustomList();
                const safeId = customId.trim() || 'custom-' + Date.now();
                const newPreset = {
                    id: safeId,
                    name: name.trim(),
                    createdAt: new Date().toISOString(),
                    externalScripts: externalScripts.filter(url => url.trim()),
                    steps: steps.map(s => ({ colName: s.colName, code: s.code }))
                };
                list.unshift(newPreset);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
                return newPreset;
            },
            deleteCustom(id) {
                let list = this.getCustomList().filter(p => p.id !== id);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
            },
            compileToAtomicStandaloneJS(preset) {
                const safeId = (preset.id || 'preset_' + Date.now()).replace(/[^a-zA-Z0-9_-]/g, '_');
                const manifest = {
                    id: safeId,
                    name: preset.name,
                    version: '1.0.0',
                    createdAt: new Date().toISOString(),
                    externalScripts: preset.externalScripts || [],
                    steps: preset.steps || []
                };

                return `/**
 * [Pipeline Atomic Preset Plugin] ${preset.name}
 * ID: ${safeId}
 */
(function(global) {
    'use strict';
    const ENGINE_KEY = '${GLOBAL_ENGINE_KEY}';
    const manifest = ${JSON.stringify(manifest, null, 4)};

    if (global[ENGINE_KEY] && global[ENGINE_KEY].hub && typeof global[ENGINE_KEY].hub.register === 'function') {
        global[ENGINE_KEY].hub.register(manifest);
    } else {
        global.__PIPELINE_EARLY_PLUGINS__ = global.__PIPELINE_EARLY_PLUGINS__ || [];
        global.__PIPELINE_EARLY_PLUGINS__.push(manifest);
    }
})(typeof window !== 'undefined' ? window : this);
`;
            },
            exportAsJSFile(preset) {
                const jsContent = this.compileToAtomicStandaloneJS(preset);
                const safeId = (preset.id || 'preset_' + Date.now()).replace(/[^a-zA-Z0-9_-]/g, '_');
                const blob = new Blob([jsContent], { type: 'application/javascript;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `pipeline.preset.${safeId}.js`;
                document.body.appendChild(a);
                a.click();

                URL.revokeObjectURL(url);
            }

                const content = ev.target.result;
                try {
                    let manifest = null;
                    const match = content.match(/const\s+manifest\s*=\s*(\{[\s\S]*?\});\s*(?:if\s*\(global|const\s+ENGINE_KEY|$)/);
                    if (match && match[1]) {
                        try {
                            manifest = JSON.parse(match[1]);
                        } catch (err) {
                            manifest = new Function(`return (${match[1]});`)();
                        }
                    } else {
                        const mockGlobal = {
                            [GLOBAL_ENGINE_KEY]: {
                                hub: { register(m) { manifest = m; } }
                            }
                        };
                        new Function('global', 'window', content)(mockGlobal, mockGlobal);
                    }

                    if (!manifest || !manifest.id || !Array.isArray(manifest.steps)) {
                        throw new Error("未能解析出符合规范的 manifest！");

        function refreshPresetDropdown(selectedId = null) {
            const hubPresets = hubController.getAll();
            const customs = PresetStore.getCustomList();
            const lazyItems = Array.from(lazyCatalogMap.values());

            let html = '';

            if (hubPresets.length > 0) {

                hubPresets.forEach(p => {
                    html += `<option value="${p.id}">[原子方案] ${p.name}</option>`;
                });
                html += `</optgroup>`;
            }

            // 3. 本地保存方案
            if (customs.length > 0) {
                html += `<optgroup label="👤 本地保存方案 (${customs.length})">`;
                customs.forEach(p => {
                    html += `<option value="${p.id}">${p.name} (${p.steps.length}步)</option>`;
                });
                html += `</optgroup>`;
            }

            if (!html) html = `<option value="">暂无方案，请配置或通过 URL 挂载</option>`;

            presetSelect.innerHTML = html;
            if (selectedId) presetSelect.value = selectedId;
            updateDeleteBtnState();
        }

        function updateDeleteBtnState() {
            const val = presetSelect.value;
            btnDeletePreset.style.display = (val && val.startsWith('custom-')) ? 'inline-block' : 'none';
        }
        presetSelect.onchange = updateDeleteBtnState;

        async function applyPresetToUI(preset) {
            scriptItemsContainer.innerHTML = '';
            (preset.externalScripts || []).forEach(u => addScriptUrlRow(u));
            stepsListEl.innerHTML = '';
            
            (preset.steps || []).forEach((s, idx) => {
                const defaultCollapsed = (preset.steps.length >= 3) ? (idx > 0) : false;
                addStepDOM(s.colName, s.code, defaultCollapsed);
            });
            await ensureScriptsLoaded();
        }

        // =========================================================================
        // 核心三：点击载入激活时的「按需即时探活与拉取」
        // =========================================================================
        btnLoadPreset.onclick = async () => {
            const targetVal = presetSelect.value;
            if (!targetVal) return;

            // 场景 A：点击的是远程索引里的预方案
            if (targetVal.startsWith('lazy::')) {
                const lazyId = targetVal.replace('lazy::', '');
                const lazyItem = lazyCatalogMap.get(lazyId);
                if (!lazyItem) return;

                // 检查是否已经提前加载过了
                const alreadyRegistered = hubController.get(lazyId);
                if (alreadyRegistered) {
                    emitToast(`正在载入已激活方案【${alreadyRegistered.name}】...`, 'info');
                    await applyPresetToUI(alreadyRegistered);
                    return;
                }

                // 真正发起按需探活与远程拉取
                btnLoadPreset.disabled = true;
                txtLoadPreset.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> 即时拉取中...`;

                const prevCount = hubController.getAll().length;
                const res = await loadScriptWithPollutionAudit(lazyItem.url, 10000);

                btnLoadPreset.disabled = false;
                txtLoadPreset.innerText = `载入激活`;

                if (res.status !== 'loaded') {
                    // 标记失效状态
                    lazyItem.status = 'failed';
                    lazyItem.error = res.message || '网络连接或文件不存在';
                    refreshPresetDropdown(targetVal);
                    alert(`❌ 预方案【${lazyItem.name}】拉取失败或已失效！\n原因: ${lazyItem.error}\n链接: ${lazyItem.url}`);
                    return;
                }

                // 验证该文件是否合规注册了 manifest
                const all = hubController.getAll();
                let mountedPreset = hubController.get(lazyId) || (all.length > prevCount ? all[all.length - 1] : null);

                if (mountedPreset) {
                    lazyItem.status = 'loaded';
                    refreshPresetDropdown(targetVal);
                    emitToast(`🎉 预方案【${lazyItem.name}】远程探活成功并已装载！`, 'success');
                    await applyPresetToUI(mountedPreset);
                } else {
                    lazyItem.status = 'failed';
                    refreshPresetDropdown(targetVal);
                    alert(`⚠️ 预方案文件已拉取，但内部未调用引擎 register() 进行登记注册！`);
                }
                return;
            }

            // 场景 B：普通已载入方案 / 本地方案
            const allPresets = [...hubController.getAll(), ...PresetStore.getCustomList()];
            const found = allPresets.find(p => p.id === targetVal);
            if (found) {
                emitToast(`正在载入方案【${found.name}】...`, 'info');
                await applyPresetToUI(found);
            }
        };

        btnDeletePreset.onclick = () => {
            const targetId = presetSelect.value;
            if (!targetId || !targetId.startsWith('custom-')) return;
            if (!confirm("确定要删除该本地方案吗？")) return;
            PresetStore.deleteCustom(targetId);
            refreshPresetDropdown();
            emitToast("已删除方案", 'info');
        };

        // =========================================================================
        // 试跑与执行
        // =========================================================================
        function runPipelinePreview() {
            const steps = getCurrentSteps();
            if (steps.length === 0 || hostRows.length === 0) {
                previewThead.innerHTML = `<tr><th class="p-1.5 w-10 text-center">#</th><th class="p-1.5">原始快照</th></tr>`;
                previewTbody.innerHTML = `<tr><td colspan="2" class="p-2 text-center text-slate-400">请配置步骤并等待数据同步</td></tr>`;
                statusEl.innerText = "等待就绪...";
                return;
            }

            try {
                const fullSnapshot = buildFullRows();
                const workingData = fullSnapshot.map(r => ({ ...r }));

                for (let step of steps) {
                    if (!step.colName || !step.code) continue;
                    const fn = compileCodeEngine(step.code, isSandboxActive);
                    for (let rIdx = 0; rIdx < workingData.length; rIdx++) {
                        try {
                            workingData[rIdx][step.colName] = fn(workingData[rIdx], rIdx, workingData, workingData.length);
                        } catch (e) {
                            if (!chkErrorTolerance.checked) throw e;
                            workingData[rIdx][step.colName] = '';
                        }
                    }
                }

                // 表头保持完整列名
                previewThead.innerHTML = `<tr class="bg-slate-100 border-b border-slate-200 text-slate-600">
                    <th class="p-1.5 w-10 text-center">#</th>
                    <th class="p-1.5 min-w-[120px]">原始数据快照</th>
                    ${steps.map(s => `<th class="p-1.5 text-indigo-600 bg-indigo-50/50 whitespace-nowrap font-mono">${s.colName || '未命名'}</th>`).join('')}
                </tr>`;

                previewTbody.innerHTML = workingData.slice(0, 3).map((row, idx) => {
                    const snapTxt = Object.entries(fullSnapshot[idx]).slice(0, 2).map(([k, v]) => `${k}:${v}`).join(' | ');
                    return `<tr class="border-b border-slate-100 last:border-none">
                        <td class="p-1.5 text-center text-slate-400">#${idx + 1}</td>
                        <td class="p-1.5 text-slate-500 truncate max-w-[150px]" title="${snapTxt}">${snapTxt || '—'}</td>
                        ${steps.map(s => `<td class="p-1.5 font-bold text-indigo-600 bg-indigo-50/20 whitespace-nowrap">${row[s.colName] ?? ''}</td>`).join('')}
                    </tr>`;
                }).join('');

                statusEl.innerText = `✅ 链路试跑通畅`;
                statusEl.className = "text-emerald-600 font-semibold";
            } catch (err) {
                statusEl.innerText = `❌ 运行报错`;
                statusEl.className = "text-red-500 font-semibold";
                previewTbody.innerHTML = `<tr><td colspan="5" class="p-2 text-red-500 bg-red-50">${err.message}</td></tr>`;
            }
        }

        btnApply.onclick = async () => {
            const steps = getCurrentSteps();
            if (steps.length === 0) return alert("请先配置步骤！");

            btnApply.disabled = true;
            btnApply.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> 计算中...`;

            await ensureScriptsLoaded();

            try {
                const fullSnapshot = buildFullRows();
                const workingData = fullSnapshot.map(r => ({ ...r }));

                for (let step of steps) {
                    const fn = compileCodeEngine(step.code, isSandboxActive);
                    for (let rIdx = 0; rIdx < workingData.length; rIdx++) {
                        workingData[rIdx][step.colName] = fn(workingData[rIdx], rIdx, workingData, workingData.length);
                    }
                }

                postToHost('APPLY_CHANGES', {
                    payload: {
                        compiledColNames: steps.map(s => s.colName),
                        newRowsData: workingData,
                        addedColCount: steps.length
                    }
                });
            } catch (e) {
                alert("执行失败: " + e.message);
                btnApply.disabled = false;
                btnApply.innerHTML = `<i class="fa-solid fa-play text-[0.65rem]"></i> 链式全量计算并写入`;
            }
        };

        btnUndo.onclick = () => postToHost('UNDO_CHANGES');

        // =========================================================================
        // 宿主通信
        // =========================================================================
        window.addEventListener('message', function(e) {
            const data = e.data;
            if (!data || !data.action) return;

            switch (data.action) {
                case 'INIT_DATA': {
                    hostHeaders = data.headers || [];
                    hostRows = data.rawExcelData || [];
                    btnApply.innerHTML = `<i class="fa-solid fa-play text-[0.65rem]"></i> 链式全量计算并写入 (${hostRows.length} 行)`;
                    refreshPresetDropdown();
                    runPipelinePreview();
                    break;
                }
                case 'APPLY_SUCCESS': {
                    btnApply.className = "bg-emerald-100 text-emerald-700 py-1.5 px-5 text-xs rounded-lg cursor-default";
                    btnApply.innerHTML = `<i class="fa-solid fa-check mr-1"></i> 已成功写入宿主`;
                    btnUndo.classList.remove('hidden');
                    break;
                }
                case 'UNDO_SUCCESS': {
                    btnApply.disabled = false;
                    btnApply.className = "bg-indigo-600 hover:bg-indigo-700 text-white py-1.5 px-5 text-xs rounded-lg font-semibold shadow-xs transition-colors";
                    btnApply.innerHTML = `<i class="fa-solid fa-play text-[0.65rem]"></i> 链式全量计算并写入 (${hostRows.length} 行)`;
                    btnUndo.classList.add('hidden');
                    break;
                }
            }
        });

        // 启动时优先尝试从 URL 初始化索引目录
        initCatalogFromUrl();

        // 握手告知宿主
        postToHost('IFRAME_READY');
    </script>
</body>
</html>
