<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aliyun AI Coffee Card Gen</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* ———— 咖啡馆主题样式 ———— */
        :root {
            --coffee-dark: #3E2723;   /* 深烘焙色 */
            --coffee-med: #795548;    /* 摩卡色 */
            --coffee-light: #D7CCC8;  /* 奶泡色 */
            --accent: #FFAB91;        /* 温暖点缀色 */
            --bg-color: #ECEFF1;
        }

        body { margin: 0; padding: 0; display: flex; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #222; height: 100vh; overflow: hidden; color: #333; }
        
        /* 左侧控制区 */
        .editor { width: 400px; background: #2d2d2d; padding: 20px; display: flex; flex-direction: column; z-index: 10; border-right: 1px solid #444; color: #ddd; box-shadow: 2px 0 10px rgba(0,0,0,0.3); }
        
        /* 右侧预览区 */
        .preview-area { flex: 1; display: flex; flex-direction: column; align-items: center; overflow-y: scroll; padding: 40px; background: var(--bg-color); }
        
        #preview-container { width: 375px; margin-bottom: 100px; }

        h2 { color: var(--accent); border-bottom: 1px solid #555; padding-bottom: 10px; margin-top: 0; font-size: 18px; letter-spacing: 1px; display: flex; align-items: center; justify-content: space-between; }
        
        .api-input-group { margin-bottom: 15px; background: #333; padding: 10px; border-radius: 6px; border: 1px solid #555; }
        .api-label { font-size: 12px; color: #aaa; display: block; margin-bottom: 5px; }
        .api-input { width: 95%; padding: 8px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; font-family: monospace; }
        
        textarea { 
            flex: 1; 
            background: #1e1e1e; color: #ddd; border: 1px solid #444; padding: 15px; 
            font-family: monospace; font-size: 12px; resize: none; margin-bottom: 15px; 
            outline: none; border-radius: 4px;
        }
        
        button { 
            padding: 12px; font-size: 14px; font-weight: bold; cursor: pointer; border: none; 
            margin-bottom: 10px; transition: 0.2s; border-radius: 4px; display: flex; 
            align-items: center; justify-content: center; gap: 8px; 
        }
        
        .btn-gen { background: var(--coffee-med); color: #fff; }
        .btn-gen:hover { background: var(--coffee-dark); }
        .btn-download-all { background: #27ae60; color: #fff; }

        .card-wrapper { margin-bottom: 40px; position: relative; }
        .card-actions { display: flex; justify-content: center; margin-top: 10px; gap: 10px; }
        .btn-mini { background: #555; color: #fff; padding: 6px 15px; font-size: 12px; border-radius: 20px; border:none; cursor: pointer;}
        .btn-mini:hover { background: #333; transform: translateY(-1px); }

        /* Loading 动画 */
        .loading-spinner {
            width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.3); 
            border-radius: 50%; border-top-color: var(--coffee-dark); 
            animation: spin 1s ease-in-out infinite; margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

<div class="editor">
    <h2>
        <span>☕ 阿里 AI 绘图版</span>
        <span style="font-size:10px; background:#4CAF50; padding:2px 6px; border-radius:4px; color:white;">Turbo</span>
    </h2>
    
    <div class="api-input-group">
        <label class="api-label">🔑 输入阿里 DashScope API Key:</label>
        <input type="password" id="apiKey" class="api-input" placeholder="sk-xxxxxxxx..." onchange="saveKey()">
    </div>

    <textarea id="jsonInput">
{
  "title": "Coffee Shop Menu",
  "paragraphs": [
    {
      "en": "I'd like a medium Latte with oat milk, please.",
      "cn": "我要一杯中杯的燕麦奶拿铁。",
      "img_keyword": "latte art heart shape in white ceramic cup on wooden table, cozy cafe sunlight, high quality",
      "vocab": [
        {"word": "Latte", "meaning": "拿铁"},
        {"word": "oat milk", "meaning": "燕麦奶"}
      ]
    },
    {
      "en": "An Americano is basically espresso diluted with hot water.",
      "cn": "美式咖啡基本上就是用热水稀释过的浓缩咖啡。",
      "img_keyword": "black american coffee in white cup steam rising, minimalistic, clean background",
      "vocab": [
        {"word": "diluted", "meaning": "稀释"},
        {"word": "Espresso", "meaning": "浓缩咖啡"}
      ]
    },
    {
      "en": "Cappuccinos are famous for their thick layer of milk foam.",
      "cn": "卡布奇诺以其厚厚的奶泡层而闻名。",
      "img_keyword": "cappuccino with thick foam and cocoa powder sprinkle, side view, close up",
      "vocab": [
        {"word": "foam", "meaning": "奶泡"},
        {"word": "layer", "meaning": "层"}
      ]
    }
  ]
}</textarea>
    <button class="btn-gen" onclick="startGeneration()">⚡ 调用阿里 AI 生成 (Cost: Turbo)</button>
    <button class="btn-download-all" onclick="downloadAll()">📦 一键打包下载</button>
    
    <div style="font-size:12px; color:#888; margin-top:10px;">
        ⚠️ <b>注意：</b><br>
        1. 必须填写 API Key 才能生成图片。<br>
        2. 若图片无法加载，请检查是否安装了 Allow CORS 插件。<br>
        3. 图片链接24小时后失效，请及时保存。
    </div>
</div>

<div class="preview-area">
    <div id="preview-container"></div>
</div>

<script>
    // ———— 全局配置 ————
    const COLORS = {
        primary: "#3E2723",    
        accent: "#8D6E63",     
        bg: "#FFFFFF",         
        paper: "#FDFBF7",      
        text: "#2C2C2C",
        tagBg: "#EFEBE9"
    };

    // 本地存储 Key，方便测试
    window.onload = function() {
        const savedKey = localStorage.getItem('dashscope_key');
        if(savedKey) document.getElementById('apiKey').value = savedKey;
    }
    function saveKey() {
        localStorage.setItem('dashscope_key', document.getElementById('apiKey').value);
    }

    // ———— 核心逻辑：分两步 ————
    // 1. 先渲染骨架 (Render Skeleton)
    // 2. 再异步请求阿里 API 填充图片
    async function startGeneration() {
        const apiKey = document.getElementById('apiKey').value;
        if (!apiKey) { alert("请先填写 DashScope API Key！"); return; }

        try {
            const data = JSON.parse(document.getElementById('jsonInput').value);
            const container = document.getElementById('preview-container');
            let html = '';

            // 1. 渲染标题
            html += `
                <section style="margin-bottom: 40px; text-align: center; padding: 40px 20px; background: ${COLORS.paper}; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #D7CCC8;">
                    <div style="font-size: 13px; color: ${COLORS.accent}; letter-spacing: 3px; margin-bottom: 10px; font-weight: 800; text-transform: uppercase;">Barista Vocabulary</div>
                    <h1 style="font-size: 28px; font-family: 'Georgia', serif; font-weight: bold; color: ${COLORS.primary}; margin: 0; line-height: 1.2;">${data.title}</h1>
                    <div style="width: 40px; height: 3px; background: ${COLORS.primary}; margin: 20px auto 0; opacity: 0.8;"></div>
                </section>
            `;

            // 2. 渲染卡片骨架（图片处先放 Loading）
            data.paragraphs.forEach((para, index) => {
                const cardId = `card-node-${index}`;
                const imgId = `img-content-${index}`; // 用于后续替换图片
                
                // 英文高亮
                let enText = para.en;
                if (para.vocab) {
                    para.vocab.sort((a, b) => b.word.length - a.word.length);
                    para.vocab.forEach(v => {
                        const regex = new RegExp(`\\b(${v.word})\\b`, 'gi');
                        enText = enText.replace(regex, `<span style="color: ${COLORS.primary}; font-weight: bold; border-bottom: 2px solid ${COLORS.accent};">${v.word}</span>`);
                    });
                }

                // 单词标签
                let vocabHtml = (para.vocab || []).map(v => 
                    `<span style="display:inline-block; border: 1px solid #D7CCC8; color: ${COLORS.primary}; font-size: 12px; padding: 4px 10px; margin: 0 6px 6px 0; border-radius: 20px; background: ${COLORS.tagBg};">
                        <b style="font-weight:700">${v.word}</b> <span style="opacity:0.7; font-size: 11px;">| ${v.meaning}</span>
                    </span>`
                ).join('');

                html += `
                    <div class="card-wrapper">
                        <div id="${cardId}" style="background: #fff; box-shadow: 0 10px 30px rgba(62, 39, 35, 0.15); border-radius: 8px; overflow: hidden; position: relative;">
                            
                            <!-- 图片区域 -->
                            <div style="width: 100%; height: 320px; overflow: hidden; position: relative; background: #eee; display:flex; align-items:center; justify-content:center;">
                                <img id="${imgId}" src="" crossorigin="anonymous" style="width: 100%; height: 100%; object-fit: cover; display: none;" />
                                <!-- Loading 占位符 -->
                                <div id="loading-${index}" style="text-align:center; color:#888;">
                                    <div class="loading-spinner"></div>
                                    <div style="font-size:12px;">AI Generating...</div>
                                </div>
                            </div>

                            <div style="padding: 30px 25px;">
                                <div style="font-size: 12px; color: ${COLORS.accent}; font-weight: bold; letter-spacing: 2px; margin-bottom: 15px;">ITEM ${String(index+1).padStart(2,'0')}</div>
                                <div style="font-size: 19px; line-height: 1.5; color: ${COLORS.text}; margin-bottom: 20px; font-family: 'Georgia', serif;">${enText}</div>
                                <div style="margin-bottom: 25px;">${vocabHtml}</div>
                                <div style="border-top: 1px solid #EFEBE9; padding-top: 15px; display: flex; align-items: flex-start;">
                                    <span style="background:${COLORS.primary}; color:#fff; font-size: 10px; padding: 2px 6px; border-radius: 2px; margin-right: 8px; margin-top: 2px;">CN</span>
                                    <span style="font-size: 14px; color: #5D4037; line-height: 1.6;">${para.cn}</span>
                                </div>
                            </div>
                        </div>
                        <div class="card-actions">
                            <button class="btn-mini" onclick="captureCard('${cardId}', 'Coffee_${index+1}')">⬇️ 保存图片</button>
                            <button class="btn-mini" onclick="regenerateImage(${index}, '${para.img_keyword}')">🔄 重绘</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            // 3. 触发并发请求 (并行生成)
            data.paragraphs.forEach((para, index) => {
                callAliyunAPI(para.img_keyword, index, apiKey);
            });

        } catch (e) {
            console.error(e);
            alert("JSON 格式错误");
        }
    }

    // ———— 调用阿里 DashScope API (z-image-turbo) ————
    async function callAliyunAPI(prompt, index, apiKey) {
        const loadingDiv = document.getElementById(`loading-${index}`);
        const imgEl = document.getElementById(`img-content-${index}`);
        
        // 优化 Prompt：增加电影质感词汇
        const refinedPrompt = `${prompt}, photorealistic, 8k details, cinematic lighting, shot on 35mm lens, depth of field, professional food photography`;

        try {
            const response = await fetch('https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json',
                    // 'X-DashScope-Async': 'enable' // Turbo 模型同步返回更快，不需要 Async
                },
                body: JSON.stringify({
                    "model": "z-image-turbo",
                    "input": {
                        "messages": [{
                            "role": "user",
                            "content": [{ "text": refinedPrompt }]
                        }]
                    },
                    "parameters": {
                        "size": "1024*1024", // 生成 1:1 方图方便裁剪，或者 1280*720
                        "n": 1
                    }
                })
            });

            const data = await response.json();

            if (data.output && data.output.choices && data.output.choices[0]) {
                const imgUrl = data.output.choices[0].message.content[0].image;
                
                // 成功：显示图片，隐藏 loading
                imgEl.src = imgUrl;
                imgEl.onload = () => {
                    imgEl.style.display = 'block';
                    loadingDiv.style.display = 'none';
                };
            } else {
                console.error("API Error:", data);
                loadingDiv.innerHTML = `<span style="color:red">生成失败<br>${data.code || 'Unknown Error'}</span>`;
            }

        } catch (error) {
            console.error(error);
            loadingDiv.innerHTML = `<span style="color:red">网络错误<br>Check Console</span>`;
        }
    }

    // 单张重绘功能
    function regenerateImage(index, prompt) {
        const apiKey = document.getElementById('apiKey').value;
        if(!apiKey) return alert("API Key Missing");
        
        document.getElementById(`img-content-${index}`).style.display = 'none';
        document.getElementById(`loading-${index}`).style.display = 'block';
        callAliyunAPI(prompt, index, apiKey);
    }

    // ———— 截图保存功能 ————
    async function captureCard(elementId, fileName) {
        const element = document.getElementById(elementId);
        const btn = event.currentTarget;
        const originalText = btn.innerText;
        btn.innerText = "⏳ 处理中...";

        try {
            const canvas = await html2canvas(element, {
                useCORS: true, // 关键：允许跨域图片
                scale: 2,
                backgroundColor: "#ffffff",
                logging: false,
                allowTaint: true 
            });
            const link = document.createElement('a');
            link.download = `${fileName}.png`;
            link.href = canvas.toDataURL("image/png");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            btn.innerText = "✅ 已保存";
            setTimeout(() => btn.innerText = originalText, 2000);
        } catch (err) {
            console.error(err);
            alert("截图失败：请确保安装了'Allow CORS'插件，因为阿里图片服务器不允许直接在浏览器跨域截图。");
            btn.innerText = "❌ 失败";
        }
    }

    async function downloadAll() {
        if(!confirm("⚠️ 提示：\n确保所有图片都已加载完毕。\n确定打包下载吗？")) return;
        const data = JSON.parse(document.getElementById('jsonInput').value);
        for (let i = 0; i < data.paragraphs.length; i++) {
            await captureCard(`card-node-${i}`, `Coffee_Series_${i+1}`);
            await new Promise(r => setTimeout(r, 500)); 
        }
    }
</script>

</body>
</html>
