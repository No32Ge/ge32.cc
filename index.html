<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ge32 - 效率</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- 引入 Font Awesome 图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #05070a;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* 太空背景动画 */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #111827 0%, #05070a 100%);
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 玻璃拟态卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: #3b82f6;
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        /* 霓虹文字效果 */
        .neon-text {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        /* 按钮动画 */
        .btn-glow {
            position: relative;
            overflow: hidden;
        }
        .btn-glow::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, rgba(59, 130, 246, 0.3), transparent 30%);
            animation: rotate 4s linear infinite;
        }
        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- 星空背景 -->
    <div id="stars" class="stars-container"></div>

    <div class="container mx-auto px-4 py-16 relative z-10 min-h-screen flex flex-col justify-center">

            <h1 id="main-title" class="text-5xl md:text-7xl font-extrabold tracking-tighter mb-4 neon-text italic uppercase">
                <!-- 由 JSON 渲染 -->

            <p id="main-subtitle" class="text-gray-400 text-lg md:text-xl font-light tracking-widest uppercase">
                <!-- 由 JSON 渲染 -->

            <div class="w-24 h-1 bg-blue-600 mx-auto mt-6 shadow-[0_0_15px_rgba(37,99,235,0.8)]"></div>
        </header>

        <!-- 导航网格 -->
        <div id="nav-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
            <!-- 由 JSON 渲染 -->
        </div>

        <!-- 页脚 -->

            &copy; Ge32

    </div>

        // 渲染函数
        function renderPage() {
            document.getElementById('main-title').innerText = pageData.title;
            document.getElementById('main-subtitle').innerText = pageData.subtitle;

            const grid = document.getElementById('nav-grid');
            grid.innerHTML = pageData.navigation.map(item => `
                <a href="${item.url}" target="_blank" class="glass-card p-8 rounded-xl flex flex-col justify-between relative overflow-hidden group">
                    ${item.isAd ? '<div class="absolute top-0 right-0 bg-blue-600 text-[10px] px-3 py-1 font-bold uppercase tracking-tighter">Promoted</div>' : ''}
                    <div>
                        <div class="text-blue-500 text-3xl mb-4 group-hover:scale-110 transition-transform duration-300">

                        </div>
                        <h3 class="text-xl font-bold mb-2 tracking-tight">${item.title}</h3>
                        <p class="text-gray-400 text-sm leading-relaxed">${item.desc}</p>
                    </div>
                    <div class="mt-8 flex items-center text-xs font-bold text-blue-400 tracking-widest uppercase">
                        Explore Entry <i class="fa-solid fa-arrow-right ml-2 group-hover:translate-x-2 transition-transform"></i>
                    </div>
                </a>
            `).join('');
        }

        // 生成星空背景
        function createStars() {
            const container = document.getElementById('stars');
            const starCount = 150;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 'px';
                star.style.width = size;
                star.style.height = size;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', Math.random() * 3 + 2 + 's');
                container.appendChild(star);
            }
        }

        // 初始化
        window.onload = () => {
            createStars();
            renderPage();
        };

</body>
</html>
