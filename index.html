<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ge32 - 未来科技入口</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- 引入 Font Awesome 图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #05070a;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* 太空背景动画 */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #111827 0%, #05070a 100%);
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 玻璃拟态卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: #3b82f6;
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        /* 霓虹文字效果 */
        .neon-text {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        /* 广告卡片专属发光动画 */
        .ad-card-glow {
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
    </style>
</head>
<body>

    <!-- 星空背景 -->
    <div id="stars" class="stars-container"></div>

    <div class="container mx-auto px-4 py-16 relative z-10 min-h-screen flex flex-col justify-center">
        <!-- 头部 -->
        <header class="text-center mb-16">
            <h1 id="main-title" class="text-5xl md:text-7xl font-extrabold tracking-tighter mb-4 neon-text italic uppercase">
                <!-- 由 JSON 渲染 -->
            </h1>
            <p id="main-subtitle" class="text-gray-400 text-lg md:text-xl font-light tracking-widest uppercase">
                <!-- 由 JSON 渲染 -->
            </p>
            <div class="w-24 h-1 bg-blue-600 mx-auto mt-6 shadow-[0_0_15px_rgba(37,99,235,0.8)]"></div>
        </header>

        <!-- 导航网格 -->
        <div id="nav-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
            <!-- 由 JSON 渲染 -->
        </div>

        <!-- 页脚 -->
        <footer class="mt-20 text-center text-gray-500 text-sm tracking-widest uppercase">
            &copy; 2024 Ge32 Aerospace & AI. All rights reserved.
        </footer>
    </div>

    <script>
        // 这里是修改后的 JSON 内容
        const pageData = {
            title: "GE32 STATION",
            subtitle: "Exploration • Intelligence • Future",
            navigation: [
                {
                    title: "Listing 智造中心 ⚡", 
                    desc: "想要高产又不想加班？丢给我 ERP 表格，喝杯咖啡的功夫，几百条高转化 Listing 直接到手。",
                    url: "https://www.ge32.cc/listing.html",
                    icon: "fa-solid fa-rocket",
                    tag: "E-Commerce",
                    isAd: true // 开启广告高亮模式
                },
                {
                    title: "Ge Brain AI 助手",
                    desc: "运行在浏览器的智能助手，提供全方位的 AI 支持，助你高效工作。",
                    url: "https://www.ge32.site",
                    icon: "fa-solid fa-microchip",
                    tag: "AI Portal"
                },
                {
                    title: "提示词批量生成器",
                    desc: "Excel转提示词，让 AI 更懂你的意图。",
                    url: "https://www.ge32.cc/tools/prompts.html",
                    icon: "fa-solid fa-terminal",
                    tag: "Knowledge"
                },
                {
                    title: "DeepSeek 自动询问插件",
                    desc: "浏览器插件，自动向 DeepSeek 提问，解放双手，提升效率。",
                    url: "https://www.ge32.cc/deepseeker.html",
                    icon: "fa-solid fa-bolt",
                    tag: "Toolbox"
                },
                {
                    title: "Excel转JSON工具（暂无）",
                    desc: "轻松将 Excel 数据转换为 JSON 格式，适用于各种开发需求。",
                    url: "https://www.ge32.cc/tools/ExcelToJson.html",
                    icon: "fa-brands fa-weixin",
                    tag: "Social"
                },
                {
                    title: "JSON转Excel工具",
                    desc: "便捷的在线工具，将 JSON 数据转换为 Excel 格式，适合数据分析和管理。",
                    url: "https://www.ge32.cc/tools/JsonToExcel.html",
                    icon: "fa-solid fa-code",
                    tag: "Development"
                },
                {
                    title: "Excel生成Html工具",
                    desc: "快速查看生成的Listing数据有没有错误",
                    url: "https://www.ge32.cc/tools/ExcelToHtml.html",
                    icon: "fa-solid fa-code",
                    tag: "Development"
                }
            ]
        };

        // 渲染函数（增加了对 isAd 的专属样式处理）
        function renderPage() {
            document.getElementById('main-title').innerText = pageData.title;
            document.getElementById('main-subtitle').innerText = pageData.subtitle;

            const grid = document.getElementById('nav-grid');
            grid.innerHTML = pageData.navigation.map(item => {
                
                // 判断是否为广告，如果是，赋予特殊的边框、发光效果和上浮样式
                const cardClass = item.isAd 
                    ? "glass-card p-8 rounded-xl flex flex-col justify-between relative overflow-hidden group border-blue-500/50 shadow-[0_0_15px_rgba(59,130,246,0.15)] md:-translate-y-2 ad-card-glow" 
                    : "glass-card p-8 rounded-xl flex flex-col justify-between relative overflow-hidden group";
                
                // 广告专属的渐变色角标
                const badgeHtml = item.isAd 
                    ? '<div class="absolute top-0 right-0 bg-gradient-to-r from-blue-600 to-purple-600 text-white text-[10px] px-4 py-1.5 font-bold uppercase tracking-widest shadow-lg rounded-bl-lg">限时免费体验</div>' 
                    : '';

                // 广告卡片内的文字颜色处理
                const titleColor = item.isAd ? "text-white" : "";
                const iconColor = item.isAd ? "text-blue-400" : "text-blue-500";

                return `
                <a href="${item.url}" target="_blank" class="${cardClass}">
                    ${badgeHtml}
                    <div>
                        <div class="${iconColor} text-3xl mb-4 group-hover:scale-110 transition-transform duration-300">
                            <i class="${item.icon}"></i>
                        </div>
                        <h3 class="text-xl font-bold mb-2 tracking-tight ${titleColor}">${item.title}</h3>
                        <p class="text-gray-400 text-sm leading-relaxed">${item.desc}</p>
                    </div>
                    <div class="mt-8 flex items-center text-xs font-bold text-blue-400 tracking-widest uppercase">
                        ${item.isAd ? '立即开启极速爆单' : 'Explore Entry'} <i class="fa-solid fa-arrow-right ml-2 group-hover:translate-x-2 transition-transform"></i>
                    </div>
                </a>
                `;
            }).join('');
        }

        // 生成星空背景
        function createStars() {
            const container = document.getElementById('stars');
            const starCount = 150;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 'px';
                star.style.width = size;
                star.style.height = size;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', Math.random() * 3 + 2 + 's');
                container.appendChild(star);
            }
        }

        // 初始化
        window.onload = () => {
            createStars();
            renderPage();
        };
    </script>
</body>
</html>
