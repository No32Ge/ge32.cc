<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ge32</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- 引入 Font Awesome 图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="plug/time.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #05070a;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* 太空背景动画 */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #111827 0%, #05070a 100%);
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* 玻璃拟态卡片优化 */
        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(59, 130, 246, 0.1);
        }

        /* 霓虹文字效果 */
        .neon-text {
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
        }

        /* 分类标签样式 */
        .tag-badge {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tag-ai {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.3);
        }

        .tag-tool {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
            border-color: rgba(59, 130, 246, 0.3);
        }

        .tag-dev {
            background: rgba(139, 92, 246, 0.1);
            color: #8b5cf6;
            border-color: rgba(139, 92, 246, 0.3);
        }

        .tag-edu {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            border-color: rgba(245, 158, 11, 0.3);
        }
    </style>
</head>

<body>

    <!-- 星空背景 -->
    <div id="stars" class="stars-container"></div>

    <div class="container mx-auto px-4 py-16 relative z-10 min-h-screen">
        <!-- 头部 -->
        <header class="text-center mb-16">
            <h1 id="main-title"
                class="text-5xl md:text-7xl font-extrabold tracking-tighter mb-4 neon-text italic uppercase">
                <!-- 由 JSON 渲染 -->
            </h1>
            <p id="main-subtitle" class="text-gray-400 text-lg md:text-xl font-light tracking-widest uppercase mb-8">
                <!-- 由 JSON 渲染 -->
            </p>

            <!-- 分类概览栏 -->
            <div class="flex flex-wrap justify-center gap-4 text-xs font-bold uppercase tracking-widest text-gray-500">
                <span class="px-4 py-2 border border-gray-800 rounded-full bg-black/20"><span
                        class="text-green-500 mr-1">●</span> AI Intelligence</span>
                <span class="px-4 py-2 border border-gray-800 rounded-full bg-black/20"><span
                        class="text-blue-500 mr-1">●</span> Productivity</span>
                <span class="px-4 py-2 border border-gray-800 rounded-full bg-black/20"><span
                        class="text-purple-500 mr-1">●</span> Development</span>
                <span class="px-4 py-2 border border-gray-800 rounded-full bg-black/20"><span
                        class="text-orange-500 mr-1">●</span> Education</span>
            </div>
        </header>

        <!-- 导航网格 -->
        <div id="nav-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-6xl mx-auto">
            <!-- 由 JSON 渲染 -->
        </div>

        <!-- 页脚 -->
        <footer class="mt-24 pb-12 text-center text-gray-600 text-sm tracking-[0.2em] uppercase">
            &copy; 2026 Ge32 Aerospace & AI. Designed for the Next Era.
        </footer>
    </div>

    <script>
        const pageData = {
            title: "GE32 STATION",
            subtitle: "Exploration • Intelligence • Future",
            navigation: [
                {
                    "title": "通用SKU筛选器 (变体组扩展)",
                    "desc": "手动配置SKU/父SKU列及任意文本列关键词，命中条件自动提取完整变体组下所有SKU，支持Excel导入导出。",
                    "url": "https://www.ge32.cc/tools/smart-sku-filter.html",
                    "icon": "fa-solid fa-filter",
                    "tag": "Toolbox",
                    "tagClass": "tag-tool"
                },
                {
                    "title": "变体组ID生成器 & 单位换算",
                    "desc": "基于SKU与父SKU自动生成Variant Group ID和Is Primary Variant，同时将重量(g)转换为英镑，长宽高(cm)转换为英寸，支持Excel导入导出。",
                    "url": "https://www.ge32.cc/tools/variant-group-id.html",
                    "icon": "fa-solid fa-layer-group",
                    "tag": "Toolbox",
                    "tagClass": "tag-tool"
                },
                {
                    "title": "沃尔玛数据提取器",
                    "desc": "基于规则自动提取产品文本中的包装数量、件数及总计数，支持批量处理与JSON输出。",
                    "url": "https://www.ge32.cc/tools/counter.html",
                    "icon": "fa-solid fa-cubes",
                    "tag": "Toolbox",
                    "tagClass": "tag-tool"
                },
                {
                    "title": "智能颜色标准化转换器",
                    "desc": "批量映射颜色名称，支持拼写纠错、模糊匹配，一键转换 Excel 颜色值。",
                    "url": "https://www.ge32.cc/tools/colorConverter.html",
                    "icon": "fa-solid fa-palette",
                    "tag": "Toolbox",
                    "tagClass": "tag-tool"
                },
                {
                    title: "Ge32 上架公式计算",
                    desc: "基于运费档位与利润系数，批量智能计算 SKU 的最终美元售价，支持 Excel 导入导出。",
                    url: "https://www.ge32.cc/YUJ/price.html",
                    icon: "fa-solid fa-calculator",
                    tag: "Toolbox",
                    tagClass: "tag-tool"
                },
                {
                    title: "OrbixMind 英语学习",
                    desc: "基于 AI 的沉浸式语言学习平台，像母语者一样思考和交流。",
                    url: "https://orbixmind.com",
                    icon: "fa-solid fa-graduation-cap",
                    tag: "Education",
                    tagClass: "tag-edu"
                },
                {
                    title: "Ge Brain AI 助手",
                    desc: "运行在浏览器的智能助手，提供全方位的 AI 支持，助你高效工作。",
                    url: "https://www.ge32.site",
                    icon: "fa-solid fa-microchip",
                    tag: "AI Portal",
                    tagClass: "tag-ai"
                },
                {
                    title: "提示词批量生成器",
                    desc: "Excel一键转提示词，让 AI 批量处理你的复杂任务。",
                    url: "https://www.ge32.cc/tools/promptStar.html",
                    icon: "fa-solid fa-terminal",
                    tag: "Toolbox",
                    tagClass: "tag-tool"
                },
                {
                    title: "DeepSeek 自动询问",
                    desc: "自动化提问插件，大幅提升与大模型交互的效率。",
                    url: "https://www.ge32.cc/tools/deepseeker.html",
                    icon: "fa-solid fa-bolt",
                    tag: "Toolbox",
                    tagClass: "tag-tool"
                },
                {
                    title: "JSON转Excel工具",
                    desc: "便捷的在线工具，将 JSON 数据转换为 Excel 格式，适合数据分析。",
                    url: "https://www.ge32.cc/tools/JsonToExcel.html",
                    icon: "fa-solid fa-file-csv",
                    tag: "Development",
                    tagClass: "tag-dev"
                },
                {
                    title: "Excel生成Html工具",
                    desc: "快速预览生成的 Listing 数据，确保跨境电商文案完美无缺。",
                    url: "https://www.ge32.cc/tools/ExcelToHtml.html",
                    icon: "fa-solid fa-code",
                    tag: "Development",
                    tagClass: "tag-dev"
                }
            ]
        };

        function renderPage() {
            document.getElementById('main-title').innerText = pageData.title;
            document.getElementById('main-subtitle').innerText = pageData.subtitle;

            const grid = document.getElementById('nav-grid');
            grid.innerHTML = pageData.navigation.map(item => {
                return `
                <a href="${item.url}" target="_blank" class="glass-card p-8 rounded-2xl flex flex-col justify-between relative group overflow-hidden">
                    <!-- 背景装饰光晕 -->
                    <div class="absolute -right-4 -top-4 w-24 h-24 bg-blue-600/5 rounded-full blur-3xl group-hover:bg-blue-600/20 transition-all"></div>
                    
                    <div>
                        <div class="flex justify-between items-start mb-6">
                            <div class="text-blue-500 text-3xl group-hover:scale-110 group-hover:text-blue-400 transition-all duration-300">
                                <i class="${item.icon}"></i>
                            </div>
                            <span class="tag-badge ${item.tagClass}">${item.tag}</span>
                        </div>
                        <h3 class="text-xl font-bold mb-3 tracking-tight text-white group-hover:text-blue-300 transition-colors">${item.title}</h3>
                        <p class="text-gray-400 text-sm leading-relaxed mb-6">${item.desc}</p>
                    </div>
                    
                    <div class="pt-4 border-t border-white/5 flex items-center text-xs font-bold text-blue-500 tracking-[0.2em] uppercase">
                        Launch System <i class="fa-solid fa-chevron-right ml-2 group-hover:translate-x-1 transition-transform"></i>
                    </div>
                </a>
                `;
            }).join('');
        }

        function createStars() {
            const container = document.getElementById('stars');
            const starCount = 150;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 'px';
                star.style.width = size;
                star.style.height = size;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', Math.random() * 3 + 2 + 's');
                container.appendChild(star);
            }
        }

        window.onload = () => {
            createStars();
            renderPage();
        };
    </script>
</body>

</html>
