        // --- B. 极简、健壮的 Markdown 解析引擎（完美翻译 headings, tables, lists, strong） ---
        function renderMarkdown(md) {
            const lines = md.split('\n');
            let html = '';
            let inList = false;
            let inTable = false;
            let tableHeaderParsed = false;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();

                // 1. 空行处理：闭合可能悬挂的列表或表格
                if (line === '') {
                    if (inList) { html += '</ul>'; inList = false; }
                    if (inTable) { html += '</tbody></table></div>'; inTable = false; tableHeaderParsed = false; }
                    continue;
                }

                // 2. 水平分割线
                if (line === '---') {
                    html += '<hr>';
                    continue;
                }

                // 3. 标题解析 (#、##、###)
                if (line.startsWith('# ')) {
                    html += `<h1>${parseInline(line.slice(2))}</h1>`;
                    continue;
                }
                if (line.startsWith('## ')) {
                    html += `<h2>${parseInline(line.slice(3))}</h2>`;
                    continue;
                }
                if (line.startsWith('### ')) {
                    html += `<h3>${parseInline(line.slice(4))}</h3>`;
                    continue;
                }

                // 4. 无序列表解析 (- 或 *)
                if (line.startsWith('- ') || line.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul>';
                        inList = true;
                    }
                    html += `<li>${parseInline(line.slice(2))}</li>`;
                    continue;
                }

                // 5. 表格解析（完美处理原生 markdown table）
                if (line.startsWith('|')) {
                    if (!inTable) {
                        html += '<div class="table-wrapper"><table>';
                        inTable = true;
                        tableHeaderParsed = false;
                    }
                    const cells = line.split('|').map(c => c.trim()).filter((c, idx, arr) => idx > 0 && idx < arr.length - 1);
                    
                    // 略过表格分隔线 row
                    if (cells.every(c => c.startsWith(':') || c.startsWith('-') || c.endsWith('-'))) {
                        continue;
                    }

                    if (!tableHeaderParsed) {
                        html += '<thead><tr>' + cells.map(c => `<th>${parseInline(c)}</th>`).join('') + '</tr></thead><tbody>';
                        tableHeaderParsed = true;
                    } else {
                        html += '<tr>' + cells.map(c => `<td>${parseInline(c)}</td>`).join('') + '</tr>';
                    }
                    continue;
                }

                // 6. 默认段落处理
                if (inList) { html += '</ul>'; inList = false; }
                if (inTable) { html += '</tbody></table></div>'; inTable = false; tableHeaderParsed = false; }
                html += `<p>${parseInline(line)}</p>`;
            }

            // 补收可能未闭合的标签
            if (inList) html += '</ul>';
            if (inTable) html += '</tbody></table></div>';

            return html;
        }

        // 内联强音标签翻译
        function parseInline(text) {
            return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

                    ctx.stroke();
                }

                // 2. 绘制卵圆形的头部
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size * 1.4, this.size, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(247, 249, 252, 0.75)'; // 在混合模式下会完美点亮底色
                ctx.shadowColor = '#f7f9fc';
                ctx.shadowBlur = 5;
                ctx.fill();
                ctx.restore();
            }
        }

        // 初始化
        function initSperm() {
            spermArray = [];
            for (let i = 0; i < numSperm; i++) {
                spermArray.push(new Sperm());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            spermArray.forEach(s => {
                s.update();
                s.draw();
            });
            requestAnimationFrame(animate);
        }

        initSperm();
        animate();


        // --- D. 鼠标滑落精液效果 ---
        const gooeyLayer = document.getElementById('gooey-layer');
        document.addEventListener('mousemove', function(e) {
            if (Math.random() > 0.45) return; // 优化性能，不生硬卡顿
            createSemenDrop(e.pageX, e.pageY);
        });

        function createSemenDrop(x, y) {
            const drop = document.createElement('div');
            drop.className = 'liquid-drop';
            drop.style.left = x + 'px';
            drop.style.top = y + 'px';
            
            const size = Math.random() * 15 + 6;
            drop.style.width = size + 'px';
            drop.style.height = size + 'px';

            gooeyLayer.appendChild(drop);

            setTimeout(() => {
                drop.remove();
            }, 1500);
        }

    </script>
</body>
