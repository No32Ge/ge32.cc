
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SKU DONE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-wrapper">
    <!-- 顶部导航 -->
    <header class="app-header">
        <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-14">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-layer-group text-blue-600 text-xl"></i>
                <h1 class="text-lg font-bold text-gray-800">SKU DONE</h1>
            </div>
            <div class="flex gap-1 bg-gray-100 rounded-lg p-0.5">
                <button id="tabMainBtn" class="tab-btn active"><i class="fa-solid fa-house"></i> 主页</button>
                <button id="tabFilterBtn" class="tab-btn"><i class="fa-solid fa-filter"></i> 筛选</button>
                <button id="tabConfigBtn" class="tab-btn"><i class="fa-solid fa-sliders"></i> 配置</button>
            </div>
        </div>
    </header>

    <!-- 主页 -->
    <div id="mainPage" class="page active max-w-4xl mx-auto px-4 py-6 space-y-6">
        <!-- 文件上传卡片 -->
        <div class="white-card p-5">
            <h2 class="text-base font-semibold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-file-excel text-green-600"></i> 上传数据
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="field-label">📂 上传 Excel</label>
                    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" class="input-white w-full mt-1">
                </div>
                <div>
                    <label class="field-label">📄 工作表</label>
                    <select id="sheetSelect" disabled class="input-white w-full mt-1"><option>— 请先上传 —</option></select>
                </div>
                <div class="flex items-end">
                    <button id="loadSheetBtn" class="btn-white w-full"><i class="fa-solid fa-arrows-rotate"></i> 加载</button>
                </div>
            </div>
        </div>

        <!-- 核心列选择 -->
        <div class="white-card p-5">
            <h2 class="text-base font-semibold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-key text-blue-600"></i> 关键列
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="field-label">🔑 SKU 列</label>
                    <input type="text" id="skuColSelect" class="input-white w-full mt-1" placeholder="输入或选择列名" list="skuColList" autocomplete="off" disabled>
                    <datalist id="skuColList"></datalist>
                </div>
                <div>
                    <label class="field-label">🔗 父SKU 列</label>
                    <input type="text" id="parentColSelect" class="input-white w-full mt-1" placeholder="输入或选择列名" list="parentColList" autocomplete="off" disabled>
                    <datalist id="parentColList"></datalist>
                </div>
            </div>
        </div>

        <!-- 运行与导出 -->
        <div class="white-card p-5">
            <div class="flex flex-wrap gap-3 items-center justify-between">
                <button id="runProcessBtn" class="btn-primary-lg"><i class="fa-solid fa-play"></i> 执行变体组处理</button>
                <div class="flex gap-2">
                    <button id="exportResultBtn" class="btn-white"><i class="fa-solid fa-file-export"></i> 导出结果</button>
                </div>
            </div>
            <div class="flex flex-wrap gap-2 items-center mt-3" id="quickActionsRow">
                <button id="quickPriceBtn" class="btn-white" style="font-size:0.75rem; padding:0.3rem 0.8rem;"><i class="fa-solid fa-calculator"></i> 价格计算</button>
                <button id="quickDedupBtn" class="btn-white" style="font-size:0.75rem; padding:0.3rem 0.8rem;"><i class="fa-solid fa-filter"></i> 执行去重</button>
        
                <button id="quickFixBtn" class="btn-accent-sm hidden"><i class="fa-solid fa-wand-magic-sparkles"></i> 修复颜色</button>
            </div>
            <div class="flex items-center gap-4 mt-3">
                <label class="checkbox-white"><input type="checkbox" id="exportFullCheckbox" /> <span>导出全部列</span></label>
                <label class="checkbox-white"><input type="checkbox" id="exportNewColsCheckbox" checked /> <span>导出生成列</span></label>
                <span class="text-sm text-gray-500" id="dataStatus">⚡ 就绪</span>
            </div>
        </div>

        <!-- 日志 -->
        <div class="white-card p-5">
            <h3 class="font-semibold text-gray-700 mb-2"><i class="fa-solid fa-terminal mr-2"></i>运行日志</h3>
            <div id="logArea" class="log-area-white">等待操作...</div>
        </div>
    </div>

    <!-- 筛选页 -->
    <div id="filterPage" class="page max-w-5xl mx-auto px-4 py-6 space-y-6" style="display:none;">
        <!-- 执行面板 -->
        <div class="white-card p-5">
            <div class="flex flex-wrap gap-3 items-center">
                <button id="filterRunBtn" class="btn-primary"><i class="fa-solid fa-play"></i> 执行筛选</button>
                <button id="filterCopyBtn" class="btn-white"><i class="fa-solid fa-copy"></i> 复制SKU</button>
                <button id="filterSelectAllBtn" class="btn-white"><i class="fa-solid fa-check-double"></i> 全选</button>
                <button id="filterDeleteBtn" class="btn-white" style="border-color:#f5b5b5; color:#b91c1c;"><i class="fa-solid fa-trash"></i> 删除选中</button>
            </div>
            <div class="mt-3 flex items-center gap-2">
                <span class="text-sm text-gray-500">筛选结果：</span>
                <span id="filterResultCount" class="text-sm font-medium">0 个SKU</span>
            </div>
            <div id="filterResultContainer" class="flex flex-wrap gap-2 mt-2 max-h-60 overflow-y-auto p-2 bg-gray-50 rounded-lg"></div>
        </div>

        <!-- 筛选配置管理（默认折叠） -->
        <div class="white-card p-5" id="filterConfigCard">
            <div class="flex justify-between items-center mb-3 toggle-header" id="filterConfigToggleHeader">
                <h3 class="text-base font-semibold text-gray-700 flex items-center gap-2">
                    <i id="filterConfigToggleIcon" class="fa-solid fa-chevron-right text-gray-400"></i> 💾 筛选方案
                </h3>
            </div>
            <div id="filterConfigCollapseWrapper" class="collapsed-content">
                <div class="flex gap-2 mb-3">
                    <input type="text" id="filterConfigNameInput" class="input-white-sm flex-1" placeholder="方案名称">
                    <button id="filterSaveConfigBtn" class="btn-white"><i class="fa-solid fa-floppy-disk"></i> 保存</button>
                </div>
                <div id="filterConfigListContainer" class="space-y-1"></div>
            </div>
        </div>

        <!-- 筛选条件组（添加按钮在顶部） -->
        <div class="white-card p-5">
            <h2 class="text-base font-semibold text-gray-700 mb-4"><i class="fa-solid fa-filter text-blue-600 mr-2"></i>SKU 筛选器</h2>
            <p class="text-xs text-gray-500 mb-4">基于已加载数据，多条件筛选并批量删除行。请先在主页设置SKU列。</p>
            <button id="filterAddConditionBtn" class="btn-white-sm mb-3"><i class="fa-solid fa-plus"></i> 添加条件</button>
            <!-- 条件组 -->
            <div id="filterConditionsContainer" class="space-y-3"></div>
        </div>
    </div>

    <!-- 配置页 -->
    <div id="configPage" class="page max-w-5xl mx-auto px-4 py-6 space-y-6" style="display:none;">
        <!-- 方案管理 -->
        <div class="white-card p-5">
            <div class="flex flex-wrap justify-between items-center">
                <h2 class="text-base font-semibold text-gray-700"><i class="fa-solid fa-folder-open mr-2"></i>方案管理</h2>
                <div class="flex gap-2">
                    <button id="saveConfigBtn" class="btn-white"><i class="fa-solid fa-floppy-disk"></i> 保存方案</button>
                    <button id="exportConfigBtn" class="btn-white"><i class="fa-solid fa-download"></i> 导出</button>
                    <button id="importConfigBtn" class="btn-white" onclick="document.getElementById('importConfigFile').click()"><i class="fa-solid fa-upload"></i> 导入</button>
                    <input type="file" id="importConfigFile" accept=".json" class="hidden">
                </div>
            </div>
            <div id="configListContainer" class="flex flex-wrap gap-2 mt-3"></div>
        </div>

        <!-- 列映射 -->
        <div class="white-card p-5" id="mappingCard">
            <div class="flex justify-between items-center mb-3 toggle-header" id="mappingToggleHeader">
                <h2 class="text-base font-semibold flex items-center gap-2">
                    <i id="mappingToggleIcon" class="fa-solid fa-chevron-down text-gray-500"></i>
                    <i class="fa-solid fa-map-pin text-cyan-600 mr-2"></i> 列映射 (JSON)
                </h2>
                <div class="flex gap-2" onclick="event.stopPropagation()">
                    <button id="mappingFullscreenBtn" class="btn-white-sm" title="全屏编辑"><i class="fa-solid fa-expand"></i></button>
                    <button id="resetMappingBtn" class="btn-white-sm"><i class="fa-solid fa-arrow-rotate-left"></i> 默认</button>
                </div>
            </div>
            <div id="mappingCollapseWrapper" class="expanded-content-mapping">
                <div id="mappingEditorContainer"></div>
            </div>
        </div>

        <!-- 枚举配置 (JSON) -->
        <div class="white-card p-5" id="colorEnumCard">
            <div class="flex justify-between items-center mb-3 toggle-header" id="colorEnumToggleHeader">
                <h2 class="text-base font-semibold flex items-center gap-2">
                    <i id="colorEnumToggleIcon" class="fa-solid fa-chevron-down text-gray-500"></i>
                    <i class="fa-solid fa-palette text-purple-600 mr-2"></i> 枚举配置 (JSON)
                </h2>
                <div class="flex gap-2" onclick="event.stopPropagation()">
                    <button id="colorEnumFullscreenBtn" class="btn-white-sm" title="全屏编辑"><i class="fa-solid fa-expand"></i></button>
                    <button id="resetColorEnumBtn" class="btn-white-sm"><i class="fa-solid fa-arrow-rotate-left"></i> 默认</button>
                    <button id="colorFixBtn" class="btn-accent-sm"><i class="fa-solid fa-wrench"></i> 修复颜色</button>
                </div>
            </div>
            <div id="colorEnumCollapseWrapper" class="expanded-content-color-enum">
                <div id="colorEnumEditorContainer"></div>
                <div id="colorUnmappedMini" class="mt-2 text-xs text-gray-500 hidden"></div>
            </div>
            <!-- 归类执行区域 -->
            <div class="mt-3 border-t border-gray-200 pt-3">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="field-label">📥 源数据列</label>
                        <input type="text" id="classifySourceCol" class="input-white-sm mt-1" placeholder="输入或选择列名" list="classifySourceColList" autocomplete="off">
                        <datalist id="classifySourceColList"></datalist>
                    </div>
                    <div>
                        <label class="field-label">🆕 生成名称</label>
                        <input type="text" id="classifyOutputCol" class="input-white-sm mt-1" placeholder="例如：Color Classification" value="Color Classification">
                    </div>
                </div>
                <button id="classifyRunBtn" class="btn-accent"><i class="fa-solid fa-play"></i> 执行归类</button>
            </div>
        </div>

        <!-- 处理函数 -->
        <div class="white-card p-5" id="codeCard">
            <div class="flex justify-between items-center mb-3 toggle-header" id="codeToggleHeader">
                <h2 class="text-base font-semibold flex items-center gap-2">
                    <i id="codeToggleIcon" class="fa-solid fa-chevron-down text-gray-500"></i>
                    <i class="fa-solid fa-code text-purple-600 mr-2"></i> 处理函数
                </h2>
                <div class="flex gap-2" onclick="event.stopPropagation()">
                    <button id="codeFullscreenBtn" class="btn-white-sm" title="全屏编辑"><i class="fa-solid fa-expand"></i></button>
                    <button id="resetCodeBtn" class="btn-white-sm"><i class="fa-solid fa-arrow-rotate-left"></i> 默认</button>
                </div>
            </div>
            <div id="codeCollapseWrapper" class="expanded-content">
                <div id="codeEditorContainer"></div>
            </div>
        </div>

        <!-- 价格计算器 -->
        <div class="white-card p-5" id="priceCard" style="border-left: 4px solid #3b82f6;">
            <div class="flex justify-between items-center mb-3 toggle-header" id="priceToggleHeader">
                <h2 class="text-base font-semibold flex items-center gap-2">
                    <i id="priceToggleIcon" class="fa-solid fa-chevron-down text-gray-500"></i>
                    <i class="fa-solid fa-calculator text-blue-600 mr-2"></i> 价格计算器
                </h2>
                <div class="flex gap-2" onclick="event.stopPropagation()">
                    <button id="priceFullscreenBtn" class="btn-white-sm" title="全屏编辑"><i class="fa-solid fa-expand"></i></button>
                    <button id="priceResetFieldsBtn" class="btn-white-sm"><i class="fa-solid fa-arrow-rotate-left"></i> 重置字段</button>
                    <button id="priceResetFormulaBtn" class="btn-white-sm"><i class="fa-solid fa-code-branch"></i> 重置公式</button>
                </div>
            </div>
            <div id="priceCollapseWrapper" class="expanded-content-pricing">
                <p class="text-xs text-gray-500 mb-4">配置列、汇率与公式，处理后方可执行。</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
                    <div><label class="field-label">💱 美元汇率</label><input type="number" id="priceRateInput" class="input-white-sm mt-1" value="7.2" step="0.01"></div>
                    <div><label class="field-label">💰 SKU价格 (￥)</label><input type="text" id="priceSkuColSelect" class="input-white-sm mt-1" placeholder="输入或选择" list="priceSkuColList" autocomplete="off"><datalist id="priceSkuColList"></datalist></div>
                    <div><label class="field-label">⚖️ 重量 (g)</label><input type="text" id="priceWeightColSelect" class="input-white-sm mt-1" placeholder="输入或选择" list="priceWeightColList" autocomplete="off"><datalist id="priceWeightColList"></datalist></div>
                    <div><label class="field-label">📦 泡重 (选填)</label><input type="text" id="priceVolWeightColSelect" class="input-white-sm mt-1" placeholder="输入或选择" list="priceVolWeightColList" autocomplete="off"><datalist id="priceVolWeightColList"></datalist></div>
                </div>
                <div class="mb-3">
                    <p class="text-xs text-gray-500 mb-1">自定义公式</p>
                    <div id="priceFormulaContainer"></div>
                </div>
                <div class="flex flex-wrap gap-2 items-center mb-3">
                    <button id="priceRunBtn" class="btn-primary"><i class="fa-solid fa-play"></i> 执行价格计算</button>
                    <span id="priceStatsArea" class="flex flex-wrap gap-2"></span>
                </div>
            </div>
        </div>


        <!-- 数据去重 -->
        <div class="white-card p-5" id="colorDedupCard" style="border-left: 4px solid #10b981;">
            <div class="flex justify-between items-center mb-3 toggle-header" id="dedupToggleHeader">
                <h2 class="text-base font-semibold flex items-center gap-2">
                    <i id="dedupToggleIcon" class="fa-solid fa-chevron-down text-gray-500"></i>
                    <i class="fa-solid fa-filter text-green-600 mr-2"></i> 数据去重
                    <span id="dedupReadyBadge" class="dedup-stat"><span class="dedup-ready-indicator" id="dedupReadyDot"></span><span id="dedupReadyText">等待处理</span></span>
                </h2>
                <div class="flex gap-2" onclick="event.stopPropagation()">
                    <button id="dedupResetFieldsBtn" class="btn-white-sm"><i class="fa-solid fa-arrow-rotate-left"></i> 默认字段</button>
                </div>
            </div>
            <div id="dedupCollapseWrapper" class="expanded-content-dedup">
                <p class="text-xs text-gray-500 mb-4">对相同父类（分组列）下的输入字段值进行去重，生成唯一后缀。</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
                    <div><label class="field-label">📥 输入字段</label><input type="text" id="dedupInputField" class="input-white-sm mt-1" list="dedupColumnsList" autocomplete="off"><div class="field-hint" id="dedupInputHint"></div></div>
                    <div><label class="field-label">🔗 父类分组列</label><input type="text" id="dedupGroupField" class="input-white-sm mt-1" list="dedupColumnsList" autocomplete="off"><div class="field-hint" id="dedupGroupHint"></div></div>
                    <div><label class="field-label">🆕 输出列名</label><input type="text" id="dedupOutputField" class="input-white-sm mt-1" placeholder="去重后值"><div class="field-hint" id="dedupOutputHint"></div></div>
                    <div>
                        <label class="field-label">🔡 去重方案</label>
                        <select id="dedupMode" class="input-white-sm mt-1">
                            <option value="letter">加字母 (A, B, C...)</option>
                            <option value="number">加数字 (1, 2, 3...)</option>
                        </select>
                    </div>
                </div>
                <datalist id="dedupColumnsList"></datalist>
                <div class="flex flex-wrap gap-2 items-center mb-3">
                    <button id="dedupRunBtn" class="btn-accent" disabled><i class="fa-solid fa-wand-magic-sparkles"></i> 执行去重</button>
                    <span id="dedupStatsArea" class="flex flex-wrap gap-2"></span>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://www.ge32.cc/YUJ/map.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/file-handler.js"></script>
<script src="js/editors.js"></script>
<script src="js/color-fix.js"></script>
<script src="js/dedup.js"></script>
<script src="js/process.js"></script>
<script src="js/price-calculator.js"></script>

<script src="js/config-manager.js"></script>
<script src="js/filter.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
